identity:
  private-key: ${GIZCLAW_SERVER_PRIVATE_KEY}
admin-public-key: ${GIZCLAW_ADMIN_PUBLIC_KEY}

listen: 0.0.0.0:9820
endpoint: gizclaw.example.com:9820
serve-to-clients: true

# Dynamic registry of physical locations and connections. Each kind names the
# concrete backend directly; there is no nested driver selector.
storage:
  main-kv:
    kind: badger
    dir: data/kv

  gameplay-db:
    kind: sqlite
    dir: data/gameplay.sqlite

  local-assets:
    kind: filesystem.dir
    dir: data/files

  volc-logs:
    kind: volc-tls
    endpoint: ${GIZCLAW_VOLC_LOG_ENDPOINT}
    region: ${GIZCLAW_VOLC_LOG_REGION}
    access_key_id: ${GIZCLAW_VOLC_LOG_ACCESS_KEY_ID}
    access_key_secret: ${GIZCLAW_VOLC_LOG_ACCESS_KEY_SECRET}

  analytics:
    kind: clickhouse
    dsn: ${GIZCLAW_CLICKHOUSE_DSN}

# Dynamic registry of logical data-access interfaces. Provider-specific scope
# is expressed directly on the Store.
stores:
  logs:
    kind: log.immutable
    storage: volc-logs
    topic_id: ${GIZCLAW_VOLC_LOG_TOPIC_ID}

  metrics:
    kind: metrics
    storage: analytics
    table: gizclaw_metrics

  flowcraft-history:
    kind: log.mutable
    storage: analytics
    database: default
    table: gizclaw_flowcraft_history

  flowcraft-state:
    kind: keyvalue
    storage: main-kv
    prefix: flowcraft-state

  peers:
    kind: keyvalue
    storage: main-kv
    prefix: peers

  public-login:
    kind: keyvalue
    storage: main-kv
    prefix: public-login

  credentials:
    kind: keyvalue
    storage: main-kv
    prefix: credentials

  firmwares:
    kind: keyvalue
    storage: main-kv
    prefix: firmwares

  runtime-profiles:
    kind: keyvalue
    storage: main-kv
    prefix: runtime-profiles

  models:
    kind: keyvalue
    storage: main-kv
    prefix: models

  voices:
    kind: keyvalue
    storage: main-kv
    prefix: voices

  memory-layouts:
    kind: keyvalue
    storage: main-kv
    prefix: memory-layouts

  provider-tenants:
    kind: keyvalue
    storage: main-kv
    prefix: provider-tenants

  workflows:
    kind: keyvalue
    storage: main-kv
    prefix: workflows

  workspaces:
    kind: keyvalue
    storage: main-kv
    prefix: workspaces

  tools:
    kind: keyvalue
    storage: main-kv
    prefix: tools

  contacts:
    kind: keyvalue
    storage: main-kv
    prefix: contacts

  friends:
    kind: keyvalue
    storage: main-kv
    prefix: friends

  friend-groups:
    kind: keyvalue
    storage: main-kv
    prefix: friend-groups

  gameplay:
    kind: keyvalue
    storage: main-kv
    prefix: gameplay

  agenthost:
    kind: objectstore
    storage: local-assets
    prefix: agenthost

  workspace-assets:
    kind: objectstore
    storage: local-assets
    prefix: workspaces

  gameplay-assets:
    kind: objectstore
    storage: local-assets
    prefix: gameplay

  gameplay-db:
    kind: sql
    storage: gameplay-db

# Fixed service schema. Internal collections and indexes are code-owned; each
# service names only one Store per capability it consumes.
services:
  peer:
    store: peers
  public_login:
    store: public-login
  credential:
    store: credentials
  firmware:
    store: firmwares
  runtime_profile:
    store: runtime-profiles
  model:
    store: models
  voice:
    store: voices
  memory_layout:
    store: memory-layouts
  provider_tenants:
    store: provider-tenants
  workflow:
    store: workflows
  workspace:
    store: workspaces
    assets_store: workspace-assets
  toolkit:
    store: tools
  contact:
    store: contacts
  friend:
    store: friends
  friend_group:
    store: friend-groups
  gameplay:
    store: gameplay
    assets_store: gameplay-assets
    database_store: gameplay-db
  agent_host:
    runtime_store: agenthost
    flowcraft:
      state_store: flowcraft-state
      history_store: flowcraft-history
  metrics:
    store: metrics
  system_log:
    level: info
    query_store: logs
    sinks:
      - kind: stderr
      - kind: store
        store: logs
