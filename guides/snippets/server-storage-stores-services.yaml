identity:
  private-key: ${GIZCLAW_SERVER_PRIVATE_KEY}
admin-public-key: ${GIZCLAW_ADMIN_PUBLIC_KEY}

listen: 0.0.0.0:9820
endpoint: gizclaw.example.com:9820
serve-to-clients: true

# Dynamic registry of physical locations and connections. Each kind names the
# concrete backend directly; there is no nested driver selector.
storage:
  database:
    kind: postgresql
    dsn: ${GIZCLAW_POSTGRES_DSN}

  local-assets:
    kind: filesystem.dir
    dir: data/files

  local-runtime:
    kind: sqlite
    dir: data/runtime.sqlite

# Dynamic registry of logical data-access interfaces. Provider-specific scope
# is expressed directly on the Store.
stores:
  logs:
    kind: log.immutable
    storage: database
    table: gizclaw_logs

  metrics:
    kind: metrics
    storage: database
    table: gizclaw_metrics

  flowcraft-history:
    kind: log.mutable
    storage: database
    table: gizclaw_flowcraft_history

  workspace-history:
    kind: log.mutable
    storage: database
    table: gizclaw_workspace_history
    ttl: 720h

  workspace-history-assets:
    kind: objectstore
    storage: local-assets
    prefix: workspace-history
    ttl: 720h

  flowcraft-state:
    kind: keyvalue
    storage: database
    prefix: flowcraft-state

  peers:
    kind: keyvalue
    storage: database
    prefix: peers

  peer-runs:
    kind: keyvalue
    storage: local-runtime
    prefix: peer_runs

  api-keys:
    kind: keyvalue
    storage: database
    prefix: api-keys

  credentials:
    kind: keyvalue
    storage: database
    prefix: credentials

  firmwares:
    kind: keyvalue
    storage: database
    prefix: firmwares

  runtime-profiles:
    kind: keyvalue
    storage: database
    prefix: runtime-profiles

  models:
    kind: keyvalue
    storage: database
    prefix: models

  voices:
    kind: keyvalue
    storage: database
    prefix: voices

  memory-layouts:
    kind: keyvalue
    storage: database
    prefix: memory-layouts

  provider-tenants:
    kind: keyvalue
    storage: database
    prefix: provider-tenants

  workflows:
    kind: keyvalue
    storage: database
    prefix: workflows

  workspaces:
    kind: keyvalue
    storage: database
    prefix: workspaces

  tools:
    kind: keyvalue
    storage: database
    prefix: tools

  contacts:
    kind: keyvalue
    storage: database
    prefix: contacts

  friends:
    kind: keyvalue
    storage: database
    prefix: friends

  friend-groups:
    kind: keyvalue
    storage: database
    prefix: friend-groups

  gameplay:
    kind: keyvalue
    storage: database
    prefix: gameplay

  agenthost:
    kind: objectstore
    storage: local-assets
    prefix: agenthost

  workspace-assets:
    kind: objectstore
    storage: local-assets
    prefix: workspaces

  gameplay-assets:
    kind: objectstore
    storage: local-assets
    prefix: gameplay

  gameplay-db:
    kind: sql
    storage: database

# Fixed service schema. Internal collections and indexes are code-owned; each
# service names only one Store per capability it consumes.
services:
  peer:
    store: peers
  peer_run:
    store: peer-runs
  api_key:
    store: api-keys
  credential:
    store: credentials
  firmware:
    store: firmwares
  runtime_profile:
    store: runtime-profiles
  model:
    store: models
  voice:
    store: voices
  memory_layout:
    store: memory-layouts
  provider_tenants:
    store: provider-tenants
  workflow:
    store: workflows
  workspace:
    store: workspaces
    history_store: workspace-history
    history_assets_store: workspace-history-assets
    assets_store: workspace-assets
  toolkit:
    store: tools
  contact:
    store: contacts
  friend:
    store: friends
  friend_group:
    store: friend-groups
  # Optional. Binds every SFU Workspace on this Server to one LiveKit
  # signaling endpoint. API credentials are loaded from files at startup and
  # never appear in Stores, Peer APIs, events, or logs. Omit the block to
  # disable SFU Workspaces.
  sfu:
    url: wss://sfu.internal
    api_key_file: /etc/gizclaw/sfu/api_key
    api_secret_file: /etc/gizclaw/sfu/api_secret
    recheck_interval: 5s
    reconnect_timeout: 30s
  gameplay:
    store: gameplay
    assets_store: gameplay-assets
    database_store: gameplay-db
  agent_host:
    runtime_store: agenthost
    flowcraft:
      state_store: flowcraft-state
      history_store: flowcraft-history
  metrics:
    store: metrics
  system_log:
    level: info
    query_store: logs
    sinks:
      - kind: stderr
      - kind: store
        store: logs
