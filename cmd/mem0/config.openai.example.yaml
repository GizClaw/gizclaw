# Model access must be qualified with the target OpenAI account.
service:
  max_concurrency: 160
  api_key: "${MEM0_API_KEY}"
  embedding_protocol: openai
memory:
  version: v1.1
  history_db_path: "${MEM0_HISTORY_DB_PATH}"
  llm:
    provider: openai
    config:
      model: gpt-6-luna
      api_key: "${OPENAI_API_KEY}"
      reasoning_effort: none
      max_tokens: 8192
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      api_key: "${OPENAI_API_KEY}"
      embedding_dims: 1024
  vector_store:
    provider: pgvector
    config:
      connection_string: "${MEM0_POSTGRES_DSN}"
      collection_name: gizclaw_memory_openai_v1
      embedding_model_dims: 1024
      hnsw: true
      minconn: 4
      maxconn: 32
