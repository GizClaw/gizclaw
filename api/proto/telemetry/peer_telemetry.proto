syntax = "proto3";

package gizclaw.telemetry.v1;

option go_package = "github.com/GizClaw/gizclaw-go/pkgs/gizclaw/api/telemetry;telemetrypb";

message TelemetryFrame {
  uint32 sequence = 1;
  int64 observed_at_unix_ms = 2;
  repeated Observation observations = 3;
}

message Observation {
  int32 observed_at_delta_ms = 1;

  oneof body {
    BatteryObservation battery = 10;
    GnssObservation gnss = 11;
    NetworkObservation network = 12;
    SystemObservation system = 13;
    OtaObservation ota = 14;
    AudioPlayerObservation audioplayer = 15;
  }
}

message BatteryObservation {
  optional double percent = 1;
  optional bool charging = 2;
  optional double voltage_mv = 3;
}

message GnssObservation {
  double latitude = 1;
  double longitude = 2;
  optional double altitude_m = 3;
  optional double accuracy_m = 4;
}

message NetworkObservation {
  optional double rssi_dbm = 1;
  optional double signal_level = 2;
  optional string rat = 3;
  optional string operator = 4;
  optional bool connected = 5;
}

message SystemObservation {
  optional double uptime_seconds = 1;
  optional double free_memory_bytes = 2;
  optional double temperature_c = 3;
  optional string firmware_version = 4;
  optional string software_version = 5;
  optional string hardware_version = 6;
}

// Device-reported state of one OTA attempt. Download completion is not success.
enum OtaState {
  OTA_STATE_UNSPECIFIED = 0;
  OTA_STATE_STARTED = 1;
  OTA_STATE_DOWNLOADING = 2;
  OTA_STATE_SUCCEEDED = 3;
  OTA_STATE_FAILED = 4;
}

message OtaObservation {
  // Required, nonzero state. Success means the device confirmed the update.
  OtaState state = 1;
  // Required opaque identifier, reused across one attempt (1..128 UTF-8 bytes).
  string update_id = 2;
  // Optional target firmware version (at most 128 UTF-8 bytes).
  optional string target_version = 3;
  // Download percentage in [0, 100]; required while downloading. Zero is present.
  optional double download_percent = 4;
  // Optional diagnostic code and safe message, only for FAILED (128/512 bytes).
  // Never include credentials, signed URLs, or other secrets.
  optional string error_code = 5;
  optional string error_message = 6;
}

// Complete snapshot of the device's single player. Timestamp comes from the
// enclosing observation. No URLs, playlist bodies or per-play identifiers.
message AudioPlayerObservation {
  string state = 1; // stopped/buffering/playing/ended/error; at most 16 bytes.
  optional uint32 current_index = 2;
  uint64 position_ms = 3;
  optional uint64 duration_ms = 4;
  string repeat = 5; // off/one/all.
  uint32 playlist_length = 6; // 0..32.
  uint32 playlist_revision = 7;
  optional string error_code = 8; // Only for error; at most 128 UTF-8 bytes.
  optional string error_message = 9; // Only for error; at most 512 UTF-8 bytes.
}
