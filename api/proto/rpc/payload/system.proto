// Peer RPC system payload protobuf schema.

syntax = "proto3";

import "payload/audioplayer.proto";
import "rpc.proto";

package gizclaw.rpc.v1;


option go_package = "github.com/GizClaw/gizclaw-go/pkgs/gizclaw/api/rpcproto;rpcpb";

message ClientGetIdentifiersRequest {
}

message ClientGetIdentifiersResponse {
  DeviceIdentifiers value = 1;
}

message ClientGetInfoRequest {
}

message ClientGetInfoResponse {
  HardwareInfo value = 1;
}

message ClientDeviceStatusGetRequest {
}

message ClientDeviceStatusGetResponse {
  PeerStatus value = 1;
}

message ClientDeviceSoundPlayRequest {
  string sound = 1;
  optional int64 duration_ms = 2;
}

message ClientDeviceSoundPlayResponse {
}

// ClientDeviceFactoryResetRequest erases device-local state. It is
// irreversible on the device; the Server keeps its own peer records.
message ClientDeviceFactoryResetRequest {
  // Keep saved Wi-Fi networks and cellular configuration so the device can
  // reconnect without being re-provisioned. Defaults to false.
  optional bool keep_network = 1;
}

message ClientDeviceFactoryResetResponse {
}

// ClientRunWorkspaceSetRequest asks the device to switch its running Workspace
// to workspace_name, an available Workspace the device's owner owns. The Server
// resolves a control-app workflow target to this one name before calling, so
// the device reloads it directly. The device answers once it has accepted the
// request, then switches through server.run.workspace.reload-with-options; the
// committed result is the Workspace the Server reports, not this response.
message ClientRunWorkspaceSetRequest {
  string workspace_name = 1;
  // Let the agent speak first once the Workspace is ready. Defaults to false.
  optional bool kickoff = 2;
}

message ClientRunWorkspaceSetResponse {
}

message ClientRpcMethodsListRequest {
}

// ClientRpcMethodsListResponse lists the RPC methods the device implements, as
// RpcMethod numbers rather than names: the set is small, fixed and numeric, so
// a constrained device answers from a handful of varints instead of a table of
// strings. It is how a caller learns which protocol families and versions the
// device speaks, for example mhs/v0 through 133 and 134 or tool/v0 through 135
// and 136; a later mhs/v1 or tool/v1 appears here as its own numbers. Which
// individual tools tool/v0 offers is a separate question, answered by
// client.tool.v0.list. Unknown numbers must be ignored rather than rejected.
message ClientRpcMethodsListResponse {
  repeated RpcMethod methods = 1;
}

// ClientDeviceFindRequest asks the device to play its built-in find-me sound.
// duration_ms is the requested ring time; the device picks its own default
// when it is absent.
message ClientDeviceFindRequest {
  optional int64 duration_ms = 1;
}

message ClientDeviceFindResponse {
}

message ClientDeviceRebootRequest {
  optional int64 delay_ms = 1;
}

message ClientDeviceRebootResponse {
}

message WifiSavedNetwork {
  string ssid = 1;
}

message ClientWifiSavedListRequest {
}

message ClientWifiSavedListResponse {
  repeated WifiSavedNetwork networks = 1;
}

message ClientWifiSavedForgetRequest {
  string ssid = 1;
}

message ClientWifiSavedForgetResponse {
}

message WifiScanResult {
  string ssid = 1;
  optional string bssid = 2;
  optional int64 rssi_dbm = 3;
  optional int64 frequency_mhz = 4;
  optional string security = 5;
}

message ClientWifiScanRequest {
  optional int64 timeout_ms = 1;
}

message ClientWifiScanResponse {
  repeated WifiScanResult networks = 1;
}

message ClientWifiConnectRequest {
  string ssid = 1;
  optional string passphrase = 2;
}

message ClientWifiConnectResponse {
}

message DeviceInfo {
  optional HardwareInfo hardware = 1;
  optional string name = 2;
  optional string emoji = 4;
  optional DeviceIdentifiers identifiers = 5;
}

message DeviceProfile {
  optional string name = 1;
  optional string emoji = 2;
}

message DeviceIdentifiers {
  optional string sn = 1;
  repeated PeerIMEI imeis = 2;
  repeated PeerLabel labels = 3;
}

message HardwareInfo {
  optional string hardware_revision = 1;
  optional string manufacturer = 2;
  optional string model = 3;
}

message PeerIMEI {
  optional string name = 1;
  string serial = 2;
  string tac = 3;
}

message PeerLabel {
  string key = 1;
  string value = 2;
}

// Latest OTA snapshot read from the device runtime status store.
message PeerOtaStatus {
  string state = 1;
  string update_id = 2;
  string observed_at = 3;
  optional double download_percent = 4;
  optional string target_version = 5;
  optional string error_code = 6;
  optional string error_message = 7;
}

message PeerStatus {
  optional PeerOtaStatus ota = 13;
  optional int64 battery_percent = 1;
  optional bool charging = 2;
  optional string firmware_sha256 = 12;
  optional AudioPlayerStatus audioplayer = 14;
  optional double gnss_accuracy_m = 4;
  optional double gnss_altitude_m = 5;
  optional double gnss_latitude = 6;
  optional double gnss_longitude = 7;
  map<string, string> labels = 8;
  optional bool muted = 9;
  optional string reported_at = 10;
  optional int64 volume = 11;
  optional string network_imei = 15;
  optional string network_imsi = 16;
  // Per-field observation times for the telemetry-sourced members above.
  optional PeerStatusTelemetryObservedAt telemetry_observed_at = 17;
  // Feature the device reports it is currently using. Readers must preserve
  // unknown future values.
  optional string activity = 18;
  optional string activity_detail = 19;
  // Human-readable firmware release the device reports running, next to the
  // exact-package firmware_sha256 digest.
  optional string firmware_version = 20;
  // Latest signal per route, from network telemetry: an observation whose rat
  // is wifi sets the Wi-Fi RSSI, any other rat sets the cellular RSSI and the
  // device-defined cellular signal level. One without rat names no route and
  // stays a metric only.
  optional double wifi_rssi_dbm = 21;
  optional double cellular_rssi_dbm = 22;
  optional double cellular_signal_level = 23;
}

// PeerStatusTelemetryObservedAt records when the device observed the value now
// stored in each sibling PeerStatus field, as an RFC 3339 timestamp. The
// Server uses these to reject an out-of-order or replayed report without
// overwriting a newer observation. A member is empty until first observed.
message PeerStatusTelemetryObservedAt {
  optional string battery_percent = 1;
  optional string charging = 2;
  optional string gnss_latitude = 3;
  optional string gnss_longitude = 4;
  optional string gnss_altitude_m = 5;
  optional string gnss_accuracy_m = 6;
  optional string network_imei = 7;
  optional string network_imsi = 8;
  optional string activity = 9;
  optional string firmware_version = 10;
  optional string wifi_rssi_dbm = 11;
  optional string cellular_rssi_dbm = 12;
  optional string cellular_signal_level = 13;
}

message PingRequest {
  int64 client_send_time = 1;
}

message PingResponse {
  int64 server_time = 1;
}

message ServerRegisterRequest {
  string token = 1;
}

message ServerRegisterResponse {
  string runtime_profile_name = 1;
}

// AppConfig is the opaque device-defined configuration downlink carried by the
// selected RuntimeProfile. The Server stores and returns every value verbatim
// and never parses it; Clients read it and cannot write it.
message AppConfigListRequest {
  optional string cursor = 1;
  optional int64 limit = 2;
}

message AppConfigListResponse {
  repeated string keys = 1;
  bool has_next = 2;
  optional string next_cursor = 3;
  string runtime_profile_name = 4;
  string runtime_profile_revision = 5;
}

message AppConfigGetRequest {
  string key = 1;
}

message AppConfigGetResponse {
  string value = 1;
  string runtime_profile_name = 2;
  string runtime_profile_revision = 3;
}

message APIKey {
  string name = 1;
  string display_name = 2;
  string prefix = 3;
  bool manage_api_keys = 4;
  string created_at = 5;
  string api_key = 6;
}

message APIKeyCreateRequest {
  string display_name = 1;
  bool manage_api_keys = 2;
}

message APIKeyCreateResponse {
  APIKey value = 1;
  string api_key = 2;
}

message APIKeyListRequest {
  optional string cursor = 1;
  optional int64 limit = 2;
}

message APIKeyListResponse {
  repeated APIKey items = 1;
  optional string next_cursor = 2;
}

message APIKeyRevokeRequest {
  string name = 1;
}

message APIKeyRevokeResponse {
}

message ServerPeerDeleteRequest {
}

message ServerPeerDeleteResponse {
}
message Runtime {
  optional string debug_mode = 6;
  optional string last_addr = 1;
  string last_seen_at = 2;
  bool online = 3;
  optional uint64 rx_bytes = 4;
  optional uint64 tx_bytes = 5;
  optional string active_workspace_name = 7;
  optional string pending_workspace_name = 8;
}

message ServerGetInfoRequest {
}

message ServerGetInfoResponse {
  DeviceInfo value = 1;
}

message ServerGetStatusRequest {
}

message ServerGetStatusResponse {
  PeerStatus value = 1;
}

message ServerPutInfoRequest {
  DeviceProfile value = 1;
}

message ServerPutInfoResponse {
  DeviceInfo value = 1;
}

// ProfileGetRequest looks up the public profile of up to 16 Peers by public
// key. Any registered Peer may look up any other Peer.
message ProfileGetRequest {
  repeated string peer_public_keys = 1;
}

// ProfileGetResponse holds one item per distinct requested key, in request
// order. A Peer that does not exist, or has not set a field, has that field
// absent.
message ProfileGetResponse {
  repeated PublicProfile items = 1;
}

// PublicProfile is the public projection of a Peer's DeviceInfo. It carries
// only the self-chosen display name and emoji; online state, hardware,
// identifiers and location never enter it.
message PublicProfile {
  string peer_public_key = 1;
  optional string display_name = 2;
  optional string emoji = 3;
}

message SpeedTestRequest {
  int64 down_content_length = 1;
  int64 up_content_length = 2;
}

message SpeedTestResponse {
  int64 down_content_length = 1;
  int64 up_content_length = 2;
}

message ServerPutRuntimeRequest {
  string debug_mode = 1;
}

message ServerPutRuntimeResponse {
  string debug_mode = 1;
}
