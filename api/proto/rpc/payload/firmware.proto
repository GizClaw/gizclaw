// Peer RPC firmware payload protobuf schema.

syntax = "proto3";

package gizclaw.rpc.v1;

import "payload/enums.proto";

option go_package = "github.com/GizClaw/gizclaw-go/pkgs/gizclaw/api/rpcproto;rpcpb";

message FirmwareGetRequest {
  FirmwareChannelName channel = 1;
}

message FirmwareGetResponse {
  FirmwareChannelName channel = 1;
  optional string description = 2;
  string url = 3;
  string sha256 = 4;
  int64 size = 5;
  // SemVer 2.0.0 package release version, at most 128 ASCII bytes.
  // Absent when the stored package has no version.
  optional string version = 6;
}

message ClientFirmwareUpdateRequest {
  optional FirmwareChannelName channel = 1;
  optional string sha256 = 2;
}

message ClientFirmwareUpdateResponse {
}
