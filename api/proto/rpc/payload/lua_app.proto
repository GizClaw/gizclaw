// Device-owned Lua applications. Installation consumes the GizOS format-1
// lua-app USTAR archive wrapped in a zlib stream (.lua-app.tar.zlib).
syntax = "proto3";
package gizclaw.rpc.v1;
option go_package = "github.com/GizClaw/gizclaw-go/pkgs/gizclaw/api/rpcproto;rpcpb";

// app_id is the package's stable identity, not a filesystem path or Peer ID.
message LuaAppInfo {
  string app_id = 1; // 1..32 ASCII bytes: [a-z0-9_-][a-z0-9_.-]*.
  string version = 2; // App-owned SemVer, at most 31 UTF-8 bytes.
  optional string display_name = 3; // At most 128 UTF-8 bytes.
  optional string description = 4; // At most 1024 UTF-8 bytes; may describe parameters.
}

message ClientLuaAppListRequest {
}
message ClientLuaAppListResponse {
  repeated LuaAppInfo apps = 1; // At most 32 installed, runnable applications; unique app_id.
}

// The device downloads and validates the complete manifest and every payload
// before publishing the installation. Success means installed, not queued.
// Failure preserves the previous app and its user data. Insufficient storage
// or an unavailable installer returns UNIMPLEMENTED (HTTP DEVICE_UNSUPPORTED).
// No automatic retry. The Server does not download or unpack the URL.
message ClientLuaAppInstallRequest {
  string url = 1; // HTTPS, no credentials or fragment, 1..1024 UTF-8 bytes.
  optional string sha256 = 2; // Expected compressed archive SHA-256, 64 hex digits.
}
message ClientLuaAppInstallResponse {
  LuaAppInfo app = 1;
}

// Select an app_id returned by lua.app.list. Parameters map directly to GizOS
// h2_lua_arg_t and the Lua args table: both keys and values are strings.
// At most 16 parameters; keys 1..64 UTF-8 bytes, values 0..1024 bytes;
// total key+value bytes at most 4096. NUL is forbidden. Omitted params is empty.
// NOT_FOUND means the app is not installed. Respond before handing over the UI
// or disconnecting. Success acknowledges launch acceptance, not game completion.
message ClientLuaAppRunRequest {
  string app_id = 1;
  map<string, string> params = 2;
}
message ClientLuaAppRunResponse {
}
