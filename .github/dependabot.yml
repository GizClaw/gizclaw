version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/audio_player
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/genx
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/songs
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/voiceprint
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /examples/webrtc_sfu
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @hey-api/openapi-ts (sdk/js gen:sdk) declares typescript >=5.5.3 || >=6.0.0
      # and crashes on the TypeScript 7 native compiler; revisit when it supports 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      workspace-tooling:
        patterns:
          - typescript
          - "@hey-api/*"
      workspace-noble:
        patterns:
          - "@noble/curves"
          - "@noble/hashes"
          - "@noble/ciphers"

  - package-ecosystem: npm
    directory: /tests/gizclaw-e2e/js
    schedule:
      interval: weekly
