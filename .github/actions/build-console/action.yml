name: Build embedded monitoring console
description: Prepare static assets required by Go builds and tests
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        cache: npm
    - shell: bash
      run: npm ci && npm run build:console
