name: Monitor Package

on:
  pull_request:
    paths:
      - ".github/workflows/monitor-release.yml"
      - "package.json"
      - "package-lock.json"
      - "web/console/**"
      - "web/assistant/**"
      - "sdk/js/**"
      - "guides/zh/**"
      - "LICENSE"
  push:
    branches:
      - main
    tags:
      - "monitor-v*"
    paths:
      - ".github/workflows/monitor-release.yml"
      - "package.json"
      - "package-lock.json"
      - "web/console/**"
      - "web/assistant/**"
      - "sdk/js/**"
      - "guides/zh/**"
      - "LICENSE"

concurrency:
  group: monitor-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Standalone Monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build standalone monitor without Go
        run: npm run build --workspace @gizclaw/monitor

      - name: Test monitor and assistant
        run: |
          npm run test:standalone --workspace @gizclaw/monitor
          npm test --workspace @gizclaw/assistant

      - name: Verify an offline install of the npm package
        run: npm run test:package --workspace @gizclaw/monitor

      - name: Pack the verified monitor
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            node web/console/package.mjs --tag "$RELEASE_TAG"
          fi
          mkdir -p .tmp/monitor
          npm pack --workspace @gizclaw/monitor --ignore-scripts --pack-destination .tmp/monitor
          cd .tmp/monitor
          for archive in *.tgz; do
            sha256sum "$archive" >"$archive.sha256"
          done

      - name: Upload npm release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: monitor-npm
          path: .tmp/monitor/*
          if-no-files-found: error

  release:
    name: Publish Independent Monitor Release
    if: startsWith(github.ref, 'refs/tags/monitor-v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified npm assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: monitor-npm
          path: .tmp/monitor

      - name: Publish or verify the immutable monitor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^monitor-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#monitor-v}"
          source_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$source_commit" = "$GITHUB_SHA"
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main
          remote_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f1)"
          test "$source_commit" = "$remote_commit"
          archive="gizclaw-monitor-$version.tgz"
          test "$(find .tmp/monitor -type f | wc -l)" -eq 2
          (cd .tmp/monitor && sha256sum --check "$archive.sha256")

          release="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | if length <= 1 then .[0] else error("duplicate release tag") end')"
          if [[ "$release" == null ]]; then
            gh release create "$RELEASE_TAG" ".tmp/monitor/$archive" ".tmp/monitor/$archive.sha256" \
              --draft --verify-tag --target "$source_commit" --latest=false \
              --title "Monitor $version" \
              --notes "Standalone @gizclaw/monitor $version from $source_commit. Install the npm tarball with npm or npx; no Server or Edge update is required. See https://gizclaw.github.io/gizclaw/zh/developing/monitor for configuration."
          fi

          gh release view "$RELEASE_TAG" --json targetCommitish,isPrerelease,assets |
            jq -e --arg source "$source_commit" --arg archive "$archive" '
              .targetCommitish == $source and .isPrerelease == false and
              ([.assets[].name] | sort) == ([$archive, ($archive + ".sha256")] | sort)'
          verify_dir="$(mktemp -d "$RUNNER_TEMP/monitor-release.XXXXXX")"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          cmp ".tmp/monitor/$archive" "$verify_dir/$archive"
          cmp ".tmp/monitor/$archive.sha256" "$verify_dir/$archive.sha256"
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi
          gh release view "$RELEASE_TAG" --json isDraft,url | jq -er 'select(.isDraft == false) | .url'
