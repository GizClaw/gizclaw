name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select Release Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.contract.outputs.source_commit }}
      source_epoch: ${{ steps.contract.outputs.source_epoch }}
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve immutable build identity
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]] || {
            echo "formal releases must be triggered by a tag push" >&2
            exit 1
          }
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "formal release tags must be canonical stable SemVer" >&2
            exit 1
          }
          version="${tag#v}"
          source_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main || {
            echo "formal release commit is not reachable from the current protected main head" >&2
            exit 1
          }

          source_epoch="$(git show -s --format=%ct "$source_commit")"
          {
            echo "source_commit=$source_commit"
            echo "source_epoch=$source_epoch"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  mem0-image:
    name: Mem0 Image Archive (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Test, export or reuse and load the immutable image archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TARGET=test PLATFORM="linux/$ARCH" IMAGE=mem0-contract-test build/build-mem0.sh
          docker run --rm mem0-contract-test --help
          status=0
          build/reuse-container-archive.sh mem0 .tmp/release .tmp/container-metadata "$TAG" "$SOURCE_COMMIT" "$ARCH" || status=$?
          if [[ "$status" == 3 ]]; then
            image="gizclaw-mem0:${SOURCE_COMMIT}-${ARCH}"
            PLATFORM="linux/$ARCH" IMAGE="$image" BUILD_VERSION="$VERSION" BUILD_COMMIT="$SOURCE_COMMIT" build/build-mem0.sh
            build/package-container-image.sh mem0 "$image" .tmp/release .tmp/container-metadata "$TAG" "$SOURCE_COMMIT" "$ARCH"
          elif [[ "$status" != 0 ]]; then
            exit 1
          fi
          build/check-container-archive.sh ".tmp/container-metadata/container-mem0-${ARCH}.json" "$TAG" "$SOURCE_COMMIT" .tmp/release
      - name: Upload Mem0 Release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-mem0-${{ matrix.arch }}
          path: .tmp/release/*
          compression-level: 0
          if-no-files-found: error
      - name: Upload container metadata part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-metadata-mem0-${{ matrix.arch }}
          path: .tmp/container-metadata/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} Release Asset
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Install Debian validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils dpkg-dev

      - name: Build native Linux executable
        env:
          PLATFORM: linux/${{ matrix.arch }}
          OUTPUT: ${{ runner.temp }}/gizclaw-linux-${{ matrix.arch }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: ./build/build-linux.sh

      - name: Verify native Linux executable
        env:
          BINARY: ${{ runner.temp }}/gizclaw-linux-${{ matrix.arch }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          file "$BINARY"
          docker run --rm --platform linux/${{ matrix.arch }} \
            --volume "$BINARY:/gizclaw:ro" \
            ubuntu:24.04 \
            sh -c 'test "$(/gizclaw --version)" = "gizclaw version $1" && /gizclaw --help >/dev/null' \
            sh "$BUILD_VERSION"

      - name: Build and validate Debian package
        env:
          BINARY: ${{ runner.temp }}/gizclaw-linux-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
        run: |
          mkdir -p .tmp/release
          package=".tmp/release/gizclaw_${VERSION}_${{ matrix.arch }}.deb"
          build/package-deb.sh \
            --binary "$BINARY" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --source-epoch "$SOURCE_EPOCH" \
            --architecture "${{ matrix.arch }}" \
            --output "$package"
          build/check-deb.sh \
            --package "$package" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --architecture "${{ matrix.arch }}"

      - name: Export or reuse and load the production image archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          status=0
          build/reuse-container-archive.sh runtime .tmp/release .tmp/container-metadata "$TAG" "$SOURCE_COMMIT" "$ARCH" || status=$?
          if [[ "$status" == 3 ]]; then
            build/build-runtime-image.sh ".tmp/release/gizclaw_${VERSION}_${ARCH}.deb" "$VERSION" "$SOURCE_COMMIT" "$SOURCE_EPOCH" "$ARCH"
            image="gizclaw-runtime:${SOURCE_COMMIT}-${ARCH}"
            build/package-container-image.sh runtime "$image" .tmp/release .tmp/container-metadata "$TAG" "$SOURCE_COMMIT" "$ARCH"
          elif [[ "$status" != 0 ]]; then
            exit 1
          fi
          build/check-container-archive.sh ".tmp/container-metadata/container-runtime-${ARCH}.json" "$TAG" "$SOURCE_COMMIT" .tmp/release

      - name: Upload container metadata part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-metadata-runtime-${{ matrix.arch }}
          path: .tmp/container-metadata/*
          if-no-files-found: error

      - name: Upload Linux release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-linux-${{ matrix.arch }}
          path: .tmp/release/*
          compression-level: 0
          if-no-files-found: error

  c-sdk:
    name: C SDK Source Release Asset
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C SDK validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libprotobuf-dev \
            protobuf-compiler

      - name: Verify committed C SDK generation
        run: |
          go generate ./sdk/c/gizclaw
          git diff --exit-code -- sdk/c/gizclaw/generated

      - name: Build and verify C SDK source archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
        run: |
          mkdir -p .tmp/release
          archive=".tmp/release/gizclaw-c-sdk-${VERSION}.tar.gz"
          tools/c-sdk/package_source.sh \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --source-epoch "$SOURCE_EPOCH" \
            --output "$archive"
          tools/c-sdk/verify_source_archive.sh \
            --archive "$archive" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT"

      - name: Upload C SDK source release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-c-sdk-source
          path: |
            .tmp/release/gizclaw-c-sdk-*.tar.gz
            .tmp/release/gizclaw-c-sdk-*.tar.gz.sha256
          if-no-files-found: error

  flutter-sdk:
    name: Flutter SDK Release Assets
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable

      - name: Install Flutter SDK validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-yaml

      - name: Build and verify hosted pub archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/release
          for package in gizclaw gizclaw_control; do
            archive=".tmp/release/flutter-${package}-${VERSION}.tar.gz"
            tools/flutter-sdk/package_archive.sh \
              --package "$package" \
              --version "$VERSION" \
              --source-commit "$SOURCE_COMMIT" \
              --source-epoch "$SOURCE_EPOCH" \
              --output "$archive"
            tools/flutter-sdk/verify_archive.sh \
              --archive "$archive" \
              --package "$package" \
              --version "$VERSION"
          done
          tools/flutter-sdk/consume_archives.sh --asset-dir .tmp/release --version "$VERSION"

      - name: Upload Flutter SDK release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-flutter-sdk
          path: .tmp/release/flutter-*.tar.gz
          if-no-files-found: error

  js-sdk:
    name: JavaScript SDK Release Assets
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build and verify npm tarballs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/release
          for package in gizclaw gizclaw-control; do
            archive=".tmp/release/npm-${package}-${VERSION}.tgz"
            tools/js-sdk/package_npm_tarball.sh \
              --package "$package" \
              --version "$VERSION" \
              --source-commit "$SOURCE_COMMIT" \
              --source-epoch "$SOURCE_EPOCH" \
              --output "$archive"
            tools/js-sdk/verify_npm_tarball.sh \
              --archive "$archive" \
              --package "$package" \
              --version "$VERSION" \
              --source-epoch "$SOURCE_EPOCH"
          done
          tools/js-sdk/consume_tarballs.sh --asset-dir .tmp/release --version "$VERSION"

      - name: Upload JavaScript SDK release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-js-sdk
          path: .tmp/release/npm-*.tgz
          if-no-files-found: error

  terraform-provider:
    name: Terraform Provider Release Assets
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cgo-free Terraform provider archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          SOURCE_EPOCH: ${{ needs.prepare.outputs.source_epoch }}
        run: |
          build/build-terraform-provider.sh \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --source-epoch "$SOURCE_EPOCH" \
            --output-dir .tmp/release

      - name: Upload Terraform provider release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-terraform-provider
          path: .tmp/release/terraform-provider-gizclaw_*.zip
          if-no-files-found: error

  container-image:
    name: Verify Container Delivery Receipt
    needs: [prepare, linux, mem0-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Download Runtime archives and matching Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: assets-linux-*
          path: .tmp/packages
          merge-multiple: true
      - name: Download Mem0 archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: assets-mem0-*
          path: .tmp/packages
          merge-multiple: true
      - name: Download all container metadata parts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: container-metadata-*
          path: .tmp/container-metadata
          merge-multiple: true
      - name: Bind all four image archives to source and Debian binaries
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: build/build-container-receipt.sh .tmp/container-metadata .tmp/packages "$TAG" "$SOURCE_COMMIT"
      - name: Upload container delivery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assets-container-image
          path: .tmp/packages/container-image.json
          if-no-files-found: error

  container-load:
    name: Release Archive Runtime (${{ matrix.arch }})
    needs: [prepare, container-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Download native Runtime archive and Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: assets-linux-${{ matrix.arch }}
          path: .tmp/packages
      - name: Download native Mem0 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: assets-mem0-${{ matrix.arch }}
          path: .tmp/packages
      - name: Download container delivery receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: assets-container-image
          path: .tmp/packages
      - name: Verify, import and run both delivered images on a fresh native runner
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for component in runtime mem0; do
            build/check-container-receipt.sh .tmp/packages/container-image.json "$TAG" "$SOURCE_COMMIT" .tmp/packages "$component" "$ARCH"
            jq --arg component "$component" --arg arch "$ARCH" \
              '.images[] | select(.component == $component and .architecture == $arch)' \
              .tmp/packages/container-image.json >.tmp/entry.json
            build/check-container-archive.sh .tmp/entry.json "$TAG" "$SOURCE_COMMIT" .tmp/packages
          done

  publish-semver:
    if: github.repository == 'GizClaw/gizclaw'
    name: Publish Protected SemVer Release
    needs:
      - prepare
      - linux
      - c-sdk
      - flutter-sdk
      - js-sdk
      - terraform-provider
      - container-image
      - container-load
      - mem0-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0

      - name: Download and merge all required release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: .tmp/download
          pattern: "assets-*"
          merge-multiple: true

      - name: Build and validate closed formal staging directory
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          install -d -m 0700 .tmp/publish
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            test ! -e ".tmp/publish/$name"
            test -f "$artifact" && test ! -L "$artifact" && test -s "$artifact"
            install -m 0644 "$artifact" ".tmp/publish/$name"
          done < <(find .tmp/download -type f -print0)
          build/build-release-manifest.sh \
            --asset-dir .tmp/publish \
            --tag "$TAG" \
            --debian-version "${TAG#v}" \
            --source-commit "$SOURCE_COMMIT"
          build/check-release.sh semver .tmp/publish "$TAG" "$SOURCE_COMMIT"

      - name: Verify current protected source and formal tag ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: build/check-release-source.sh "$GH_REPO" "$TAG" "$SOURCE_COMMIT"

      - name: Publish or verify formal Release without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail

          lookup_release() {
            build/find-release-by-tag.sh "$GH_REPO" "$TAG" >"$release_raw"
          }

          normalize_release() {
            jq '{tag_name,target_commitish,draft,prerelease,assets:[.assets[] | {name,size}]}' \
              "$release_raw" >"$release_json"
          }

          verify_remote() {
            local state="$1" remote_dir local_asset name asset_id
            remote_dir="$(mktemp -d "${RUNNER_TEMP}/gizclaw-release.XXXXXX")"
            for local_asset in .tmp/publish/*; do
              name="$(basename "$local_asset")"
              asset_id="$(
                jq -er --arg name "$name" '
                  [.assets[] | select(.name == $name)] |
                  if length == 1 and (.[0].id | type == "number" and . > 0) then
                    .[0].id
                  else
                    error("expected exactly one asset named " + $name)
                  end
                ' "$release_raw"
              )"
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GH_REPO/releases/assets/$asset_id" >"$remote_dir/$name"
            done
            build/check-release.sh "$state" "$remote_dir" "$TAG" "$SOURCE_COMMIT" "$release_json"
            for local_asset in .tmp/publish/*; do
              cmp "$local_asset" "$remote_dir/$(basename "$local_asset")"
            done
          }

          release_json="${RUNNER_TEMP}/release.json"
          release_raw="${RUNNER_TEMP}/release.raw.json"
          lookup_status=0
          lookup_release || lookup_status=$?
          if [[ "$lookup_status" -eq 3 ]]; then
            gh release create "$TAG" .tmp/publish/* \
              --draft \
              --verify-tag \
              --target "$SOURCE_COMMIT" \
              --title "$TAG" \
              --notes "Formal GizClaw $TAG release from $SOURCE_COMMIT. Runtime and Mem0 Docker image archives are included; see container-image.json for checksums and local image identities."
            lookup_release
          elif [[ "$lookup_status" -ne 0 ]]; then
            exit "$lookup_status"
          fi

          normalize_release
          if jq -e '.draft == false' "$release_raw" >/dev/null; then
            verify_remote published
            echo "existing published Release is an exact idempotent match"
            exit 0
          fi

          verify_remote draft
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "$release_raw")"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false >"$release_raw"
          normalize_release
          verify_remote published

          remote_tag_commit="$(
            git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          test "$remote_tag_commit" = "$SOURCE_COMMIT"
