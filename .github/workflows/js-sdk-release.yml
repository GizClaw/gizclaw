name: JavaScript SDK Verification

on:
  pull_request:
    paths:
      - ".github/workflows/js-sdk-release.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "web/console/package.json"
      - "tools/js-sdk/**"
      - "sdk/js/gizclaw/**"
      - "sdk/js/gizclaw-control/**"
      - "sdk/js/scripts/check-package-release.mjs"
      - "sdk/js/scripts/check-package-release.test.mjs"
      - "sdk/js/scripts/prepare-published-sdk.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/js-sdk-release.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "web/console/package.json"
      - "tools/js-sdk/**"
      - "sdk/js/gizclaw/**"
      - "sdk/js/gizclaw-control/**"
      - "sdk/js/scripts/check-package-release.mjs"
      - "sdk/js/scripts/check-package-release.test.mjs"
      - "sdk/js/scripts/prepare-published-sdk.mjs"

concurrency:
  group: js-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify JavaScript SDK Package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify development package identities
        run: |
          node sdk/js/scripts/check-package-release.mjs --package sdk/js/gizclaw
          node sdk/js/scripts/check-package-release.mjs --package sdk/js/gizclaw-control

      - name: Test JavaScript SDK release contract
        run: node --test sdk/js/scripts/check-package-release.test.mjs

      - name: Test JavaScript SDK packages
        run: |
          npm test --workspace @gizclaw/gizclaw
          npm test --workspace @gizclaw/gizclaw-control

      - name: Test deterministic npm tarballs
        run: tools/js-sdk/archive_test.sh
