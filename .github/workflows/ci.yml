name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            dpkg-dev \
            libprotobuf-dev \
            protobuf-compiler \
            shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check release shell scripts
        run: >-
          shellcheck
          build/build-linux.sh
          build/package-deb.sh
          build/check-deb.sh
          build/build-release-manifest.sh
          build/check-release.sh
          build/find-release-by-tag.sh
          build/release-contract-test.sh
          tools/c-sdk/package_source.sh
          tools/c-sdk/source_archive_test.sh
          tools/c-sdk/verify_source_archive.sh

      - name: Check workflow syntax and embedded shell
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/ci.yml \
            .github/workflows/js-sdk-release.yml \
            .github/workflows/release.yml

      - name: Test offline release contracts
        run: build/release-contract-test.sh

      - name: Verify committed C SDK generation
        run: |
          go generate ./sdk/c/gizclaw
          git diff --exit-code -- sdk/c/gizclaw/generated

      - name: Test standalone C SDK source archive
        run: tools/c-sdk/source_archive_test.sh

      - name: Build native validation executable
        env:
          PLATFORM: linux/amd64
          OUTPUT: ${{ runner.temp }}/gizclaw-linux-amd64
          BUILD_VERSION: 0.0.0
          BUILD_COMMIT: ${{ github.sha }}
        run: build/build-linux.sh

      - name: Build and exercise validation package
        env:
          BINARY: ${{ runner.temp }}/gizclaw-linux-amd64
        run: |
          source_commit="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct HEAD)"
          package="${RUNNER_TEMP}/gizclaw_0.0.0_amd64.deb"
          build/package-deb.sh \
            --binary "$BINARY" \
            --version 0.0.0 \
            --source-commit "$source_commit" \
            --source-epoch "$source_epoch" \
            --architecture amd64 \
            --output "$package"
          build/check-deb.sh \
            --package "$package" \
            --version 0.0.0 \
            --source-commit "$source_commit" \
            --architecture amd64

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      MODERNIZE_VERSION: v0.42.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Install C/C++ analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-format-18 \
            clang-tidy-18 \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download root Go modules
        run: go mod download

      - name: Install modernize
        run: go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@"${MODERNIZE_VERSION}"

      - name: Check handwritten Go formatting
        run: go run ./tools/quality gofmt

      - name: Check reviewed mutex scopes
        run: go run ./tools/quality mutexscope

      - name: Check handwritten Go modernization and exemptions
        run: go run ./tools/quality modernize -binary "$(go env GOPATH)/bin/modernize"

      - name: Vet every maintained Go module
        run: go run ./tools/quality vet

      - name: Check handwritten C/C++ formatting
        run: >-
          go run ./tools/quality files -language=c -print0 |
          xargs -0 clang-format-18 --dry-run --Werror

      - name: Run C SDK static analysis
        run: >-
          clang-tidy-18
          sdk/c/gizclaw/cgobackend/gzc_cgo_backend.c
          sdk/c/gizclaw/src/*.c
          --
          -std=c11
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run quality:typescript

      - name: Lint JavaScript and TypeScript
        run: npm run quality:lint

      - name: Check JavaScript and TypeScript formatting
        run: npm run quality:format

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Flutter SDK dependencies
        working-directory: sdk/flutter/gizclaw
        run: flutter pub get

      - name: Check handwritten Dart formatting
        run: >-
          go run ./tools/quality files -language=dart -print0 |
          xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze Flutter SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter analyze

  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Audit freestanding C SDK ctype dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin \
            -I sdk/c/gizclaw/include \
            -I sdk/c/gizclaw/generated \
            -I third_party/nanopb/upstream \
            -c sdk/c/gizclaw/src/gzc_event.c \
            -o "$audit_dir/gzc_event.o"
          cc -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin \
            -I sdk/c/gizclaw/include \
            -I sdk/c/gizclaw/generated \
            -I third_party/nanopb/upstream \
            -c sdk/c/gizclaw/src/gzc_json.c \
            -o "$audit_dir/gzc_json.o"
          ar rcs "$audit_dir/libgzc_ascii_freestanding.a" \
            "$audit_dir/gzc_event.o" \
            "$audit_dir/gzc_json.o"
          if nm -u "$audit_dir/libgzc_ascii_freestanding.a" | \
            grep -E '(_ctype_|__ctype_b_loc|_?isdigit$|_?isspace$)'; then
            echo "C SDK archive imports locale-aware ctype classification" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - name: Download modules
        run: go mod download

      - name: Install UI dependencies
        run: npm ci

      - name: Verify root module is tidy
        run: go mod tidy -diff

      - name: Run C bridge checkptr tests
        run: go test -gcflags=all=-d=checkptr=2 ./sdk/c/gizclaw/cgobackend -count=1

      - name: Compile C SDK smoke test
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_client_smoke_test.c
          sdk/c/gizclaw/src/*.c
          sdk/c/gizclaw/generated/*.pb.c
          sdk/c/gizclaw/generated/events/*.pb.c
          sdk/c/gizclaw/generated/google/protobuf/*.pb.c
          sdk/c/gizclaw/generated/payload/*.pb.c
          third_party/nanopb/upstream/pb_common.c
          third_party/nanopb/upstream/pb_decode.c
          third_party/nanopb/upstream/pb_encode.c
          -o /tmp/gzc_client_smoke_test

      - name: Run C SDK smoke test
        run: /tmp/gzc_client_smoke_test

      - name: Compile C SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -g
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_client_smoke_test.c
          sdk/c/gizclaw/src/*.c
          sdk/c/gizclaw/generated/*.pb.c
          sdk/c/gizclaw/generated/events/*.pb.c
          sdk/c/gizclaw/generated/google/protobuf/*.pb.c
          sdk/c/gizclaw/generated/payload/*.pb.c
          third_party/nanopb/upstream/pb_common.c
          third_party/nanopb/upstream/pb_decode.c
          third_party/nanopb/upstream/pb_encode.c
          -o /tmp/gzc_client_sanitizer_smoke_test

      - name: Run C SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/gzc_client_sanitizer_smoke_test

      - name: Compile C++ SDK headers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_cpp_headers_smoke_test.cpp
          -o /tmp/gzc_cpp_headers_smoke_test

      - name: Run C++ SDK headers smoke test
        run: /tmp/gzc_cpp_headers_smoke_test

      - name: Compile C control SDK smoke test
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          -I sdk/c/gizclaw_control/src
          sdk/c/gizclaw_control/tests/gzc_control_smoke_test.c
          sdk/c/gizclaw_control/src/*.c
          sdk/c/gizclaw/src/gzc_buffer.c
          sdk/c/gizclaw/src/gzc_common.c
          sdk/c/gizclaw/src/gzc_json.c
          sdk/c/gizclaw/src/gzc_platform.c
          -o /tmp/gzc_control_smoke_test

      - name: Run C control SDK smoke test
        run: /tmp/gzc_control_smoke_test

      - name: Compile C control SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -g
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          -I sdk/c/gizclaw_control/src
          sdk/c/gizclaw_control/tests/gzc_control_smoke_test.c
          sdk/c/gizclaw_control/src/*.c
          sdk/c/gizclaw/src/gzc_buffer.c
          sdk/c/gizclaw/src/gzc_common.c
          sdk/c/gizclaw/src/gzc_json.c
          sdk/c/gizclaw/src/gzc_platform.c
          -o /tmp/gzc_control_sanitizer_smoke_test

      - name: Run C control SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/gzc_control_sanitizer_smoke_test

      - name: Compile C++ control SDK headers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          sdk/c/gizclaw_control/tests/gzc_control_cpp_headers_smoke_test.cpp
          -o /tmp/gzc_control_cpp_headers_smoke_test

      - name: Run C++ control SDK headers smoke test
        run: /tmp/gzc_control_cpp_headers_smoke_test

      - name: Run tests
        env:
          GOFLAGS: -mod=readonly
        run: go test -count=1 ./...

  postgres:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gizclaw
          POSTGRES_PASSWORD: gizclaw
          POSTGRES_DB: gizclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gizclaw -d gizclaw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GIZCLAW_TEST_POSTGRES_DSN: postgres://gizclaw:gizclaw@127.0.0.1:5432/gizclaw_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Require PostgreSQL test DSN
        run: test -n "$GIZCLAW_TEST_POSTGRES_DSN"

      - name: Run PostgreSQL integration tests
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test -count=1 -p 1 \
            ./cmd/internal/server \
            ./pkgs/gizclaw/services/gameplay
          go test -tags=store_e2e -count=1 -p 1 \
            -run '^TestPostgreSQL' \
            ./tests/store-e2e

  clickhouse:
    name: ClickHouse Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8@sha256:aec6fb9892becb6a20eb8d57708b8cf9c777b2ad1f4eb70bbece7a70eaed9fd0
        env:
          CLICKHOUSE_USER: gizclaw
          CLICKHOUSE_PASSWORD: gizclaw
          CLICKHOUSE_DB: default
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user gizclaw --password gizclaw --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GIZCLAW_TEST_CLICKHOUSE_DSN: clickhouse://gizclaw:gizclaw@127.0.0.1:9000/default
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Require ClickHouse test DSN
        run: test -n "$GIZCLAW_TEST_CLICKHOUSE_DSN"

      - name: Run ClickHouse integration tests
        env:
          GOFLAGS: -mod=readonly
        run: >-
          go test -tags=store_e2e -count=1 -p 1
          -run '^TestClickHouse'
          ./tests/store-e2e

  nested-go-modules:
    name: Nested Go Modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Test every nested Go module
        shell: bash
        run: |
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "::group::$directory"
            (
              cd "$directory"
              go mod tidy -diff
              GOFLAGS=-mod=readonly go test -count=1 ./...
            )
            echo "::endgroup::"
          done < <(
            find . -mindepth 2 -name go.mod \
              -not -path './.git/*' \
              -not -path './third_party/*' \
              -not -path './node_modules/*' \
              | sort
          )

  race:
    name: Go Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run root module race tests
        run: go test -race -count=1 ./...

  javascript:
    name: JavaScript And Guides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            guides/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Test maintained workspaces
        run: npm test --workspaces --if-present

      - name: Install guide dependencies
        run: npm --prefix guides ci

      - name: Build guides
        run: npm --prefix guides run build:site

  flutter:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install SDK dependencies
        working-directory: sdk/flutter/gizclaw
        run: flutter pub get

      - name: Analyze SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter analyze

      - name: Test SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter test
