name: PR1599 Native Diagnostics
on:
  workflow_dispatch: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission-sdk-e2e:
    name: Flutter native diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - name: Ensure Git LFS assets are available
        run: git lfs pull
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.1
          channel: stable
          cache: true
      - name: Install native WebRTC runner tools
        run: bash tests/gizclaw-e2e/setup/install-native-runner-tools.sh
      - name: Start virtual audio device for Flutter WebRTC
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=gizclaw_admission
          pactl set-default-sink gizclaw_admission
          pactl set-default-source gizclaw_admission.monitor
      - name: Verify management, MHS and KV contracts across SDKs
        run: xvfb-run -a bash tests/gizclaw-e2e/run_device_management_tests.sh
