name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mem0-regression:
    name: Mem0 Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch LoCoMo fixtures
        run: git lfs pull --include="tests/evaluation/locomo/testdata/*.jsonl"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Run memory contracts and offline fixture regressions
        env:
          GOFLAGS: -mod=readonly
        run: bash tests/evaluation/locomo/run_offline.sh

  release-contract:
    name: Release Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            dpkg-dev \
            libprotobuf-dev \
            protobuf-compiler \
            python3-yaml \
            shellcheck \
            unzip \
            zip
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check release shell scripts
        run: >-
          shellcheck
          build/build-linux.sh
          build/build-runtime-image.sh
          build/check-runtime-image.sh
          build/runtime-entrypoint.sh
          build/publish-runtime-image.sh
          build/check-container-receipt.sh
          build/check-release-source.sh
          build/build-terraform-provider.sh
          build/package-deb.sh
          build/check-deb.sh
          build/build-release-manifest.sh
          build/check-release.sh
          build/find-release-by-tag.sh
          build/release-contract-test.sh
          tests/gizclaw-e2e/run_pending_recovery_tests.sh
          tools/c-sdk/package_source.sh
          tools/c-sdk/source_archive_test.sh
          tools/c-sdk/verify_source_archive.sh
          tools/flutter-sdk/archive_test.sh
          tools/flutter-sdk/consume_archives.sh
          tools/flutter-sdk/package_archive.sh
          tools/flutter-sdk/verify_archive.sh

      - name: Check workflow syntax and embedded shell
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/ci.yml \
            .github/workflows/js-sdk-release.yml \
            .github/workflows/monitor-release.yml \
            .github/workflows/release.yml

      - name: Test offline release contracts
        run: build/release-contract-test.sh

      - name: Verify committed C SDK generation
        run: |
          go generate ./sdk/c/gizclaw
          git diff --exit-code -- sdk/c/gizclaw/generated

      - name: Build Terraform provider release archives
        run: |
          build/build-terraform-provider.sh \
            --version 0.0.0 \
            --source-commit "$(git rev-parse HEAD)" \
            --source-epoch "$(git show -s --format=%ct HEAD)" \
            --output-dir "${RUNNER_TEMP}/terraform-provider"

      - name: Test standalone C SDK source archive
        run: tools/c-sdk/source_archive_test.sh

      - name: Test Flutter SDK hosted pub archives
        run: tools/flutter-sdk/archive_test.sh

  native-build:
    name: Native Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Prepare native build inputs
        run: |
          git lfs pull
          git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Compile the native executable
        run: |
          go build -trimpath \
            -ldflags "-X github.com/GizClaw/gizclaw-go/cmd/internal/buildinfo.Version=0.0.0 -X github.com/GizClaw/gizclaw-go/cmd/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/gizclaw" ./cmd/gizclaw

      - name: Verify native CLI entrypoints
        run: |
          test "$("${RUNNER_TEMP}/gizclaw" --version)" = "gizclaw version 0.0.0"
          "${RUNNER_TEMP}/gizclaw" --help >/dev/null

      - name: Validate AST consecutive-turn Giztests
        run: |
          "${RUNNER_TEMP}/gizclaw" test validate \
            -f tests/gizclaw-e2e/giztest/volc-ast-translate.push-to-talk-consecutive-turns.giztest.yaml \
            -f tests/gizclaw-e2e/giztest/volc-ast-translate.realtime-consecutive-turns.giztest.yaml

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      MODERNIZE_VERSION: v0.49.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Install C/C++ analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-format-18 \
            clang-tidy-18 \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download root Go modules
        run: go mod download

      - name: Install modernize
        run: go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@"${MODERNIZE_VERSION}"

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Check handwritten Go formatting
        run: go run ./tools/quality gofmt

      - name: Check reviewed mutex scopes
        run: go run ./tools/quality mutexscope

      - name: Check handwritten Go modernization and exemptions
        run: go run ./tools/quality modernize -binary "$(go env GOPATH)/bin/modernize"

      - name: Vet every maintained Go module
        run: go run ./tools/quality vet

      - name: Check handwritten C/C++ formatting
        run: >-
          go run ./tools/quality files -language=c -print0 |
          xargs -0 clang-format-18 --dry-run --Werror

      - name: Run C SDK static analysis
        run: >-
          clang-tidy-18
          sdk/c/gizclaw/cgobackend/gzc_cgo_backend.c
          sdk/c/gizclaw/src/*.c
          --
          -std=c11
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream

      - name: Check TypeScript types
        run: npm run quality:typescript

      - name: Lint JavaScript and TypeScript
        run: npm run quality:lint

      - name: Check JavaScript and TypeScript formatting
        run: npm run quality:format

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Flutter SDK dependencies
        working-directory: sdk/flutter/gizclaw
        run: flutter pub get

      - name: Install Dart control SDK dependencies
        working-directory: sdk/flutter/gizclaw_control
        run: dart pub get

      - name: Check handwritten Dart formatting
        run: >-
          go run ./tools/quality files -language=dart -print0 |
          xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze Flutter SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter analyze

      - name: Analyze Dart control SDK
        working-directory: sdk/flutter/gizclaw_control
        run: dart analyze --fatal-infos

      - name: Install giztest runner dependencies
        working-directory: tests/clients/flutter/giztest
        run: flutter pub get

      - name: Analyze giztest runner
        working-directory: tests/clients/flutter/giztest
        run: flutter analyze

  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Audit freestanding C SDK ctype dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin \
            -I sdk/c/gizclaw/include \
            -I sdk/c/gizclaw/generated \
            -I third_party/nanopb/upstream \
            -c sdk/c/gizclaw/src/gzc_event.c \
            -o "$audit_dir/gzc_event.o"
          cc -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin \
            -I sdk/c/gizclaw/include \
            -I sdk/c/gizclaw/generated \
            -I third_party/nanopb/upstream \
            -c sdk/c/gizclaw/src/gzc_json.c \
            -o "$audit_dir/gzc_json.o"
          ar rcs "$audit_dir/libgzc_ascii_freestanding.a" \
            "$audit_dir/gzc_event.o" \
            "$audit_dir/gzc_json.o"
          if nm -u "$audit_dir/libgzc_ascii_freestanding.a" | \
            grep -E '(_ctype_|__ctype_b_loc|_?isdigit$|_?isspace$)'; then
            echo "C SDK archive imports locale-aware ctype classification" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Verify root module is tidy
        run: go mod tidy -diff

      - name: Run C bridge checkptr tests
        run: go test -gcflags=all=-d=checkptr=2 ./sdk/c/gizclaw/cgobackend -count=1

      - name: Compile C SDK smoke test
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_client_smoke_test.c
          sdk/c/gizclaw/src/*.c
          sdk/c/gizclaw/generated/*.pb.c
          sdk/c/gizclaw/generated/events/*.pb.c
          sdk/c/gizclaw/generated/giznet/*.pb.c
          sdk/c/gizclaw/generated/google/protobuf/*.pb.c
          sdk/c/gizclaw/generated/payload/*.pb.c
          third_party/nanopb/upstream/pb_common.c
          third_party/nanopb/upstream/pb_decode.c
          third_party/nanopb/upstream/pb_encode.c
          -o /tmp/gzc_client_smoke_test

      - name: Run C SDK smoke test
        run: /tmp/gzc_client_smoke_test

      - name: Compile C SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -g
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_client_smoke_test.c
          sdk/c/gizclaw/src/*.c
          sdk/c/gizclaw/generated/*.pb.c
          sdk/c/gizclaw/generated/events/*.pb.c
          sdk/c/gizclaw/generated/giznet/*.pb.c
          sdk/c/gizclaw/generated/google/protobuf/*.pb.c
          sdk/c/gizclaw/generated/payload/*.pb.c
          third_party/nanopb/upstream/pb_common.c
          third_party/nanopb/upstream/pb_decode.c
          third_party/nanopb/upstream/pb_encode.c
          -o /tmp/gzc_client_sanitizer_smoke_test

      - name: Run C SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/gzc_client_sanitizer_smoke_test

      - name: Compile C++ SDK headers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw/generated
          -I third_party/nanopb/upstream
          sdk/c/gizclaw/tests/gzc_cpp_headers_smoke_test.cpp
          -o /tmp/gzc_cpp_headers_smoke_test

      - name: Run C++ SDK headers smoke test
        run: /tmp/gzc_cpp_headers_smoke_test

      - name: Compile C control SDK smoke test
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          -I sdk/c/gizclaw_control/src
          sdk/c/gizclaw_control/tests/gzc_control_smoke_test.c
          sdk/c/gizclaw_control/src/*.c
          sdk/c/gizclaw/src/gzc_buffer.c
          sdk/c/gizclaw/src/gzc_common.c
          sdk/c/gizclaw/src/gzc_json.c
          sdk/c/gizclaw/src/gzc_platform.c
          -o /tmp/gzc_control_smoke_test

      - name: Run C control SDK smoke test
        run: /tmp/gzc_control_smoke_test

      - name: Compile C control SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -g
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          -I sdk/c/gizclaw_control/src
          sdk/c/gizclaw_control/tests/gzc_control_smoke_test.c
          sdk/c/gizclaw_control/src/*.c
          sdk/c/gizclaw/src/gzc_buffer.c
          sdk/c/gizclaw/src/gzc_common.c
          sdk/c/gizclaw/src/gzc_json.c
          sdk/c/gizclaw/src/gzc_platform.c
          -o /tmp/gzc_control_sanitizer_smoke_test

      - name: Run C control SDK sanitizer smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/gzc_control_sanitizer_smoke_test

      - name: Compile C++ control SDK headers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I sdk/c/gizclaw/include
          -I sdk/c/gizclaw_control/include
          sdk/c/gizclaw_control/tests/gzc_control_cpp_headers_smoke_test.cpp
          -o /tmp/gzc_control_cpp_headers_smoke_test

      - name: Run C++ control SDK headers smoke test
        run: /tmp/gzc_control_cpp_headers_smoke_test

      - name: Run tests
        env:
          GOFLAGS: -mod=readonly
        # Wall-clock audio pacing tests share this runner with every package.
        # Keep the complete suite, but avoid concurrent compiler/test processes
        # starving 20ms provider and receiver goroutines.
        run: go test -count=1 -p 1 ./...

      - name: Run e2e fixture tests
        env:
          GOFLAGS: -mod=readonly
        run: go test -count=1 ./tests/gizclaw-e2e/testdata

  redis-presence:
    name: Redis Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GIZCLAW_TEST_REDIS_DSN: redis://127.0.0.1:16379/15
      GIZCLAW_TEST_REDIS_READ_DSN: redis://127.0.0.1:16380/15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Start native Redis primary and replica
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y redis-server
          for role in primary replica; do
            mkdir -p "${RUNNER_TEMP}/redis-${role}"
          done
          redis-server --bind 127.0.0.1 --port 16379 --save "" --appendonly no \
            --daemonize yes --dir "${RUNNER_TEMP}/redis-primary" \
            --pidfile "${RUNNER_TEMP}/redis-primary/redis.pid" \
            --logfile "${RUNNER_TEMP}/redis-primary/redis.log"
          redis-server --bind 127.0.0.1 --port 16380 --save "" --appendonly no \
            --daemonize yes --replicaof 127.0.0.1 16379 \
            --dir "${RUNNER_TEMP}/redis-replica" \
            --pidfile "${RUNNER_TEMP}/redis-replica/redis.pid" \
            --logfile "${RUNNER_TEMP}/redis-replica/redis.log"
          for attempt in $(seq 1 60); do
            if redis-cli -p 16380 info replication | tr -d '\r' | grep -qx 'master_link_status:up'; then
              break
            fi
            printf 'Waiting for native Redis replication (%s/60)\n' "$attempt"
            sleep 1
          done
          redis-cli -p 16379 ping | grep -qx PONG
          redis-cli -p 16380 info replication | tr -d '\r' | grep -qx 'master_link_status:up'

      - name: Run native Redis integration tests
        env:
          GOFLAGS: -mod=readonly
        run: bash tests/integration/store/run_native.sh redis

      - name: Stop native Redis processes
        if: always()
        run: |
          redis-cli -p 16380 shutdown nosave || true
          redis-cli -p 16379 shutdown nosave || true

  postgres:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GIZCLAW_TEST_POSTGRES_DSN: postgres://gizclaw:gizclaw@127.0.0.1:15432/gizclaw_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Start native PostgreSQL with pg_partman
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-server-dev-16
          partman_dir="$(mktemp -d "${RUNNER_TEMP}/pg-partman.XXXXXX")"
          curl -fsSL https://codeload.github.com/pgpartman/pg_partman/tar.gz/refs/tags/v5.5.0 \
            -o "$partman_dir/pg_partman.tar.gz"
          printf '%s  %s\n' \
            a3f100ae871677f0012579f58542c174900297f664a4ad2be0256e7ee5e33502 \
            "$partman_dir/pg_partman.tar.gz" | sha256sum --check --status
          tar -xzf "$partman_dir/pg_partman.tar.gz" -C "$partman_dir"
          sudo make -C "$partman_dir/pg_partman-5.5.0" \
            PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config install
          pg_dir="${RUNNER_TEMP}/postgres"
          sudo install -d -o postgres -g postgres -m 700 "$pg_dir"
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb \
            -D "$pg_dir/data" --auth-local=trust --auth-host=scram-sha-256
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl \
            -D "$pg_dir/data" -l "$pg_dir/server.log" \
            -o "-h 127.0.0.1 -p 15432 -k $pg_dir -c max_connections=300" -w start
          sudo -u postgres /usr/lib/postgresql/16/bin/psql \
            -h "$pg_dir" -p 15432 -v ON_ERROR_STOP=1 -d postgres \
            -c "CREATE ROLE gizclaw WITH LOGIN SUPERUSER PASSWORD 'gizclaw'" \
            -c 'CREATE DATABASE gizclaw_test OWNER gizclaw'
          sudo -u postgres /usr/lib/postgresql/16/bin/psql \
            -h "$pg_dir" -p 15432 -v ON_ERROR_STOP=1 -d gizclaw_test \
            -c 'CREATE SCHEMA partman' \
            -c 'CREATE EXTENSION pg_partman WITH SCHEMA partman'

      - name: Verify PostgreSQL readiness and pg_partman version
        run: |
          test -n "$GIZCLAW_TEST_POSTGRES_DSN"
          psql "$GIZCLAW_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c 'SELECT 1'
          test "$(psql "$GIZCLAW_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -At \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'pg_partman'")" = 5.5.0

      - name: Run PostgreSQL integration tests
        env:
          GOFLAGS: -mod=readonly
        run: bash tests/integration/store/run_native.sh postgres

      - name: Stop native PostgreSQL
        if: always()
        run: |
          pg_data="${RUNNER_TEMP}/postgres/data"
          if sudo -u postgres test -s "$pg_data/postmaster.pid"; then
            sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D "$pg_data" -m fast -w stop
          fi

  nested-go-modules:
    name: Nested Go Modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Test every nested Go module
        shell: bash
        run: |
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "::group::$directory"
            (
              cd "$directory"
              go mod tidy -diff
              GOFLAGS=-mod=readonly go test -count=1 ./...
            )
            echo "::endgroup::"
          done < <(
            find . -mindepth 2 -name go.mod \
              -not -path './.git/*' \
              -not -path './third_party/*' \
              -not -path './node_modules/*' \
              | sort
          )

  race:
    name: Go Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Initialize nanopb submodule
        run: git submodule update --init --depth=1 third_party/nanopb/upstream

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console

      - name: Run root module race tests
        run: go test -race -count=1 -p 1 ./...

  javascript:
    name: JavaScript And Guides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            guides/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Test maintained workspaces
        run: npm test --workspaces --if-present

      - name: Test Giztest offline replay controls
        run: node --test cmd/internal/commands/giztest/replay_html_test.mjs

      - name: Test native Giztest process isolation
        run: python3 -B tests/gizclaw-e2e/setup/run_js_giztest_test.py

      - name: Install guide dependencies
        run: npm --prefix guides ci

      - name: Set up Go for embedded asset compile tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test console
        run: npm run build --workspace @gizclaw/monitor && npm test --workspace @gizclaw/monitor

      - name: Build guides
        run: npm --prefix guides run build:site

  flutter:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true

      - name: Ensure Git LFS assets are available
        run: git lfs pull

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install SDK dependencies
        working-directory: sdk/flutter/gizclaw
        run: flutter pub get

      - name: Analyze SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter analyze

      - name: Test SDK
        working-directory: sdk/flutter/gizclaw
        run: flutter test

      - name: Install control SDK dependencies
        working-directory: sdk/flutter/gizclaw_control
        run: dart pub get

      - name: Analyze control SDK
        working-directory: sdk/flutter/gizclaw_control
        run: dart analyze --fatal-infos

      - name: Test control SDK
        working-directory: sdk/flutter/gizclaw_control
        run: dart test

      - name: Install Flutter SDK archive validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-yaml

      - name: Install Flutter SDK archives as hosted pub dependencies
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/flutter-sdk"
          mkdir -p "$archive_dir"
          for package in gizclaw gizclaw_control; do
            tools/flutter-sdk/package_archive.sh \
              --package "$package" \
              --version 0.0.0 \
              --source-commit "$(git rev-parse HEAD)" \
              --source-epoch "$(git show -s --format=%ct HEAD)" \
              --output "$archive_dir/flutter-${package}-0.0.0.tar.gz"
          done
          tools/flutter-sdk/consume_archives.sh --asset-dir "$archive_dir" --version 0.0.0

      - name: Install giztest runner dependencies
        working-directory: tests/clients/flutter/giztest
        run: flutter pub get

      - name: Analyze giztest runner
        working-directory: tests/clients/flutter/giztest
        run: flutter analyze

      - name: Test giztest runner
        working-directory: tests/clients/flutter/giztest
        run: flutter test

  admission-sdk-e2e:
    name: Native SDK Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - name: Ensure Git LFS assets are available
        run: git lfs pull
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true
      - name: Install native WebRTC runner tools
        run: bash tests/gizclaw-e2e/setup/install-native-runner-tools.sh
      - name: Start virtual audio device for Flutter WebRTC
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=gizclaw_admission
          pactl set-default-sink gizclaw_admission
          pactl set-default-source gizclaw_admission.monitor
      - name: Run registration-token admission across all SDKs
        run: xvfb-run -a bash tests/integration/sdk/run_admission_tests.sh
      - name: Verify Workspace list filters across all SDKs
        run: xvfb-run -a bash tests/integration/sdk/run_workspace_list_tests.sh
      - name: Verify management, MHS and KV contracts across SDKs
        run: xvfb-run -a bash tests/integration/sdk/run_device_management_tests.sh

  terraform-provider-e2e:
    name: Terraform Provider Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build embedded monitoring console
        uses: ./.github/actions/build-console
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Apply catalog selections through the provider against a real Server
        run: bash tests/integration/terraform/run_tests.sh
