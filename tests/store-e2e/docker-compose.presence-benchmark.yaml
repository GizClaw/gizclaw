services:
  pd:
    image: gizcr.gizclaw.com/docker.io/pingcap/pd:v8.5.6@sha256:c26dbbaaf95f2d5e15402f40f829f8dc26f5b2a39d8d90d74c30a9de7689521b
    command: [--name=pd, --data-dir=/data, --client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://pd:2379, --peer-urls=http://0.0.0.0:2380, --advertise-peer-urls=http://pd:2380, --initial-cluster=pd=http://pd:2380]
    tmpfs: ["/data:rw,size=256m"]
    cpus: 1
    mem_limit: 512m
  voter-a:
    image: gizcr.gizclaw.com/docker.io/pingcap/tikv:v8.5.6@sha256:8d0b99d78b9b6fe5a9389d3680835386a3afb572168fc87bf7ddb27ab1359919
    command: [--config=/etc/tikv/test.toml, --addr=0.0.0.0:20160, --advertise-addr=voter-a:20160, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd:2379]
    volumes: ["./tikv-test.toml:/etc/tikv/test.toml:ro"]
    depends_on: [pd]
    tmpfs: ["/data:rw,size=2g"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    cpus: 2
    mem_limit: 2g
  voter-b:
    extends: {service: voter-a}
    command: [--config=/etc/tikv/test.toml, --addr=0.0.0.0:20160, --advertise-addr=voter-b:20160, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd:2379]
  voter-c:
    extends: {service: voter-a}
    command: [--config=/etc/tikv/test.toml, --addr=0.0.0.0:20160, --advertise-addr=voter-c:20160, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd:2379]
  benchmark:
    image: gizcr.gizclaw.com/docker.io/pingcap/pd:v8.5.6@sha256:c26dbbaaf95f2d5e15402f40f829f8dc26f5b2a39d8d90d74c30a9de7689521b
    entrypoint: [/bench/bin/fixed]
    volumes: ["${PRESENCE_BENCHMARK_DIR:?}:/bench"]
    cpus: 2
    mem_limit: 2g
