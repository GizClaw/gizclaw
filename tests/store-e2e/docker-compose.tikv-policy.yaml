services:
  pd:
    extends: {file: docker-compose.tikv.yaml, service: pd}
  leader:
    extends: {file: docker-compose.tikv.yaml, service: leader}
  gate:
    extends: {file: docker-compose.tikv.yaml, service: gate}
  learner:
    extends: {file: docker-compose.tikv.yaml, service: learner}
  gate2:
    extends: {file: docker-compose.tikv.yaml, service: gate}
    command: [-target, "learner2:20160"]
  learner2:
    extends: {file: docker-compose.tikv.yaml, service: learner}
    command: [--config=/etc/tikv/test.toml, --addr=0.0.0.0:20160, --advertise-addr=gate2:20160, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd:2379, --labels=region=local]
    depends_on: [pd, gate2]
  tests:
    image: gizcr.gizclaw.com/docker.io/pingcap/pd:v8.5.6@sha256:c26dbbaaf95f2d5e15402f40f829f8dc26f5b2a39d8d90d74c30a9de7689521b
    entrypoint: [/test/store.test]
    command: [-test.v, -test.run=^TestTiKVLocalReadChannels$, -test.timeout=5m]
    volumes: ["${TIKV_E2E_BIN_DIR:?}:/test:ro"]
    environment:
      GIZCLAW_TEST_TIKV_PD: pd:2379
      GIZCLAW_TEST_TIKV_POLICY_FIXTURE: isolated
    cpus: 2
    mem_limit: 2g
