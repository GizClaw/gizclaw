services:
  pd-a:
    image: gizcr.gizclaw.com/docker.io/pingcap/pd:v8.5.6@sha256:c26dbbaaf95f2d5e15402f40f829f8dc26f5b2a39d8d90d74c30a9de7689521b
    command: [--name=pd-a, --config=/fixtures/a/pd.toml, --data-dir=/data, --client-urls=https://0.0.0.0:2379, --advertise-client-urls=https://pd-a:2379, --peer-urls=https://0.0.0.0:2380, --advertise-peer-urls=https://pd-a:2380, --initial-cluster=pd-a=https://pd-a:2380]
    volumes: ["${TIKV_TLS_FIXTURE_DIR:?}:/fixtures:ro"]
    tmpfs: [/data]
    cpus: 1
    mem_limit: 512m
  pd-b:
    extends: {service: pd-a}
    command: [--name=pd-b, --config=/fixtures/b/pd.toml, --data-dir=/data, --client-urls=https://0.0.0.0:2379, --advertise-client-urls=https://pd-b:2379, --peer-urls=https://0.0.0.0:2380, --advertise-peer-urls=https://pd-b:2380, --initial-cluster=pd-b=https://pd-b:2380]
  probe:
    image: gizcr.gizclaw.com/docker.io/pingcap/pd:v8.5.6@sha256:c26dbbaaf95f2d5e15402f40f829f8dc26f5b2a39d8d90d74c30a9de7689521b
    entrypoint: [/test/probe]
    command: [probe, /fixtures]
    volumes: ["${TIKV_TLS_BIN_DIR:?}:/test:ro", "${TIKV_TLS_FIXTURE_DIR:?}:/fixtures:ro"]
    depends_on: [pd-a, pd-b]
    cpus: 1
    mem_limit: 1g
  tikv-a:
    image: gizcr.gizclaw.com/docker.io/pingcap/tikv:v8.5.6@sha256:8d0b99d78b9b6fe5a9389d3680835386a3afb572168fc87bf7ddb27ab1359919
    command: [--config=/fixtures/a/tikv.toml, --addr=0.0.0.0:20160, --advertise-addr=probe:20160, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd-a:2379]
    volumes: ["${TIKV_TLS_FIXTURE_DIR:?}:/fixtures:ro"]
    depends_on: [pd-a, probe]
    tmpfs: [/data]
    cpus: 2
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
  tikv-b:
    extends: {service: tikv-a}
    command: [--config=/fixtures/b/tikv.toml, --addr=0.0.0.0:20160, --advertise-addr=probe:20161, --status-addr=0.0.0.0:20180, --data-dir=/data, --pd=pd-b:2379]
    depends_on: [pd-b, probe]
