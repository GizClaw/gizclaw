services:
  livekit:
    image: gizcr.gizclaw.com/docker.io/livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    command: [--config-body, "${GIZCLAW_TEST_LIVEKIT_CONFIG:?generated by run_redis_readwrite_tests.sh}", --node-ip, "127.0.0.1"]
    ports:
      - "127.0.0.1::7880"
      - "127.0.0.1:${GIZCLAW_TEST_LIVEKIT_RTC_PORT}:${GIZCLAW_TEST_LIVEKIT_RTC_PORT}/tcp"
      - "127.0.0.1:${GIZCLAW_TEST_LIVEKIT_RTC_PORT}:${GIZCLAW_TEST_LIVEKIT_RTC_PORT}/udp"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:7880/"]
      interval: 1s
      timeout: 2s
      retries: 30
  primary:
    image: gizcr.gizclaw.com/docker.io/library/redis:8.4.6-alpine@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1::6379"
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
  replica:
    image: gizcr.gizclaw.com/docker.io/library/redis:8.4.6-alpine@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: [redis-server, --save, "", --appendonly, "no", --replicaof, primary, "6379", --replica-read-only, "yes"]
    ports:
      - "127.0.0.1::6379"
    cpus: 1
    mem_limit: 256m
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
