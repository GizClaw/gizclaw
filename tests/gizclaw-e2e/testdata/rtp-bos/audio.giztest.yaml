# User Story:
# As a voice user,
# I want audio arriving before BOS binding to remain inside its stream,
# So that the complete reply passes strict audio integrity checks.
version: gizclaw.test/v1alpha1
name: rtp-bos.eino.push-to-talk
clients:
  audio_peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  tone:
    direction: input
    type: audio
    env: LATENCY_TONE
    media_type: audio/ogg
    codec: opus
    max_bytes: 262144
  audio_workspace_name:
    direction: input
    type: string
    generate: token
steps:
- id: audio_register_peer
  client: audio_peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: audio_create_workspace
  client: audio_peer
  rpc:
    method: server.workspace.create
    request:
      name: ${audio_workspace_name}
      workflow_name: rtp-bos-eino
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: audio_select_workspace
  client: audio_peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${audio_workspace_name}
- id: complete_audio
  client: audio_peer
  timeout: 20s
  peer_stream:
    mode: push-to-talk
    input: ${tone}
    pacing: 20ms
  expect:
    /text_eos:
      equals: true
    /audio_eos:
      equals: true
    /audio_bytes:
      minimum: 1
    /audio_integrity/max_active:
      equals: 1
    /audio_integrity/open:
      equals: 0
    /audio_integrity/violations:
      equals: 0
    /audio_pacing/packets:
      minimum: 80
    /audio_pacing/mean_packet_ms:
      equals: 20
    /audio_pacing/max_interval_ms:
      maximum: 150
    /audio_pacing/underruns:
      equals: 0
finally:
- client: audio_peer
  rpc:
    method: server.run.stop
    request: {}
- client: audio_peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${audio_workspace_name}
- client: audio_peer
  rpc:
    method: server.peer.delete
    request: {}
timeout: 60s
