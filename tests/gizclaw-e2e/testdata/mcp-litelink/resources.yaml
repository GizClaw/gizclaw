apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
    - apiVersion: gizclaw.admin/v1alpha1
      kind: Credential
      metadata: {id: mcp-live-volc-credential}
      spec:
        provider: volc
        description: Ark credential for isolated LiteLink MCP qualification
        body:
          ark_api_key: ${GIZCLAW_MCP_ARK_API_KEY}
    - apiVersion: gizclaw.admin/v1alpha1
      kind: VolcTenant
      metadata: {id: mcp-live-ark}
      spec:
        credential_id: mcp-live-volc-credential
        region: cn-beijing
    - apiVersion: gizclaw.admin/v1alpha1
      kind: Model
      metadata: {id: mcp-live-seed-lite}
      spec:
        kind: llm
        source: manual
        provider: {kind: volc-tenant, id: mcp-live-ark}
        display_name: Seed 2.1 Lite MCP qualification
        provider_data:
          api_mode: chat_completions
          upstream_model: doubao-seed-2-1-lite-260915
          service_tier: fast
          support_json_output: true
          support_text_only: true
          support_tool_calls: true
          support_temperature: true
          support_thinking: true
          thinking_param: thinking.type
          thinking_levels: [enabled, disabled]
          default_thinking_level: disabled
          use_system_role: true
    - apiVersion: gizclaw.admin/v1alpha1
      kind: Workflow
      metadata: {id: mcp-litelink-music}
      spec:
        driver: eino
        eino:
          graph:
            name: LiteLinkMusic
            compile: {node_trigger_mode: any_predecessor}
            state:
              fields:
                - {name: messages, type: messages, merge: replace}
                - {name: answer, type: string, merge: replace}
            nodes:
              - id: prompt
                type: prompt
                format: f_string
                messages:
                  - role: system
                    template: >-
                      你是音乐与有声专辑助手，结合真实对话历史理解用户当前请求。
                      用户只说想听音乐、没有给歌名或偏好时，用一句简短问题询问想听哪首歌或什么类型，
                      不要自行选曲，不要修改播放列表或开始播放。用户随后只回答歌名时，这是对上一问的回答，
                      应继续完成此前的播放请求，不要重复询问已经给出的信息。
                      用户给出明确歌名或专辑名称时，用 LiteLink search_catalog 搜索真实内容。
                      首次搜索用用户提供的名称作为 q，并设置 lang 为 zh-CN；不要擅自增加 category、
                      content_type、audio_language 过滤，也不要把用户提供的名称扩写为另一个标题。
                      用户要听有声专辑时可使用 type=album。筛选无结果时先移除过滤再用原词搜索，
                      不能把一次带过滤的空结果断言成整个目录没有该内容。
                      请求专辑且搜索结果唯一时，调用 get_album 获取完整 works，按目录返回的顺序加入全部集数，
                      不要把专辑缩减成第一集，不要自行重排，也不要因为用户没指定集数而重复追问。
                      本机列表最多 32 项；超过此容量应说明限制，不要声称已加入全部内容。
                      单曲从实际搜索结果或 get_work 取得真实 work id、URL 和曲名；也可用资源读取工具读取
                      litelink://catalog/works/<work-id> 或 litelink://catalog/albums/<album-id> 获取详情。
                      播放前必须调用 playlist-set，把每项的真实 URL、title、source_ref（work id）放入 items，
                      再调用 play，index 为 0。不要编造 URL、曲名或 id，不要用文本代替工具调用。
                      当前远程工具不支持断点恢复；没有集数或时间位置依据时，不得声称从上次断点继续。
                      只有实际播放调用成功才可确认已播放；错误时说明未成功。
                  - {placeholder: history, optional: true}
                inputs: {history: {from: input.messages}}
                outputs: {messages: messages}
              - id: answer
                type: chat_model
                model: llm
                max_tokens: 8192
                inputs: {messages: {from: messages}}
                outputs: {text: answer}
            edges:
              - {from: start, to: prompt}
              - {from: prompt, to: answer}
              - {from: answer, to: end}
            branches: []
            outputs:
              - {node: answer, field: answer, name: assistant, mime_type: text/plain, primary: true}
    - apiVersion: gizclaw.admin/v1alpha1
      kind: RuntimeProfile
      metadata: {id: mcp-litelink-music}
      spec:
        resources:
          models:
            llm:
              resource_id: mcp-live-seed-lite
              i18n:
                en: {display_name: Seed 2.1 Lite}
                zh-CN: {display_name: Seed 2.1 Lite}
          mcp_servers:
            litelink:
              endpoint: https://litelink.haivivi.com/mcp/v1/public
              refresh_interval: 5m
          tools:
            playlist-set:
              client_tool: {name: audioplayer.playlist.set}
              i18n:
                en: {display_name: Set playlist}
                zh-CN: {display_name: 设置播放列表}
            play:
              client_tool: {name: audioplayer.play}
              i18n:
                en: {display_name: Play music}
                zh-CN: {display_name: 播放音乐}
            playlist-get:
              client_tool: {name: audioplayer.playlist.get}
              i18n:
                en: {display_name: Read playlist}
                zh-CN: {display_name: 读取播放列表}
            player-status:
              client_tool: {name: audioplayer.get}
              i18n:
                en: {display_name: Read player status}
                zh-CN: {display_name: 读取播放器状态}
        workflows:
          mcp-music:
            resource_id: mcp-litelink-music
            toolkit: {tool_names: [playlist-set, play]}
            mcp:
              litelink:
                resources: true
                tools: [search_catalog, get_work, get_album, list_works]
            i18n:
              en: {display_name: LiteLink music}
              zh-CN: {display_name: LiteLink 音乐}
    - apiVersion: gizclaw.admin/v1alpha1
      kind: RegistrationToken
      metadata: {id: mcp-litelink-music}
      spec:
        token: ${GIZCLAW_TEST_REGISTRATION_TOKEN}
        runtime_profile_id: mcp-litelink-music
