# User Story:
# As a listener who asks for Three Kingdoms without naming an episode,
# I want the assistant to queue the complete matching album in catalog order,
# So that actual device calls and readback prove every episode URL and title.
# The reference endpoint derives expectations from real LiteLink metadata and
# is never included in the model's input. This does not test timed resume or EOS.
version: gizclaw.test/v1alpha1
name: mcp-litelink.seed-lite-three-kingdoms-album
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  reference_endpoint: {direction: input, type: string, env: GIZCLAW_MCP_ALBUM_REFERENCE}
  workspace_name: {direction: input, type: string, generate: token}
  api_key: {direction: output, type: string, secret: true}
  expected_playlist: {direction: output, type: object}
  expected_readback: {direction: output, type: object}
  expected_count: {direction: output, type: integer}
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request: {token: '${registration_token}'}
  - id: install_playlist_handler
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.playlist.set
      response: {audio_player: {items: []}}
      expect_calls: 0
  - id: install_play_handler
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.play
      response: {audio_player: {items: []}}
      expect_calls: 0
  - id: install_playlist_readback
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.playlist.get
      response: {audio_player: {items: []}}
      expect_calls: 0
  - id: install_player_readback
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.get
      response: {audio_player: {items: []}}
      expect_calls: 0
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request: {display_name: MCP album qualification}
    capture: {api_key: /api_key}
  - id: independent_catalog_reference
    client: peer
    http:
      endpoint: ${reference_endpoint}
      method: GET
      path: /album-reference
      status: 200
    expect:
      /album_id: {equals: history.three-kingdoms}
      /count: {minimum: 2, maximum: 32}
    capture:
      expected_playlist: /playlist
      expected_readback: /readback
      expected_count: /count
  - id: workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: mcp-music
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select
    client: peer
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${workspace_name}'}
  - id: activate
    client: peer
    timeout: 90s
    rpc: {method: server.run.workspace.reload, request: {}}
  - id: find_and_play_album
    client: peer
    timeout: 180s
    peer_stream:
      mode: text
      input: 我想听三国。
      require_text: true
      require_audio: false
    expect:
      /text: {contains: 三国}
      /text_eos: {equals: true}
  - id: verify_complete_ordered_album_call
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.playlist.set
      observe_only: true
    expect:
      /calls: {equals: 1}
      /requests/0/args: {equals: '${expected_playlist}'}
  - id: verify_album_play_call
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: audioplayer.play
      observe_only: true
    expect:
      /calls: {equals: 1}
      /requests/0/effective_index: {equals: 0}
      /mutations/0/tool: {equals: audioplayer.playlist.set}
      /mutations/1/tool: {equals: audioplayer.play}
  - id: read_actual_complete_playlist
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers: {Authorization: 'Bearer ${api_key}'}
      body: {tool: audioplayer.playlist.get, args: {}}
      status: 200
    expect:
      /result: {equals: '${expected_readback}'}
  - id: read_actual_player
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers: {Authorization: 'Bearer ${api_key}'}
      body: {tool: audioplayer.get, args: {}}
      status: 200
    expect:
      /result/state: {equals: playing}
      /result/current_index: {equals: 0}
      /result/playlist_length: {equals: '${expected_count}'}
finally:
  - client: peer
    rpc: {method: server.run.stop, request: {}}
  - client: peer
    rpc:
      method: server.workspace.delete
      request: {name: '${workspace_name}'}
  - client: peer
    rpc: {method: server.peer.delete, request: {}}
