apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: chat-memory
spec:
  mem0:
    custom_instructions: Extract durable user identity, preference, relationship, and long-term goal facts.
    custom_categories:
      owner-profile: Durable facts about the user.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Extract durable user identity, preference, relationship, and long-term goal facts.
  volc_mem0:
    strategies:
    - name: owner-profile
      type: user_preference
      custom_instructions: Extract durable user identity and preference facts.
