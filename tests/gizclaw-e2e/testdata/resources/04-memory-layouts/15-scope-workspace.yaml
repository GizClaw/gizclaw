---
apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: giztest-scope-workspace-memory
spec:
  flowcraft:
    scope: workspace
    extraction:
      enabled: false
      model: llm
      mode: single_pass
    lanes:
    - name: owner-profile
      kind: preference
      description: Facts confined to the test Workspace.
      extract: Keep exact facts from the test input.
      recall: Return the exact fact when queried.
    graph_enabled: false
    write: {mode: sync, tier: general}
  mem0:
    scope: workspace
    custom_instructions: Keep exact facts from the test input.
  volc_mem0:
    scope: workspace
    strategies:
    - {name: owner-profile, type: semantic, custom_instructions: Keep exact facts from the test input.}
