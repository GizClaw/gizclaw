apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: voice-assistant-memory
spec:
  mem0:
    custom_instructions: Extract durable identity, preference, relationship, and long-term context facts from voice
      conversations.
    custom_categories:
      conversation-memory: Durable facts extracted from voice conversations.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Extract durable identity, preference, relationship, and long-term context facts from voice
      conversations.
  volc_mem0:
    strategies:
    - name: conversation-memory
      type: semantic
      custom_instructions: Extract durable identity, preference, relationship, and long-term context facts from
        voice conversations.
