apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: poetry-memory
spec:
  mem0:
    custom_instructions: Do not extract conversational facts; accept only Graph-written poetry audit facts.
    custom_categories:
      checkpoint-progress: Linear dynasty checkpoint audit.
      achievement-log: Recitation success and mistake audit.
      badge-events: Awarded badge and point audit.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Do not extract conversational facts; accept only Graph-written poetry audit facts.
  volc_mem0:
    strategies:
    - name: checkpoint-progress
      type: summary
      custom_instructions: Retain Graph-written checkpoint progress facts.
    - name: achievement-log
      type: semantic
      custom_instructions: Retain Graph-written achievement facts.
    - name: badge-events
      type: semantic
      custom_instructions: Retain Graph-written badge facts.
