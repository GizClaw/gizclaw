apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: storyteller-memory
spec:
  mem0:
    custom_instructions: Do not extract conversational facts; accept only Graph-written audit facts.
    custom_categories:
      story-state: Story continuity audit.
      blueprint-state: Blueprint boundary audit.
      cast-state: Cast continuity audit.
      user-state: User participation audit.
      continuity-state: Continuity guard audit.
      ending-state: Ending policy audit.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Do not extract conversational facts; accept only Graph-written audit facts.
  volc_mem0:
    strategies:
    - name: story-state
      type: summary
      custom_instructions: Retain Graph-written story state facts.
    - name: blueprint-state
      type: summary
      custom_instructions: Retain Graph-written blueprint facts.
    - name: cast-state
      type: summary
      custom_instructions: Retain Graph-written cast facts.
    - name: user-state
      type: summary
      custom_instructions: Retain Graph-written user state facts.
    - name: continuity-state
      type: summary
      custom_instructions: Retain Graph-written continuity facts.
    - name: ending-state
      type: summary
      custom_instructions: Retain Graph-written ending facts.
