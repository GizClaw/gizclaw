apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: werewolf-memory
spec:
  mem0:
    custom_instructions: Do not infer game state from conversation; accept only Graph-written werewolf game facts.
    custom_categories:
      game-progress: Game progress audit.
      public-timeline: Public timeline.
      seat-memory: Private per-seat continuity.
      resolution-log: Resolution event audit.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Do not infer game state from conversation; accept only Graph-written werewolf game facts.
  volc_mem0:
    strategies:
    - name: game-progress
      type: summary
      custom_instructions: Retain Graph-written game progress facts.
    - name: public-timeline
      type: semantic
      custom_instructions: Retain Graph-written public timeline facts.
    - name: seat-memory
      type: summary
      custom_instructions: Retain Graph-written private seat continuity facts.
    - name: resolution-log
      type: semantic
      custom_instructions: Retain Graph-written resolution events.
