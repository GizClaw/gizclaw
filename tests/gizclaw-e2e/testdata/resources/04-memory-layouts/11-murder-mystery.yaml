apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: murder-mystery-memory
spec:
  mem0:
    custom_instructions: Do not extract conversational facts; accept only Graph-written case audit facts.
    custom_categories:
      case-state: Deterministic case state audit.
      progress-badges: Deterministic progress badge audit.
    multilingual: true
    decay: false
  mem0_self_hosted:
    custom_instructions: Do not extract conversational facts; accept only Graph-written case audit facts.
  volc_mem0:
    strategies:
    - name: case-state
      type: summary
      custom_instructions: Retain Graph-written case state facts.
    - name: progress-badges
      type: summary
      custom_instructions: Retain Graph-written progress badge facts.
