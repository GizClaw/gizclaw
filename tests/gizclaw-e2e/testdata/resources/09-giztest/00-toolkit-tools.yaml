---
# Declaration-only Tools bound by the e2e-giztest RuntimeProfile. Workspace
# toolkit selections resolve them (server.workspace.toolkit.roundtrip), and the
# giztest-toolkit-probe-* Workflows opt into them so a real model can list their
# declarations (server.workspace.toolkit.exposure). Workflows that do not list
# them never receive them, and the reserved .invalid host is never dialed.
# Device procedures are the predefined tool/v0 ClientTool set, not Admin Tools.
apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Tool
    metadata:
      id: giztest-toolkit-echo
    spec:
      type: http_request
      invoke_name: giztest_echo
      description: Return a deterministic Giztest echo marker for a key.
      input_schema:
        type: object
        properties:
          key:
            type: string
        required:
        - key
        additionalProperties: false
      http:
        url: https://giztest.invalid/echo
        method: GET
        auth:
          method: none
        query:
        - argument_pointer: /key
          target: key
        timeout: 1s
        max_response_bytes: 1024
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Tool
    metadata:
      id: giztest-toolkit-other
    spec:
      type: http_request
      invoke_name: giztest_other
      description: Return a second deterministic Giztest marker for a key.
      input_schema:
        type: object
        properties:
          key:
            type: string
        required:
        - key
        additionalProperties: false
      http:
        url: https://giztest.invalid/other
        method: GET
        auth:
          method: none
        query:
        - argument_pointer: /key
          target: key
        timeout: 1s
        max_response_bytes: 1024
