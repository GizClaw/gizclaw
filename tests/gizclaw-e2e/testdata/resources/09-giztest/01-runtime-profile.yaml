    eino-mixed-provider-voices: {resource_id: eino-mixed-provider-voices, i18n: {en: {display_name: Eino Mixed Provider Voices}, zh-CN: {display_name: Eino 跨厂商音色}}, tags: [assistants]}
    flowcraft-mixed-provider-voices: {resource_id: flowcraft-mixed-provider-voices, i18n: {en: {display_name: Flowcraft Mixed Provider Voices}, zh-CN: {display_name: Flowcraft 跨厂商音色}}, tags: [assistants]}
