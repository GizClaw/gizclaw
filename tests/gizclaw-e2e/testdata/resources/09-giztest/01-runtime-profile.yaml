---
apiVersion: gizclaw.admin/v1alpha1
kind: RuntimeProfile
metadata:
  id: e2e-giztest
spec:
  workflows:
    collections:
      assistants:
        volc-ast-translate-tts: {resource_id: volc-ast-translate-tts, i18n: {en: {display_name: AST Translate TTS}, zh-CN: {display_name: AST 翻译 TTS}}}
        volc-ast-translate-zh-jp: {resource_id: volc-ast-translate-zh-jp, i18n: {en: {display_name: Chinese Japanese Translate}, zh-CN: {display_name: 中日翻译}}}
        volc-ast-translate: {resource_id: volc-ast-translate, i18n: {en: {display_name: AST Translate}, zh-CN: {display_name: AST 翻译}}}
        doubao-realtime-conversation: {resource_id: doubao-realtime-conversation, i18n: {en: {display_name: Doubao Realtime}, zh-CN: {display_name: 豆包实时对话}}}
        doubao-realtime-tts-conversation: {resource_id: doubao-realtime-tts-conversation, i18n: {en: {display_name: Doubao Realtime External TTS}, zh-CN: {display_name: 豆包实时对话外挂 TTS}}}
        flowcraft-voice-assistant: {resource_id: flowcraft-voice-assistant, i18n: {en: {display_name: Flowcraft Voice Assistant}, zh-CN: {display_name: Flowcraft 语音助手}}}
        flowcraft-chat-assistant: {resource_id: flowcraft-chat-assistant, i18n: {en: {display_name: Flowcraft Chat Assistant}, zh-CN: {display_name: Flowcraft 对话助手}}}
        doubao-realtime-quality: {resource_id: doubao-realtime-quality, i18n: {en: {display_name: Doubao Quality}, zh-CN: {display_name: 豆包质量测试}}}
        flowcraft-journey-guide: {resource_id: flowcraft-journey-guide, i18n: {en: {display_name: Journey Guide}, zh-CN: {display_name: 旅程向导}}}
        flowcraft-multi-role-storyteller: {resource_id: flowcraft-multi-role-storyteller, i18n: {en: {display_name: Storyteller}, zh-CN: {display_name: 多角色故事}}}
        flowcraft-murder-mystery: {resource_id: flowcraft-murder-mystery, i18n: {en: {display_name: Murder Mystery}, zh-CN: {display_name: 剧本杀}}}
        flowcraft-poetry-adventure-li-bai: {resource_id: flowcraft-poetry-adventure-li-bai, i18n: {en: {display_name: Poetry Adventure}, zh-CN: {display_name: 李白诗词冒险}}}
        flowcraft-werewolf-game: {resource_id: flowcraft-werewolf-game, i18n: {en: {display_name: Werewolf Game}, zh-CN: {display_name: 狼人杀}}}
        volc-ast-translate-zh-en: {resource_id: volc-ast-translate-zh-en, i18n: {en: {display_name: Chinese English Translate}, zh-CN: {display_name: 中英翻译}}}
        dashscope-realtime-conversation: {resource_id: dashscope-realtime-conversation, i18n: {en: {display_name: DashScope Realtime}, zh-CN: {display_name: 百炼实时对话}}}
        doubao-realtime-duplex-conversation: {resource_id: doubao-realtime-duplex-conversation, i18n: {en: {display_name: Doubao Realtime Duplex}, zh-CN: {display_name: 豆包双工对话}}}
        eino-memory-assistant: {resource_id: eino-memory-assistant, i18n: {en: {display_name: Eino Memory Assistant}, zh-CN: {display_name: Eino 记忆助手}}}
        flowcraft-configured-memory: {resource_id: flowcraft-configured-memory, i18n: {en: {display_name: Configured Memory}, zh-CN: {display_name: 配置记忆}}}
        flowcraft-realtime-chat: {resource_id: flowcraft-realtime-chat, i18n: {en: {display_name: Realtime Chat}, zh-CN: {display_name: 实时对话}}}
        flowcraft-latency-comparison: {resource_id: flowcraft-latency-comparison, i18n: {en: {display_name: Flowcraft Latency}, zh-CN: {display_name: Flowcraft 延迟}}}
        eino-latency-comparison: {resource_id: eino-latency-comparison, i18n: {en: {display_name: Eino Latency}, zh-CN: {display_name: Eino 延迟}}}
        eino-concurrency-assistant: {resource_id: eino-concurrency-assistant, i18n: {en: {display_name: Eino Concurrency}, zh-CN: {display_name: Eino 并发}}}
        giztest-workflow-tester: {resource_id: giztest-workflow-tester, i18n: {en: {display_name: Giztest Workflow Tester}, zh-CN: {display_name: Giztest 测试驱动}}}
        eino-speaker-voices: {resource_id: eino-speaker-voices, i18n: {en: {display_name: Eino Speaker Voices}, zh-CN: {display_name: Eino 分段音色}}}
        flowcraft-speaker-voices: {resource_id: flowcraft-speaker-voices, i18n: {en: {display_name: Flowcraft Speaker Voices}, zh-CN: {display_name: Flowcraft 分段音色}}}
        eino-mixed-provider-voices: {resource_id: eino-mixed-provider-voices, i18n: {en: {display_name: Eino Mixed Provider Voices}, zh-CN: {display_name: Eino 跨厂商音色}}}
        flowcraft-mixed-provider-voices: {resource_id: flowcraft-mixed-provider-voices, i18n: {en: {display_name: Flowcraft Mixed Provider Voices}, zh-CN: {display_name: Flowcraft 跨厂商音色}}}
        safety-fence-flowcraft: {resource_id: safety-fence-flowcraft, i18n: {en: {display_name: Safety Fence Flowcraft}, zh-CN: {display_name: 安全围栏 Flowcraft}}}
        safety-fence-eino: {resource_id: safety-fence-eino, i18n: {en: {display_name: Safety Fence Eino}, zh-CN: {display_name: 安全围栏 Eino}}}
        safety-fence-doubao-realtime: {resource_id: safety-fence-doubao-realtime, i18n: {en: {display_name: Safety Fence Doubao Realtime}, zh-CN: {display_name: 安全围栏豆包实时}}}
        safety-fence-doubao-realtime-duplex: {resource_id: safety-fence-doubao-realtime-duplex, i18n: {en: {display_name: Safety Fence Doubao Duplex}, zh-CN: {display_name: 安全围栏豆包双工}}}
        safety-fence-dashscope-realtime: {resource_id: safety-fence-dashscope-realtime, i18n: {en: {display_name: Safety Fence DashScope Realtime}, zh-CN: {display_name: 安全围栏百炼实时}}}
  # Only general is defined: server.workspace.safety-fence.missing-profile relies
  # on child being absent. The marker lets giztest observe the injected prompt.
  safety_fences:
    general:
      prompt: 安全规则：你的每一次回复都必须以“安全模式已开启”这六个字开头，然后再正常回答。
  resources:
    models:
      asr: {resource_id: volc-bigasr-sauc, i18n: {en: {display_name: Speech Recognition}, zh-CN: {display_name: 语音识别}}}
      llm: {resource_id: doubao-mini-chat, i18n: {en: {display_name: Chat Model}, zh-CN: {display_name: 对话模型}}}
      tts: {resource_id: volc-bigtts, i18n: {en: {display_name: Speech Synthesis}, zh-CN: {display_name: 语音合成}}}
      translation: {resource_id: volc-ast-translate, i18n: {en: {display_name: Translation}, zh-CN: {display_name: 翻译}}}
      realtime: {resource_id: doubao-realtime-dialog, i18n: {en: {display_name: Realtime Conversation}, zh-CN: {display_name: 实时对话}}}
      realtime-duplex: {resource_id: doubao-realtime-duplex-dialog, i18n: {en: {display_name: Realtime Duplex}, zh-CN: {display_name: 实时双工}}}
      dash-realtime: {resource_id: qwen-realtime-dialog, i18n: {en: {display_name: DashScope Realtime}, zh-CN: {display_name: 百炼实时对话}}}
      qwen3-asr-flash-realtime: {resource_id: qwen-realtime-dialog, i18n: {en: {display_name: DashScope Realtime ASR}, zh-CN: {display_name: 百炼实时识别}}}
    voices:
      narrator: {resource_id: "volc-tenant:volc-main:zh_female_xiaohe_uranus_bigtts", i18n: {en: {display_name: Narrator}, zh-CN: {display_name: 旁白}}}
      assistant-voice: {resource_id: "volc-tenant:volc-main:zh_female_vv_uranus_bigtts", i18n: {en: {display_name: Assistant}, zh-CN: {display_name: 助手}}}
      japanese-voice: {resource_id: "volc-tenant:volc-main:multi_female_shuangkuaisisi_moon_bigtts", i18n: {en: {display_name: Japanese Assistant}, zh-CN: {display_name: 日语助手}}}
      doubao-assistant: {resource_id: "volc-tenant:volc-main:zh_female_vv_jupiter_bigtts", i18n: {en: {display_name: Doubao Assistant}, zh-CN: {display_name: 豆包助手}}}
      sun-wukong: {resource_id: "volc-tenant:volc-main:zh_female_xiaohe_uranus_bigtts", i18n: {en: {display_name: Sun Wukong}, zh-CN: {display_name: 孙悟空}}}
      tang-sanzang: {resource_id: "volc-tenant:volc-main:zh_female_vv_uranus_bigtts", i18n: {en: {display_name: Tang Sanzang}, zh-CN: {display_name: 唐三藏}}}
      zhu-bajie: {resource_id: "volc-tenant:volc-main:zh_female_xiaohe_uranus_bigtts", i18n: {en: {display_name: Zhu Bajie}, zh-CN: {display_name: 猪八戒}}}
      monster: {resource_id: "volc-tenant:volc-main:zh_female_vv_uranus_bigtts", i18n: {en: {display_name: Monster}, zh-CN: {display_name: 妖怪}}}
      story-bird: {resource_id: "volc-tenant:volc-main:zh_male_naiqimengwa_mars_bigtts", i18n: {en: {display_name: Story Bird}, zh-CN: {display_name: 故事小鸟}}}
      minimax-boy: {resource_id: "minimax-tenant:minimax-cn:Chinese (Mandarin)_Pure-hearted_Boy", i18n: {en: {display_name: MiniMax Boy}, zh-CN: {display_name: MiniMax 邻家弟弟}}}
    tools:
      giztest-other: {resource_id: giztest-client-other, i18n: {en: {display_name: Giztest other tool}, zh-CN: {display_name: Giztest 另一工具}}}
      giztest-echo: {resource_id: giztest-client-echo, control_access: owner, i18n: {en: {display_name: Giztest client echo}, zh-CN: {display_name: Giztest 客户端回显}}}
    memories:
      default-memory: {layout_id: default-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      voice-assistant-memory: {layout_id: voice-assistant-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      chat-memory: {layout_id: chat-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      journey-memory: {layout_id: journey-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      storyteller-memory: {layout_id: storyteller-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      murder-mystery-memory: {layout_id: murder-mystery-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      poetry-memory: {layout_id: poetry-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
      werewolf-memory: {layout_id: werewolf-memory, driver: flowcraft, connection: {type: flowcraft_redis8, url: "redis://redis:6379/0"}}
  app_config:
    ui.theme: dark
    app.entrypoints: |
      {"home": "/tab/home", "settings": "/tab/settings"}
    feature.flags: beta-voice,beta-audio
  mhs:
    v0:
      devices:
      - id: display.main
        kind: display
        states:
        - {name: brightness, type: int, access: read_write, min: 0, max: 100, step: 5}
      - id: led.status
        kind: led
        states:
        - {name: enabled, type: bool, access: read_write}
        - {name: brightness, type: int, access: read_write, min: 0, max: 100, unit: '%'}
      - id: battery.main
        kind: battery
        states:
        - {name: level, type: int, access: read, min: 0, max: 100, unit: '%'}
      - id: speaker.main
        kind: speaker
        states:
        - {name: mode, type: enum, access: read_write, enum_values: [normal, night]}
        - {name: gain, type: double, access: read_write, min: 0, max: 1, step: 0.25}
        - {name: volume, type: int, access: read_write, min: 0, max: 100, unit: '%'}
        - {name: muted, type: bool, access: read_write}
