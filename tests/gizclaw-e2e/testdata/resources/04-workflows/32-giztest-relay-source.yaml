apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: giztest-relay-source
spec:
  driver: eino
  eino:
    graph:
      name: giztest-relay-source
      compile:
        node_trigger_mode: any_predecessor
      state:
        fields:
          - name: answer
            type: string
            merge: replace
      nodes:
        - id: request
          type: script
          language: starlark
          entrypoint: run
          source: |
            def run(input):
                return {"text": "请只回答一个数字：一加一等于几？"}
          limits:
            max_execution_steps: 1000
            timeout: 1s
            max_input_bytes: 65536
            max_output_bytes: 65536
          inputs:
            current:
              from: input.text
          outputs:
            text: answer
      edges:
        - from: start
          to: request
        - from: request
          to: end
      branches: []
      outputs:
        - node: request
          field: answer
          name: assistant
          mime_type: text/plain
          primary: true
    conversation:
      initiative: peer
