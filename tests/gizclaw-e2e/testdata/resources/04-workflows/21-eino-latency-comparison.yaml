---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-latency-comparison
spec:
  driver: eino
  memory: default-memory
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: assistant-voice
      node_voices:
        answer-model: assistant-voice
    graph:
      name: Complex Workflow Latency Comparison
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 16
      state:
        fields:
        - name: recalled-memory
          type: string
          merge: replace
        - name: captured-input
          type: string
          merge: replace
        - name: planner-messages
          type: messages
          merge: replace
        - name: plan
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: completion
          type: string
          merge: replace
      nodes:
      - id: recall-memory
        type: memory_recall
        query_from: input.text
        output: recalled-memory
        top_k: 5
      - id: capture-input
        type: passthrough
        inputs:
          value:
            from: input.text
        outputs:
          value: captured-input
      - id: planner-prompt
        type: prompt
        inputs:
          text:
            from: captured-input
        outputs:
          messages: planner-messages
        format: f_string
        messages:
        - role: system
          template: 请把用户请求归纳成一个不超过二十个汉字的执行计划。只输出计划，不要解释。
        - role: user
          template: "{text}"
      - id: planner-model
        type: chat_model
        inputs:
          messages:
            from: planner-messages
        outputs:
          text: plan
        model: llm
        max_tokens: 64
        temperature: 0
      - id: answer-prompt
        type: prompt
        inputs:
          text:
            from: captured-input
          memory:
            from: recalled-memory
          plan:
            from: plan
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            你是一个简短、准确的中文语音助手。
            请参考下面的长期记忆和执行计划回答用户；长期记忆为空时忽略。
            长期记忆：
            {memory}
            执行计划：
            {plan}
            回答只说一句简短中文，不要提及计划或记忆。
        - role: user
          template: "{text}"
      - id: answer-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: llm
        max_tokens: 128
        temperature: 0
      - id: observe-turn
        type: memory_observe
        facts:
        - text_from: captured-input
        - text_from: answer
        wait_for_completion: true
      - id: completion-barrier
        type: passthrough
        inputs:
          value:
            from: answer
        outputs:
          value: completion
      edges:
      - from: start
        to: recall-memory
      - from: recall-memory
        to: capture-input
      - from: capture-input
        to: planner-prompt
      - from: planner-prompt
        to: planner-model
      - from: planner-model
        to: answer-prompt
      - from: answer-prompt
        to: answer-model
      - from: answer-model
        to: observe-turn
      - from: observe-turn
        to: completion-barrier
      - from: completion-barrier
        to: end
      branches: []
      outputs:
      - node: answer-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
