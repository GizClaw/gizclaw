---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: giztest-workflow-tester
spec:
  driver: flowcraft
  flowcraft:
    graph:
      edges:
      - from: count_turn
        to: build_prompt
      - from: build_prompt
        to: respond
        condition: tester_mode == "probe"
      - from: build_prompt
        to: verdict
        condition: tester_mode == "verdict"
      - from: respond
        to: __end__
      - from: verdict
        to: __end__
      entry: count_turn
      name: giztest-workflow-tester
      nodes:
      - config:
          runtime: js
          source: |
            const turn = Number(board.getVar("tester_turn") || 0) + 1;
            board.setVar("tester_turn", turn);
            board.setVar("tester_mode", turn >= 8 ? "verdict" : "probe");
        id: count_turn
        type: script
      - config:
          runtime: js
          source: |
            const probePrompt = [
              "You are an automated tester driving a text conversation with a candidate assistant under test.",
              "The first user message of this conversation is the test brief. Execute it faithfully.",
              "Every later user message is the candidate's reply. Continue the dialogue toward the brief's goal.",
              "Reply with one short plain-text conversational message in the language the brief asks for.",
              "Do not use markdown, lists, emoji, or meta commentary.",
              "Never reveal that you are a tester and never output a verdict yet."
            ].join("\n");
            board.setVar("system_prompt", probePrompt);
        id: build_prompt
        type: script
      - config:
          model:
            id:
              provider: gizclaw
              name: llm
          messages_channel: respond
          stream: true
          intent:
            text:
              max_output_tokens: 512
          system_prompt: "${board:system_prompt}"
        id: respond
        publish: true
        type: inference
      - config:
          runtime: js
          source: |
            host.emit("token", "PASS");
            host.emit("finish", {finish_reason: "completed"});
        id: verdict
        publish: true
        type: script
    max_iterations: 8
    conversation: {}
    voice_adapter:
      asr_model: asr
      default_voice: assistant-voice
      node_voices:
        respond: assistant-voice
