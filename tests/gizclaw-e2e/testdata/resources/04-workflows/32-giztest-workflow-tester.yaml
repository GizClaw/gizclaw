apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: giztest-workflow-tester
spec:
  driver: eino
  eino:
    graph:
      name: giztest-workflow-tester
      state:
        fields:
          - name: messages
            type: messages
            merge: replace
          - name: answer
            type: string
            merge: replace
          - name: turn
            type: integer
            merge: replace
          - name: instruction
            type: string
            merge: replace
          - name: published
            type: string
            merge: replace
      nodes:
        - id: count
          type: script
          language: starlark
          source: |
            def run(input):
                turn = input["turn"] + 1
                probe = "You are an automated tester. The first user message is the test brief, later user messages are candidate replies. Ask one short conversational question in the brief language. This is probe turn %d of 7. Never output PASS or FAIL during probes. Do not demand a completed story or definitive culprit unless the brief requires it. Do not reveal you are a tester." % turn
                verdict = "Evaluate only the seven candidate replies against the test brief and each preceding question. Do not demand a completed story or definitive culprit unless required by the brief. An honest explanation of insufficient evidence with a relevant next investigation is responsive. Output exactly PASS or FAIL, nothing else. FAIL requires a specific criterion violation."
                return {"turn": turn, "instruction": verdict if turn >= 8 else probe}
          limits: &a1
            max_execution_steps: 100000
            timeout: 1s
            max_input_bytes: 1048576
            max_output_bytes: 1048576
          inputs:
            turn:
              from: turn
          outputs:
            turn: turn
            instruction: instruction
          entrypoint: run
        - id: prompt
          type: prompt
          format: f_string
          inputs:
            history:
              from: input.messages
            safety:
              from: input.safety_fence
            instruction:
              from: instruction
          outputs:
            messages: messages
          messages:
            - role: system
              template: |-
                {instruction}
                {safety}
            - placeholder: history
              optional: true
        - id: answer
          type: chat_model
          model: llm
          max_tokens: 512
          inputs:
            messages:
              from: messages
          outputs:
            text: answer
        - id: publish
          type: script
          language: starlark
          source: |
            def run(input):
                answer = input["answer"].strip()
                if input["turn"] >= 8:
                    answer = "PASS" if answer.upper().startswith("PASS") else "FAIL"
                elif not answer or answer.upper() in ["PASS", "FAIL"]:
                    answer = "请就刚才的话题再补充一点好吗？"
                return {"text": answer}
          limits: *a1
          inputs:
            turn:
              from: turn
            answer:
              from: answer
          outputs:
            text: published
          entrypoint: run
      edges:
        - from: start
          to: count
        - from: count
          to: prompt
        - from: prompt
          to: answer
        - from: answer
          to: publish
        - from: publish
          to: end
      outputs:
        - node: publish
          field: published
          name: assistant
          mime_type: text/plain
          primary: true
      compile:
        node_trigger_mode: any_predecessor
      branches: []
    state_persistence:
      fields:
        - turn
    voice_adapter:
      asr_model: asr
      default_voice: assistant-voice
      node_voices: {}
