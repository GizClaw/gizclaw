apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-planner-latency-comparison
spec:
  toolkit:
    tool_ids: []
  driver: eino
  memory: default-memory
  eino:
    graph:
      name: eino-planner-latency-comparison
      compile:
        node_trigger_mode: any_predecessor
      state:
        fields:
          - name: messages
            type: messages
            merge: replace
          - name: answer
            type: string
            merge: replace
          - name: user-text
            type: string
            merge: replace
          - name: recalled-memory
            type: string
            merge: replace
          - name: memory-turns
            type: messages
            merge: replace
          - name: planner-messages
            type: messages
            merge: replace
          - name: plan
            type: string
            merge: replace
      nodes:
        - id: capture-input
          type: passthrough
          inputs:
            value:
              from: input.text
          outputs:
            value: user-text
        - id: recall
          type: memory_recall
          query_from: user-text
          output: recalled-memory
          top_k: 5
        - id: prompt
          type: prompt
          format: f_string
          inputs:
            history:
              from: input.messages
            safety:
              from: input.safety_fence
            memory:
              from: recalled-memory
            plan:
              from: plan
          outputs:
            messages: messages
          messages:
            - role: system
              template: |-
                你是简短准确的中文语音助手。依据长期记忆和执行计划回答。只说一句简短中文。

                {safety}
                可参考长期记忆；为空时忽略：
                {memory}
                执行计划：{plan}
            - placeholder: history
              optional: true
        - id: answer
          type: chat_model
          model: llm
          max_tokens: 128
          inputs:
            messages:
              from: messages
          outputs:
            text: answer
        - id: memory-turns
          type: transform
          operation: build_messages
          inputs:
            user:
              from: user-text
            assistant:
              from: answer
          outputs:
            messages: memory-turns
          messages:
            - role: user
              input: user
            - role: assistant
              input: assistant
        - id: remember
          type: memory_observe
          turns_from: memory-turns
          wait_for_completion: true
        - id: planner-prompt
          type: prompt
          format: f_string
          inputs:
            text:
              from: user-text
          outputs:
            messages: planner-messages
          messages:
            - role: system
              template: 把用户请求归纳成不超过二十个汉字的执行计划，只输出计划。
            - role: user
              template: "{text}"
        - id: planner
          type: chat_model
          model: llm
          max_tokens: 64
          temperature: 0
          inputs:
            messages:
              from: planner-messages
          outputs:
            text: plan
      edges:
        - from: start
          to: capture-input
        - from: capture-input
          to: recall
        - from: prompt
          to: answer
        - from: answer
          to: memory-turns
        - from: memory-turns
          to: remember
        - from: remember
          to: end
        - from: recall
          to: planner-prompt
        - from: planner-prompt
          to: planner
        - from: planner
          to: prompt
      branches: []
      outputs:
        - node: answer
          field: answer
          name: assistant
          mime_type: text/plain
          primary: true
    voice_adapter:
      asr_model: asr
      default_voice: assistant-voice
      node_voices:
        answer: assistant-voice
