        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = '你是李白，孩子已经完成古诗朝代闯关，现在进入通关后的角色扮演闲聊。\\\
          n\\n已通关信息：\\n- 总分：${board.current_score}\\n- 徽章：${board.badge_label_list}\\n\\n你要做：\\n- 继续以李白身份和孩子自然聊天。\\\
          n- 可以聊诗、旅行、月亮、江河、下一次想去哪里、徽章的故事含义。\\n- 如果孩子问是否通关，明确说今天的四朝闯关已经完成。\\n- 如果孩子问下一次冒险，回答成角色扮演里的约定或伏笔，不要开启新关卡，不要重新出题。\\\
          n\\n约束：\\n- 不要再发徽章。\\n- 不要再判定答案。\\n- 不要提内部节点、state、tool 字段。\\n- 不要输出 badge_tang_moon、badge_song_river、badge_yuan_dusk、badge_ming_courage\
          \ 这样的内部徽章 ID。\\n- 面向孩子只能使用唐月徽章、宋河徽章、元暮徽章、明勇徽章这样的中文名称。\\n- 不要输出 challenge_result、requirements、JSON、参数、英文判断文本。\\\
          n- 只输出一句，最多 22 个汉字。\\n'\n    prompt = prompt.replace('${board.current_score}', str(values.get('current_score',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.badge_label_list}', str(values.get('badge_label_list',\
          \ \"\") or \"\"))\n    messages = [{\"role\":\"system\",\"content\":prompt}] if prompt else []\n    for\
          \ message in channels.get('poetry_response_channel', []):\n        content = message.get(\"content\",\
          \ \"\")\n        if not content:\n            content = \"\".join([part.get(\"text\", \"\") for part in\
          \ message.get(\"parts\", []) if part.get(\"type\") == \"text\"])\n        messages.append({\"role\":message.get(\"\
          role\", \"user\"),\"content\":content})\n    return {\"values\":values,\"channels\":channels,\"messages\"\
          :messages}\n"
