        source: "def _get(value, key):\n    if type(value) == \"dict\":\n        return value.get(key)\n    if type(value)\
          \ in [\"list\", \"string\"] and type(key) in [\"int\", \"float\"]:\n        index = int(key)\n       \
          \ return value[index] if index >= 0 and index < len(value) else None\n    return None\n\ndef _truth(value):\n\
          \    if type(value) in [\"dict\", \"list\", \"function\", \"builtin_function_or_method\"]:\n        return\
          \ True\n    return bool(value)\n\ndef _string(value):\n    if value == None:\n        return \"null\"\n\
          \    if type(value) == \"bool\":\n        return \"true\" if value else \"false\"\n    if type(value)\
          \ == \"float\" and value == int(value):\n        return str(int(value))\n    return str(value)\n\ndef\
          \ _number(value):\n    if value == None or value == \"\" or value == False:\n        return 0\n    if\
          \ value == True:\n        return 1\n    return float(value) if type(value) == \"string\" else value\n\n\
          def _add(a, b):\n    return _string(a) + _string(b) if type(a) == \"string\" or type(b) == \"string\"\
          \ else a + b\n\ndef _index(value, item):\n    if type(value) == \"string\":\n        return value.find(item)\n\
          \    return value.index(item) if item in value else -1\n\ndef _assign(objects):\n    result = {}\n   \
          \ for value in objects:\n        if value:\n            result.update(value)\n    return result\n\ndef\
          \ _sort(items, compare = None):\n    result = []\n    for item in items:\n        position = len(result)\n\
          \        for index in range(len(result)):\n            less = compare(item, result[index]) < 0 if compare\
          \ else _string(item) < _string(result[index])\n            if less:\n                position = index\n\
          \                break\n        result.insert(position, item)\n    items.clear()\n    items.extend(result)\n\
          \    return items\n\ndef _typeof(value):\n    if type(value) in [\"dict\", \"list\"] or value == None:\n\
          \        return \"object\"\n    return {\"string\": \"string\", \"bool\": \"boolean\", \"int\": \"number\"\
          , \"float\": \"number\", \"function\": \"function\"}.get(type(value), \"undefined\")\n\ndef _imul(a, b):\n\
          \    return ((int(a) * int(b) + 2147483648) % 4294967296) - 2147483648\n\ndef run(input):\n    _values\
          \ = json.decode(json.encode(input[\"values\"]))\n    _channels = json.decode(json.encode(input[\"channels\"\
          ]))\n    _emitted = []\n    _scope0 = {\"state\": None, \"badges\": None, \"attempts\": None}\n    def\
          \ _logical1():\n        value = _get(_values, \"poetry_journey_state\")\n        if _truth(value):\n \
          \           return value\n        return {}\n    _scope0[\"state\"] = _logical1()\n    def _expression2():\n\
          \        return _get(_scope0[\"state\"], \"badges\")\n    def _expression3():\n        return []\n   \
          \ _scope0[\"badges\"] = (_expression2() if _truth((type(_get(_scope0[\"state\"], \"badges\")) == \"list\"\
          )) else _expression3())\n    def _logical4():\n        value = _get(_scope0[\"state\"], \"attempts\")\n\
          \        if not _truth(value):\n            return value\n        return (_typeof(_get(_scope0[\"state\"\
          ], \"attempts\")) == \"object\")\n    def _expression5():\n        return _get(_scope0[\"state\"], \"\
          attempts\")\n    def _expression6():\n        return {}\n    _scope0[\"attempts\"] = (_expression5() if\
          \ _truth(_logical4()) else _expression6())\n    def _logical7():\n        value = _get(_scope0[\"state\"\
          ], \"status\")\n        if _truth(value):\n            return value\n        return \"playing\"\n    def\
          \ _logical8():\n        value = _get(_scope0[\"state\"], \"checkpoint\")\n        if _truth(value):\n\
          \            return value\n        return \"\"\n    def _logical9():\n        value = _get(_scope0[\"\
          state\"], \"score\")\n        if _truth(value):\n            return value\n        return 0\n    _values[\"\
          tmp_checkpoint_progress_line\"] = _add(_add(_add(_add(_add(_add(_add(_add(_add(\"checkpoint_progress:\
          \ status=\", _logical7()), \"; checkpoint=\"), _logical8()), \"; score=\"), _logical9()), \"; badges=\"\
          ), \",\".join([_string(_item) for _item in _scope0[\"badges\"]])), \"; awaiting=\"), (_get(_scope0[\"\
          state\"], \"awaiting_response\") == True))\n    def _logical10():\n        def _logical11():\n       \
          \     value = _get(_scope0[\"state\"], \"last_dynasty\")\n            if _truth(value):\n            \
          \    return value\n            return _get(_scope0[\"state\"], \"checkpoint\")\n        value = _logical11()\n\
          \        if _truth(value):\n            return value\n        return \"\"\n    def _logical12():\n   \
          \     value = _get(_scope0[\"state\"], \"last_result\")\n        if _truth(value):\n            return\
          \ value\n        return \"\"\n    def _logical13():\n        value = _get(_scope0[\"state\"], \"last_line\"\
          )\n        if _truth(value):\n            return value\n        return \"\"\n    _values[\"tmp_achievement_log_line\"\
          ] = _add(_add(_add(_add(_add(_add(_add(\"achievement_log: checkpoint=\", _logical10()), \"; result=\"\
          ), _logical12()), \"; line=\"), _logical13()), \"; attempts=\"), json.encode(_scope0[\"attempts\"]))\n\
          \    def _logical14():\n        value = _get(_scope0[\"state\"], \"last_badge\")\n        if _truth(value):\n\
          \            return value\n        return \"none\"\n    def _logical15():\n        value = _get(_scope0[\"\
          state\"], \"last_points\")\n        if _truth(value):\n            return value\n        return 0\n  \
