---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-configured-memory
spec:
  driver: flowcraft
  memory: default-memory
  flowcraft:
    graph:
      edges:
      - from: answer
        to: __end__
      entry: answer
      name: Configured Memory Assistant
      nodes:
      - config:
          model:
            id:
              provider: gizclaw
              name: llm
          messages_channel: answer
          stream: true
          intent:
            text:
              max_output_tokens: 2048
          system_prompt: |
            你是一个简短、准确的中文语音助手。
            相关长期记忆如下；如果为空就忽略：
            ${board:recalled_memory}
        id: answer
        publish: true
        type: inference
    memory_hooks:
      context:
        query:
          current_message: true
        budget:
          max_items: 5
        output: recalled_memory_items
        render:
          output: recalled_memory
      turn:
        channel: answer
    max_iterations: 4
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        answer: narrator
