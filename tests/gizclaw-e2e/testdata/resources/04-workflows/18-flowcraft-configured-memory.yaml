---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  name: flowcraft-configured-memory
spec:
  driver: flowcraft
  flowcraft:
    agent:
      graph:
        edges:
        - from: answer
          to: __end__
        entry: answer
        name: Configured Memory Assistant
        nodes:
        - config:
            max_tokens: 2048
            model: llm
            system_prompt: |
              你是一个简短、准确的中文语音助手。
              相关长期记忆如下；如果为空就忽略：
              ${board.recalled_memory}
          id: answer
          publish: true
          type: llm
      id: configured-memory
      max_iterations: 4
      name: Configured Memory Assistant
    conversation:
      starts: peer
    memory:
      enabled: true
      recall:
        enabled: true
        profiles:
          recalled_memory:
            output: recalled_memory
            query:
              text: input
            top_k: 5
      write:
        mode: sync
        save_conversation: true
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        answer: narrator
