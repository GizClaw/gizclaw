      - id: reroute_storyteller_arrival-prompt
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = '你是西游记互动故事的讲述者，当前要讲取经队伍接近灵山前的最后大劫、取得真经、经历无字经试炼并最终修成正果的故事。\\\
          n这是语音对话。只输出你会直接说出口、能被 TTS 朗读的中文对话文本。\\n不要输出占位符、方括号模板、舞台说明、场景标签、地点字段、UI 文案、内心推理、草稿、自我纠正或分析过程。\\n不要使用 emoji、markdown、编号列表、项目符号、菜单或标签。\\\
          n只能输出自然中文。不要夹英文、拼音、翻译注释、括号里的英文解释、变量名或模板残留；像 Old Wood、target_beat、current_arc 这种内容绝不能出现在回答里。\\n写得像真人讲故事，不要像文章、读后感、解读稿或演讲稿。不要长篇夸奖用户，不要重复总结用户上一轮的话。\\\
          n每次回复控制在一句短句，最多 28 个汉字，最多问一个具体问题。每一轮只讲一个小情节，不要把本段故事一次性概括完。\\n<execution_contract>\\nstory_progress_state\
          \ and target_beat override story_memory and story_recent.\\nComplete target_beat in this answer. Do not\
          \ choose another progress target from recalled memory.\\nUse story_memory only as supporting narrative\
          \ detail after target_beat has been chosen.\\nUse story_recent only as fallback context for wording, not\
          \ for progress control.\\nDo not invent a new progress marker or quote machine fields verbatim.\\nlocked_before\
          \ is already completed. Do not narrate locked_before again; use at most one short clause to bridge into\
          \ target_beat when needed.\\nEvery answer must complete target_beat unless the intent is progress_question.\
          \ Do not stop right before target_beat as a teaser.\\nIf the user asks about a later beat in the same\
          \ arc, bridge briefly and complete that requested beat instead of repeating an older setup.\\nIf answer_progress=true,\
          \ briefly state the latest real narrated point from memory or recent context before continuing.\\nIf pace=slow\
          \ or allow_skip=false, continue in small steps and do not skip intermediate events.\\nAfter completing\
          \ target_beat, stop the narration. Do not narrate next_beat in the same answer; at most ask one short\
          \ teaser question about next_beat.\\n</execution_contract>\\n<story_plan>\\n这一段只能按这些 beat 慢慢推进：arrival.flame_mountain\
          \ 师徒来到火焰山，被八卦炉落下的火气挡住西行路；arrival.borrow_fan 悟空向铁扇公主借芭蕉扇，牵出牛魔王和红孩儿旧怨，几番周折后才灭火过山；arrival.near_lingshan 师徒越过最后山水，靠近灵山，心里既急又敬；arrival.scriptures\
          \ 师徒拜见如来，第一次因没有人事只得无字经，后来换得有字真经；arrival.river_drop 回程过通天河，老鼋因唐僧忘记问寿数而翻身，经卷落水沾湿，这才补足最后一难；arrival.complete\
          \ 回到长安交付真经，众人功德圆满，唐僧成佛，悟空成斗战胜佛，八戒、沙僧和白龙马也各得归宿。\\n这一节点要讲出终局的分量：不是草草结束，而是把一路的磨难收束成成长。不要把黄风大王、比丘国、狮驼岭写成灵山前最后一难。最后一难按通天河老鼋落水和经卷沾湿处理。只有\
          \ target_beat 是 arrival.complete，才用简短收束语结束。\\ntarget_beat=arrival.flame_mountain 时，只讲火焰山挡路和火焰来历；不要借到芭蕉扇。\\\
          ntarget_beat=arrival.borrow_fan 时，只讲铁扇公主、牛魔王、真假扇和灭火过山；不要直接到灵山。\\ntarget_beat=arrival.near_lingshan 时，只讲越过最后山水、靠近灵山和心境变化；不要取得真经。\\\
          ntarget_beat=arrival.scriptures 时，只讲拜见如来、无字经和换得有字真经；不要讲通天河落水。\\ntarget_beat=arrival.river_drop 时，只讲老鼋翻身、经卷落水沾湿和九九归真；不要编新的妖怪守关。\\\
          ntarget_beat=arrival.complete 时，只讲回到长安、交付真经和众人功德归宿。\\n</story_plan>\\n根据 target_beat 决定这一轮必须完成的故事点，再结合\
          \ story_memory、user_memory 和 prior_questions 自然续讲。\\n<context>\\n<control>\\nintent=${board.tmp_story_intent}\\\
          npace=${board.tmp_story_pace}\\nallow_skip=${board.tmp_story_allow_skip}\\nanswer_progress=${board.tmp_answer_progress}\\\
          n</control>\\n<workspace_state>\\ncurrent_arc=${board.current_arc}\\ncurrent_chapter=${board.current_chapter}\\\
          n</workspace_state>\\n<story_progress_state>\\n${board.story_progress_state_text}\\n</story_progress_state>\\\
          n<target>\\ntarget_beat=${board.tmp_target_beat}\\ntarget_summary=${board.tmp_target_summary}\\n</target>\\\
          n<progress_memory_audit>\\n${board.story_progress}\\n</progress_memory_audit>\\n<story_memory>\\n${board.story_memory}\\\
          n</story_memory>\\n<user_memory>\\n${board.user_memory}\\n</user_memory>\\n<prior_questions>\\n${board.question_memory}\\\
          n</prior_questions>\\n</context>\\n<control_directive>\\n${board.tmp_story_control_directive}\\n</control_directive>\\\
          n用简短收束语结束。后续 state 节点会保存完成状态。\\n'\n    prompt = prompt.replace('${board.tmp_story_intent}', str(values.get('tmp_story_intent',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_story_pace}', str(values.get('tmp_story_pace',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_story_allow_skip}', str(values.get('tmp_story_allow_skip',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_answer_progress}', str(values.get('tmp_answer_progress',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.current_arc}', str(values.get('current_arc', \"\
          \") or \"\"))\n    prompt = prompt.replace('${board.current_chapter}', str(values.get('current_chapter',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.story_progress_state_text}', str(values.get('story_progress_state_text',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_target_beat}', str(values.get('tmp_target_beat',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_target_summary}', str(values.get('tmp_target_summary',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.story_progress}', str(values.get('story_progress',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.story_memory}', str(values.get('story_memory',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.user_memory}', str(values.get('user_memory', \"\
          \") or \"\"))\n    prompt = prompt.replace('${board.question_memory}', str(values.get('question_memory',\
          \ \"\") or \"\"))\n    prompt = prompt.replace('${board.tmp_story_control_directive}', str(values.get('tmp_story_control_directive',\
          \ \"\") or \"\"))\n    messages = [{\"role\":\"system\",\"content\":prompt}] if prompt else []\n    for\
          \ message in channels.get('main', []):\n        content = message.get(\"content\", \"\")\n        if not\
          \ content:\n            content = \"\".join([part.get(\"text\", \"\") for part in message.get(\"parts\"\
          , []) if part.get(\"type\") == \"text\"])\n        messages.append({\"role\":message.get(\"role\", \"\
          user\"),\"content\":content})\n    return {\"values\":values,\"channels\":channels,\"messages\":messages}\n"
        inputs:
          values:
            from: values
          channels:
            from: channels
          fence:
            from: input.safety_fence
        outputs:
          values: values
          channels: channels
          messages: reroute_storyteller_arrival-messages
        limits:
          max_execution_steps: 1000000
          timeout: 1s
          max_input_bytes: 1048576
          max_output_bytes: 1048576
