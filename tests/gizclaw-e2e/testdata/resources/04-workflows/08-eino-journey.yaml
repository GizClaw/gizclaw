      - id: reroute_state_after
        type: script
        language: starlark
        entrypoint: run
        source: "def _get(value, key):\n    if type(value) == \"dict\":\n        return value.get(key)\n    if type(value)\
          \ in [\"list\", \"string\"] and type(key) in [\"int\", \"float\"]:\n        index = int(key)\n       \
          \ return value[index] if index >= 0 and index < len(value) else None\n    return None\n\ndef _truth(value):\n\
          \    if type(value) in [\"dict\", \"list\", \"function\", \"builtin_function_or_method\"]:\n        return\
          \ True\n    return bool(value)\n\ndef _string(value):\n    if value == None:\n        return \"null\"\n\
          \    if type(value) == \"bool\":\n        return \"true\" if value else \"false\"\n    if type(value)\
          \ == \"float\" and value == int(value):\n        return str(int(value))\n    return str(value)\n\ndef\
          \ _number(value):\n    if value == None or value == \"\" or value == False:\n        return 0\n    if\
          \ value == True:\n        return 1\n    return float(value) if type(value) == \"string\" else value\n\n\
          def _add(a, b):\n    return _string(a) + _string(b) if type(a) == \"string\" or type(b) == \"string\"\
          \ else a + b\n\ndef _index(value, item):\n    if type(value) == \"string\":\n        return value.find(item)\n\
          \    return value.index(item) if item in value else -1\n\ndef _assign(objects):\n    result = {}\n   \
          \ for value in objects:\n        if value:\n            result.update(value)\n    return result\n\ndef\
          \ _sort(items, compare = None):\n    result = []\n    for item in items:\n        position = len(result)\n\
          \        for index in range(len(result)):\n            less = compare(item, result[index]) < 0 if compare\
          \ else _string(item) < _string(result[index])\n            if less:\n                position = index\n\
          \                break\n        result.insert(position, item)\n    items.clear()\n    items.extend(result)\n\
          \    return items\n\ndef _typeof(value):\n    if type(value) in [\"dict\", \"list\"] or value == None:\n\
          \        return \"object\"\n    return {\"string\": \"string\", \"bool\": \"boolean\", \"int\": \"number\"\
          , \"float\": \"number\", \"function\": \"function\"}.get(type(value), \"undefined\")\n\ndef _imul(a, b):\n\
          \    return ((int(a) * int(b) + 2147483648) % 4294967296) - 2147483648\n\ndef run(input):\n    _values\
          \ = json.decode(json.encode(input[\"values\"]))\n    _channels = json.decode(json.encode(input[\"channels\"\
          ]))\n    _emitted = []\n    _scope0 = {\"state\": None, \"arc\": None, \"chapter\": None}\n    def _logical1():\n\
          \        value = _get(_values, \"story_progress_state\")\n        if _truth(value):\n            return\
          \ value\n        return {}\n    _scope0[\"state\"] = _logical1()\n    def _logical2():\n        def _logical3():\n\
          \            value = _get(_scope0[\"state\"], \"arc\")\n            if _truth(value):\n              \
          \  return value\n            return _get(_values, \"tmp_story_arc\")\n        value = _logical3()\n  \
          \      if _truth(value):\n            return value\n        return \"origin\"\n    _scope0[\"arc\"] =\
          \ _string(_logical2())\n    _scope0[\"chapter\"] = _get(_values, \"current_chapter\")\n    if _truth((_typeof(_scope0[\"\
          chapter\"]) != \"number\")):\n        _scope0[\"chapter\"] = 0\n    if _truth((_scope0[\"arc\"] == \"\
          arrival\")):\n        if _truth((_scope0[\"chapter\"] < 74)):\n            _scope0[\"chapter\"] = 74\n\
          \        _scope0[\"chapter\"] = min(_add(_scope0[\"chapter\"], 1), 100)\n        _values[\"current_chapter\"\
          ] = _scope0[\"chapter\"]\n    else:\n        if _truth((_scope0[\"arc\"] == \"kingdoms\")):\n        \
          \    if _truth((_scope0[\"chapter\"] < 49)):\n                _scope0[\"chapter\"] = 49\n            _scope0[\"\
          chapter\"] = min(_add(_scope0[\"chapter\"], 1), 74)\n            _values[\"current_chapter\"] = _scope0[\"\
          chapter\"]\n        else:\n            if _truth((_scope0[\"arc\"] == \"trials\")):\n                if\
          \ _truth((_scope0[\"chapter\"] < 27)):\n                    _scope0[\"chapter\"] = 27\n              \
          \  _scope0[\"chapter\"] = min(_add(_scope0[\"chapter\"], 1), 49)\n                _values[\"current_chapter\"\
          ] = _scope0[\"chapter\"]\n            else:\n                if _truth((_scope0[\"arc\"] == \"pilgrimage\"\
          )):\n                    if _truth((_scope0[\"chapter\"] < 14)):\n                        _scope0[\"chapter\"\
          ] = 14\n                    _scope0[\"chapter\"] = min(_add(_scope0[\"chapter\"], 1), 27)\n          \
          \          _values[\"current_chapter\"] = _scope0[\"chapter\"]\n                else:\n              \
          \      if _truth((_scope0[\"arc\"] == \"heaven\")):\n                        if _truth((_scope0[\"chapter\"\
          ] < 7)):\n                            _scope0[\"chapter\"] = 7\n                        _scope0[\"chapter\"\
          ] = min(_add(_scope0[\"chapter\"], 1), 14)\n                        _values[\"current_chapter\"] = _scope0[\"\
          chapter\"]\n                    else:\n                        _scope0[\"chapter\"] = min(_add(_scope0[\"\
          chapter\"], 1), 7)\n                        _values[\"current_chapter\"] = _scope0[\"chapter\"]\n    \
          \                    _scope0[\"arc\"] = \"origin\"\n    _values[\"current_arc\"] = _scope0[\"arc\"]\n\
          \    _values[\"last_arc\"] = _scope0[\"arc\"]\n    return {\"values\": _values, \"channels\": _channels,\
          \ \"text\": \"\".join(_emitted)}\n"
