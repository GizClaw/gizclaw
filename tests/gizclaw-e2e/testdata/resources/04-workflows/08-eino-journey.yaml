          ntarget_beat=origin.demon 时，只讲悟空找到混世魔王、夺刀斩妖、救回猴群；不要去龙宫。\\ntarget_beat=origin.dragon_palace 时，只讲悟空去东海龙宫，试兵器，取得如意金箍棒，并索得披挂；不要闹地府。\\\
