      - id: format_intent-prompt
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = 'You are a fast control formatter\
          \ for a Journey to the West interactive storyteller.\\nClassify the latest user message into structured\
          \ control fields for the graph. Do not answer the user.\\n\\nOutput exactly one line:\\nintent=<start|continue|progress_question|side_question|reroute>;\
          \ route_arc=<none|origin|heaven|pilgrimage|trials|kingdoms|arrival>; route_beat=<none|controlled beat\
          \ id>; pace=<normal|slow>; allow_skip=<true|false>; answer_progress=<true|false>; reason=<short reason>\\\
          n\\nIntent rules:\\n- start: the latest user message is empty.\\n- progress_question: the user asks where\
          \ the story currently is or asks for the last narrated point.\\n- continue: the user wants the current\
          \ story flow to proceed without changing arcs.\\n- side_question: the user asks a factual or preference\
          \ question that should be answered before resuming the current story flow.\\n- reroute: the user clearly\
          \ asks to jump, rewind, avoid the current arc, or talk about a named Journey plot outside the current\
          \ flow.\\n- reroute also applies when the user asks to explain or continue from a concrete controlled\
          \ beat, even if the message uses words like continue or why.\\n\\nControl rules:\\n- route_arc and route_beat\
          \ must be concrete only for intent=reroute. Otherwise route_arc=none and route_beat=none.\\n- route_beat\
          \ should be the closest controlled beat when the user names a specific plot point inside an arc.\\n- If\
          \ the named beat is in the current arc but not the current next_beat, still output intent=reroute with\
          \ that route_beat.\\n- pace=slow when the user asks for slower narration, finer steps, or not skipping\
          \ intermediate beats; otherwise pace=normal.\\n- allow_skip=false when the user asks not to skip or asks\
          \ for slower/finer narration; otherwise allow_skip=true.\\n- answer_progress=true only for intent=progress_question.\\\
          n\\nExamples:\\n- \"\" => intent=start; route_arc=none; route_beat=none; pace=normal; allow_skip=true;\
          \ answer_progress=false.\\n- \"继续讲，慢一点，不要跳过中间情节\" => intent=continue; route_arc=none; route_beat=none;\
          \ pace=slow; allow_skip=false; answer_progress=false.\\n- \"接着讲瀑布里面，不要重新讲仙石\" => intent=continue; route_arc=none;\
          \ route_beat=none; pace=normal; allow_skip=false; answer_progress=false.\\n- \"继续讲美猴王为什么开始担心生死\" => intent=reroute;\
          \ route_arc=origin; route_beat=origin.longevity; pace=normal; allow_skip=false; answer_progress=false.\\\
          n- \"他怎么决定出海\" => intent=reroute; route_arc=origin; route_beat=origin.depart; pace=normal; allow_skip=false;\
          \ answer_progress=false.\\n- \"刚才讲到哪里了？接着那个地方继续\" => intent=progress_question; route_arc=none; route_beat=none;\
          \ pace=normal; allow_skip=false; answer_progress=true.\\n- \"先问一下，他现在已经叫孙悟空了吗？然后继续原来的故事点\" => intent=side_question;\
          \ route_arc=none; route_beat=none; pace=normal; allow_skip=false; answer_progress=false.\\n- \"现在讲第一次见到祖师\"\
          \ => intent=reroute; route_arc=origin; route_beat=origin.name; pace=normal; allow_skip=false; answer_progress=false.\\\
          n- \"现在跳到大闹天宫刚开始\" => intent=reroute; route_arc=heaven; route_beat=heaven.summoned; pace=normal; allow_skip=true;\
          \ answer_progress=false.\\n- \"现在跳到女儿国，只讲刚到女儿国的开头\" => intent=reroute; route_arc=kingdoms; route_beat=kingdoms.daughter_river;\
          \ pace=normal; allow_skip=false; answer_progress=false.\\n- \"讲比丘国救小孩那段\" => intent=reroute; route_arc=kingdoms;\
          \ route_beat=kingdoms.biqiu; pace=normal; allow_skip=false; answer_progress=false.\\n- \"讲火焰山和芭蕉扇\" =>\
          \ intent=reroute; route_arc=arrival; route_beat=arrival.flame_mountain; pace=normal; allow_skip=false;\
          \ answer_progress=false.\\n- \"最后一难是不是通天河落水\" => intent=reroute; route_arc=arrival; route_beat=arrival.river_drop;\
          \ pace=normal; allow_skip=false; answer_progress=false.\\n\\nMandatory arc map:\\n- origin: 花果山, 仙石, 石猴,\
          \ 水帘洞, 美猴王, 出海求仙, 菩提祖师, 斜月三星洞, 得名孙悟空, 龙宫取宝, 生死簿.\\n- heaven: 弼马温, 齐天大圣, 蟠桃园, 蟠桃会, 盗丹, 天兵天将, 二郎神, 大闹天宫,\
          \ 五行山.\\n- pilgrimage: 唐僧出发, 五行山救悟空, 紧箍, 白龙马, 高老庄, 猪八戒, 流沙河, 沙悟净.\\n- trials: 三打白骨精, 白骨精, 真假难辨, 悟空被逐,\
          \ 师徒误会.\\n- kingdoms: 女儿国, 子母河, 女王招亲, 蝎子精, 车迟国, 比丘国, 小儿心肝, 狮驼岭, 青狮白象大鹏.\\n- arrival: 火焰山, 芭蕉扇, 铁扇公主, 牛魔王,\
          \ 灵山, 无字经, 真经, 通天河落水, 经卷沾湿, 功德圆满.\\nIf the user explicitly names one of these plots, choose the mapped\
          \ concrete arc even if recent memory is in another arc.\\n\\nControlled origin beats:\\norigin.birth 石猴出世;\
          \ origin.waterfall 水帘洞; origin.king 美猴王; origin.longevity 生死忧惧; origin.depart 出海求仙; origin.find_master\
          \ 找到灵台方寸山; origin.name 初见祖师并得名孙悟空; origin.practice 洞中修心做杂活; origin.learn_immortality 长生口诀; origin.learn_transform\
          \ 七十二变; origin.cloud 筋斗云; origin.expelled 被逐回花果山; origin.return_home 返回花果山; origin.demon 混世魔王; origin.dragon_palace\
          \ 如意金箍棒; origin.underworld 勾销生死簿.\\nControlled kingdoms beats:\\nkingdoms.daughter_river 女儿国子母河; kingdoms.daughter_queen\
          \ 女儿国王招亲; kingdoms.scorpion 蝎子精截走唐僧; kingdoms.chechi 车迟国斗法; kingdoms.biqiu 比丘国救小儿; kingdoms.lion_camel\
          \ 狮驼岭三魔.\\nControlled arrival beats:\\narrival.flame_mountain 火焰山挡路; arrival.borrow_fan 借芭蕉扇灭火; arrival.near_lingshan\
          \ 接近灵山; arrival.scriptures 无字经换真经; arrival.river_drop 通天河落水经卷沾湿; arrival.complete 功德圆满.\\n\\nCurrent story\
          \ progress:\\n${board.story_progress}\\n\\nRecent story context:\\n${board.story_recent}\\n'\n    prompt\
          \ = prompt.replace('${board.story_progress}', str(values.get('story_progress', \"\") or \"\"))\n    prompt\
