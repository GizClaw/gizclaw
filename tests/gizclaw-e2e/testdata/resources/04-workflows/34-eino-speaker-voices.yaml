---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-speaker-voices
spec:
  driver: eino
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      speaker_voices:
        旁白: narrator
        狐狸: assistant-voice
        小鸟: story-bird
    graph:
      name: eino-speaker-voices
      compile:
        node_trigger_mode: any_predecessor
      state:
        fields:
        - {name: messages, type: messages, merge: replace}
        - {name: answer, type: string, merge: replace}
      nodes:
      - id: prompt
        type: prompt
        inputs:
          text: {from: input.text}
        outputs:
          messages: messages
        format: f_string
        messages:
        - role: system
          template: 你是配音剧本复读器。逐字输出用户给出的剧本，保留全部【】标记和标点，不增删、不改写、不解释。
        - role: user
          template: "{text}"
      - id: answer
        type: chat_model
        inputs:
          messages: {from: messages}
        outputs:
          text: answer
        model: llm
        max_tokens: 256
      edges:
      - {from: start, to: prompt}
      - {from: prompt, to: answer}
      - {from: answer, to: end}
      branches: []
      outputs:
      - {node: answer, field: answer, name: assistant, mime_type: text/plain, primary: true}
