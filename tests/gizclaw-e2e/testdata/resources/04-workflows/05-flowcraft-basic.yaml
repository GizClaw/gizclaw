---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-voice-assistant
spec:
  driver: flowcraft
  memory: voice-assistant-memory
  flowcraft:
    graph:
      edges:
      - from: answer
        to: observe-conversation
      - from: observe-conversation
        to: __end__
      entry: answer
      name: Assistant
      nodes:
      - config:
          model:
            id:
              provider: gizclaw
              name: llm
          messages_channel: answer
          stream: true
          intent:
            text:
              max_output_tokens: 2048
          system_prompt: 你是一个简短、自然的中文语音聊天助手。直接回答用户，不要解释测试流程。
        id: answer
        publish: true
        type: inference
      - config:
          observations:
          - facts:
            - text_from: input
              attributes:
                lane: conversation-memory
          wait_for_completion: false
        id: observe-conversation
        type: memory_observe
    max_iterations: 4
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        answer: narrator
