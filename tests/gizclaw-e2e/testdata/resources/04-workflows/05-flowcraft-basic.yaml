---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  name: flowcraft-voice-assistant
spec:
  driver: flowcraft
  flowcraft:
    graph:
      edges:
      - from: answer
        to: __end__
      entry: answer
      name: Assistant
      nodes:
      - config:
          max_tokens: 2048
          model: llm
          system_prompt: 你是一个简短、自然的中文语音聊天助手。直接回答用户，不要解释测试流程。
        id: answer
        publish: true
        type: llm
    max_iterations: 4
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        answer: narrator
