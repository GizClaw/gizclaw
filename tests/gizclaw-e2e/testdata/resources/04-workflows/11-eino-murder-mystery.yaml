apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-murder-mystery
spec:
  driver: eino
  memory: murder-mystery-memory
  eino:
    graph:
      name: eino-murder-mystery
      compile:
        node_trigger_mode: any_predecessor
        primary_output_mode: first_output
      state:
        fields:
          - name: game
            type: object
            merge: replace
          - name: context
            type: string
            merge: replace
          - name: private
            type: string
            merge: replace
          - name: feedback
            type: string
            merge: replace
          - name: valid
            type: boolean
            merge: replace
          - name: recalled-memory
            type: string
            merge: replace
          - name: messages
            type: messages
            merge: replace
          - name: answer
            type: string
            merge: replace
          - name: rejected
            type: string
            merge: replace
      nodes:
        - id: rules
          type: script
          language: starlark
          entrypoint: run
          source: |
            def run(input):
                game = json.decode(json.encode(input["game"]))
                text = input["text"]
                reset = not game or "重新开始" in text
                if reset:
                    game = {"found": [], "solved": False, "attempts": 0}
                # The original case and its four independent evidence requirements.
                evidence = {
                    "门锁": ["method_lock", "门锁和门缝有新鲜细线划痕。"],
                    "门缝": ["method_lock", "门锁和门缝有新鲜细线划痕。"],
                    "壁炉": ["method_key", "壁炉暗格里有备用钥匙痕迹。"],
                    "留声机": ["time", "留声机会循环播放，死亡时间被误导。"],
                    "后廊": ["route", "后廊有湿脚印和雨水路线。"],
                    "裙摆": ["route", "沈知秋裙摆有未干雨渍。"],
                    "询问沈知秋": ["route", "沈知秋裙摆有未干雨渍。"],
                    "沈知秋房间": ["motive", "抽屉里的遗嘱草稿与旧报纸揭示遗产和生父旧仇。"],
                    "抽屉": ["motive", "抽屉里的遗嘱草稿与旧报纸揭示遗产和生父旧仇。"],
                    "遗嘱": ["motive", "遗嘱草稿牵涉大半遗产。"],
                    "旧报纸": ["motive", "旧报纸揭示沈知秋生父与沈鹤年的旧仇。"],
                }
                if not game["solved"]:
                    for location, clue in evidence.items():
                        if location in text and clue[0] not in game["found"] and any([word in text for word in ["查", "搜", "看", "检查", "调查", "问"]]):
                            game["found"].append(clue[0])
                    accusing = any([word in text for word in ["指认", "凶手", "对质"]])
                    if accusing:
                        game["attempts"] += 1
                    found = game["found"]
                    missing = []
                    if "method_lock" not in found or "method_key" not in found:
                        missing.append("密室手法")
                    if "time" not in found:
                        missing.append("死亡时间")
                    if "route" not in found:
                        missing.append("行动路线")
                    if "motive" not in found:
                        missing.append("动机")
                    if not missing and accusing and "沈知秋" in text:
                        game["solved"] = True
                else:
                    missing = []
                clues = []
                seen = []
                for clue in evidence.values():
                    if clue[0] in game["found"] and clue[0] not in seen:
                        seen.append(clue[0])
                        clues.append(clue[1])
                context = {"title": "雨夜留声机", "clues": clues, "missing": missing, "solved": game["solved"], "attempts": game["attempts"]}
                if game["solved"]:
                    context["culprit"] = "沈知秋"
                    context["solution"] = "备用钥匙进出书房，细线拉内门闩伪造反锁；循环留声机误导死亡时间；经后廊返回；遗嘱与生父旧仇构成动机。"
                return {"game": game, "context": json.encode(context), "feedback": "", "valid": True, "private": ""}
          limits:
            max_execution_steps: 100000
            timeout: 1s
            max_input_bytes: 1048576
            max_output_bytes: 1048576
          inputs:
            game:
              from: game
            text:
              from: input.text
          outputs:
            game: game
            context: context
            private: private
            feedback: feedback
            valid: valid
        - id: reject
          type: passthrough
          inputs:
            value:
              from: feedback
          outputs:
            value: rejected
        - id: recall
          type: memory_recall
          query_from: input.text
          output: recalled-memory
          top_k: 5
        - id: prompt
          type: prompt
          format: f_string
          inputs:
            context:
              from: context
            player:
              from: private
            memory:
              from: recalled-memory
            safety:
              from: input.safety_fence
            history:
              from: input.messages
          outputs:
            messages: messages
          messages:
            - role: system
              template: |-
                你是轻松友好的解谜主持人。主持《雨夜留声机》：侦探在沈家大宅调查古董商沈鹤年的密室死亡。角色有养女沈知秋、亲族陆明远、夫人白素琴、周管家、林医生和厨房帮工阿桂。引导调查门锁、壁炉、留声机、后廊和沈知秋房间，逐步描述已经取得的线索。只有 solved 为 true 才宣布破案；其后可以自由复盘。不要提前泄露未发现的线索或把模型推测当作规则结果。

                当前规则状态（这是权威结果，不得修改或另行判定）：
                {context}
                玩家自己的私密信息：{player}
                长期记忆：{memory}
                {safety}
            - placeholder: history
              optional: true
        - id: host
          type: chat_model
          model: llm
          max_tokens: 2048
          inputs:
            messages:
              from: messages
          outputs:
            text: answer
        - id: remember
          type: memory_observe
          text_from: context
          wait_for_completion: true
      edges:
        - from: start
          to: rules
        - from: reject
          to: end
        - from: recall
          to: prompt
        - from: prompt
          to: host
        - from: host
          to: remember
        - from: remember
          to: end
      branches:
        - from: rules
          mode: first_match
          routes:
            - when:
                field: valid
                op: eq
                value: false
              to: reject
          default: recall
      outputs:
        - node: host
          field: answer
          name: assistant
          mime_type: text/plain
          primary: true
        - node: reject
          field: rejected
          name: rejected
          mime_type: text/plain
    state_persistence:
      fields:
        - game
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        host: narrator
        reject: narrator
