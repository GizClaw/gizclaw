        inputs:
          values:
            from: values
          channels:
            from: channels
        outputs:
          values: values
          channels: channels
          text: load_case_state-text
        limits:
          max_execution_steps: 1000000
          timeout: 1s
          max_input_bytes: 1048576
          max_output_bytes: 1048576
      - id: format_player_action-prompt
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = \"You classify the latest\
          \ user turn for a murder mystery game.\\n\\nOutput exactly one line:\\ncase_action: kind=<kind>; target=<target>\\\
          n\\nValid kinds:\\n- start\\n- inspect_study_lock\\n- inspect_fireplace\\n- inspect_gramophone\\n- inspect_corridor\\\
          n- inspect_shen_zhiqiu\\n- inspect_shen_zhiqiu_room\\n- accuse_shen_zhiqiu\\n- ask_detail\\n- other\\\
          n\\nClassification rules:\\n- Use inspect_study_lock for checking the study, locked door, lock hole, latch,\
          \ door crack, or thread marks.\\n- Use inspect_fireplace for checking fireplace, wall brick, hidden compartment,\
          \ or spare key.\\n- Use inspect_gramophone for checking gramophone, record, needle, song, loop, or death\
          \ time sound.\\n- Use inspect_corridor for checking back corridor, garden path, rain marks, footprints,\
          \ mud, paint, or route.\\n- Use inspect_shen_zhiqiu for questioning or observing Shen Zhiqiu, her alibi,\
          \ dress, skirt, or rain stain.\\n- Use inspect_shen_zhiqiu_room for searching Shen Zhiqiu's room, desk,\
          \ drawer, papers, will, newspaper, motive, family history, or father.\\n- Use accuse_shen_zhiqiu when\
          \ the user names Shen Zhiqiu as culprit, asks whether she is the culprit, or presents a complete accusation.\\\
          n- Use ask_detail for follow-up questions about already mentioned evidence, method, route, motive, ending,\
          \ or contradictions.\\n- Use start for opening/start-game turns.\\n- Use other only when none of the above\
          \ fits.\\n- The current deterministic state is provided below. If the latest user turn is only a short\
          \ confirmation of the previously suggested next step, output current_state.recommended_action exactly.\\\
          n\\nCurrent deterministic state:\\n${board.case_progress_state_text}\\n\\nPattern examples:\\nUser: 我去书房检查门锁和门缝\\\
          ncase_action: kind=inspect_study_lock; target=study_lock\\nUser: 我去壁炉附近找找有没有藏钥匙的地方\\ncase_action: kind=inspect_fireplace;\
          \ target=fireplace\\nUser: 我检查留声机，看它是不是能循环播放\\ncase_action: kind=inspect_gramophone; target=gramophone\\\
          nUser: 我去后廊看有没有脚印或者雨水痕迹\\ncase_action: kind=inspect_corridor; target=back_corridor\\nUser: 我去沈知秋房间看看裙摆和抽屉\\\
          ncase_action: kind=inspect_shen_zhiqiu_room; target=shen_zhiqiu_room\\nUser: 所以凶手真的是沈知秋吗？\\ncase_action:\
          \ kind=accuse_shen_zhiqiu; target=shen_zhiqiu\\nUser: 案子结束后，我想问沈知秋最后有没有后悔。\\ncase_action: kind=ask_detail;\
          \ target=epilogue\\n\\nDo not solve the case. Do not add explanations.\\n\"\n    prompt = prompt.replace('${board.case_progress_state_text}',\
          \ str(values.get('case_progress_state_text', \"\") or \"\"))\n    messages = [{\"role\":\"system\",\"\
          content\":prompt}] if prompt else []\n    for message in channels.get('main', []):\n        content =\
          \ message.get(\"content\", \"\")\n        if not content:\n            content = \"\".join([part.get(\"\
          text\", \"\") for part in message.get(\"parts\", []) if part.get(\"type\") == \"text\"])\n        messages.append({\"\
          role\":message.get(\"role\", \"user\"),\"content\":content})\n    return {\"values\":values,\"channels\"\
          :channels,\"messages\":messages}\n"
        inputs:
          values:
            from: values
          channels:
            from: channels
          fence:
            from: input.safety_fence
        outputs:
          values: values
          channels: channels
          messages: format_player_action-messages
        limits:
          max_execution_steps: 1000000
          timeout: 1s
          max_input_bytes: 1048576
          max_output_bytes: 1048576
      - id: format_player_action
        type: chat_model
        model: llm
        inputs:
          messages:
            from: format_player_action-messages
        outputs:
          text: format_player_action-text
        max_tokens: 2048
        temperature: 0
      - id: format_player_action-capture
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    text = input[\"answer\"]\n    values['case_action_text'] = text\n    return {\"values\"\
          :values,\"channels\":channels}\n"
        inputs:
          values:
            from: values
          channels:
            from: channels
          answer:
            from: format_player_action-text
        outputs:
          values: values
          channels: channels
        limits:
          max_execution_steps: 1000000
          timeout: 1s
          max_input_bytes: 1048576
          max_output_bytes: 1048576
