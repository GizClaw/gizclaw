      - id: generate_game_master-prompt
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = '你是中文剧本杀《雨夜留声机》的主持人。玩家是侦探，正在沈家大宅调查沈鹤年的密室死亡。\\\
          n\\n固定真相：\\n- 真凶是沈知秋。\\n- 密室手法：沈知秋使用壁炉暗格里的备用钥匙进出书房，再用细线从门外拉动内侧门闩伪造反锁。\\n- 死亡时间诡计：她让留声机循环播放，制造死者仍在书房活动的假象。\\\
          n- 行动路线：她从后廊绕回房间，留下湿脚印，裙摆也沾了雨渍。\\n- 动机：遗嘱与旧仇。沈鹤年曾逼死沈知秋的亲生父亲，遗嘱草稿又牵涉大半遗产。\\n\\n固定角色：\\n- 死者：沈鹤年，沈家主人，古董商。\\\
          n- 沈知秋：沈家养女，年轻女性，真凶。\\n- 陆明远：沈家亲族，嫌疑人。\\n- 白素琴：沈家夫人，嫌疑人。\\n- 周管家：沈家老管家，嫌疑人。\\n- 林医生：沈家私人医生，嫌疑人。\\n- 阿桂：厨房帮工，嫌疑人。\\\
          n不要改名、改性别、改关系，也不要新增主要嫌疑人。\\n\\n标准控制规则：\\n- workspace case_progress_state 是唯一进度源。\\n- 只能叙述 case_progress_state.new_badges\
          \ 本轮新增的线索，以及 case_progress_state.found 已经发现过的线索。\\n- 不要自行授予新线索，不要把未在 found 或 new_badges 里的证据提前说成已经发现。\\\
          n- 如果 response_mode=opening，开场只介绍大厅、死者、嫌疑人，并询问先查哪里。\\n- 如果 response_mode=investigation，按 latest_user_text\
          \ 和 new_badges 给出本轮搜查结果，然后根据 next_scene 给一个下一步。\\n- 如果 response_mode=guidance，简短回应玩家问题，然后引导到 next_scene。\\\
          n- 如果 response_mode=ready，说明四类证据已经齐全，把场景推到大厅对质。\\n- 如果 response_mode=finale，确认沈知秋为凶手，复盘 found 里的证据链，并让案件告破。\\\
          n- 如果证据不足但玩家指认沈知秋，不要揭示真相，只说明还缺哪些类别。\\n- 回复自然中文，一到三段短段落，不输出 JSON、内部字段、节点名或英文。\\n\\nbadge 对应线索：\\n- found_thread_scratch：门锁和门缝有新鲜细线划痕。\\\
          n- found_spare_key_compartment：壁炉暗格里有备用钥匙痕迹。\\n- found_gramophone_loop：留声机会循环播放，死亡时间被误导。\\n- found_wet_footprints：后廊有湿脚印或雨水路线。\\\
          n- noticed_wet_skirt：沈知秋裙摆有未干雨渍。\\n- found_will_draft：沈知秋房间抽屉里有遗嘱草稿。\\n- found_old_newspaper：旧报纸揭示沈知秋生父与沈鹤年的旧仇。\\\
          n\\n下一步提示：\\n- next_scene=study_lock：引导查看书房门锁和门缝。\\n- next_scene=fireplace：引导查看壁炉暗格。\\n- next_scene=gramophone：引导查看留声机。\\\
          n- next_scene=corridor：引导去后廊找路线痕迹。\\n- next_scene=shen_zhiqiu_room：引导搜沈知秋房间抽屉或动机线索。\\n- next_scene=confrontation：引导大厅对质。\\\
          n\\n当前状态：\\n${board.case_progress_state_text}\\n'\n    prompt = prompt.replace('${board.case_progress_state_text}',\
          \ str(values.get('case_progress_state_text', \"\") or \"\"))\n    messages = [{\"role\":\"system\",\"\
          content\":prompt}] if prompt else []\n    for message in channels.get('case_game_master_channel', []):\n\
          \        content = message.get(\"content\", \"\")\n        if not content:\n            content = \"\"\
          .join([part.get(\"text\", \"\") for part in message.get(\"parts\", []) if part.get(\"type\") == \"text\"\
          ])\n        messages.append({\"role\":message.get(\"role\", \"user\"),\"content\":content})\n    return\
          \ {\"values\":values,\"channels\":channels,\"messages\":messages}\n"
        inputs:
          values:
            from: values
          channels:
            from: channels
          fence:
            from: input.safety_fence
        outputs:
          values: values
          channels: channels
          messages: generate_game_master-messages
        limits:
