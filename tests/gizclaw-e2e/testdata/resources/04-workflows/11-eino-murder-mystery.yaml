apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-murder-mystery
spec:
  driver: eino
  memory: murder-mystery-memory
  eino:
    graph:
      name: murder-mystery
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 200
        primary_output_mode: first_output
      state:
        fields:
        - name: values
          type: object
          merge: replace
        - name: channels
          type: object
          merge: replace
        - name: load_case_state-text
          type: string
          merge: replace
        - name: format_player_action-messages
          type: messages
          merge: replace
        - name: format_player_action-text
          type: string
          merge: replace
        - name: apply_case_action-text
          type: string
          merge: replace
        - name: route_case-text
          type: string
          merge: replace
        - name: prepare_game_master_messages-text
          type: string
          merge: replace
        - name: generate_game_master-messages
          type: messages
          merge: replace
        - name: generate_game_master-text
          type: string
          merge: replace
        - name: write_case_audit-text
          type: string
          merge: replace
        - name: solved_chat-messages
          type: messages
          merge: replace
        - name: solved_chat-text
          type: string
          merge: replace
        - name: observe_case_audit-fact-0
          type: string
          merge: replace
        - name: observe_case_audit-attribute-0-lane
          type: string
          merge: replace
        - name: observe_case_audit-attribute-0-kind
          type: string
          merge: replace
        - name: observe_case_audit-attribute-0-predicate
          type: string
          merge: replace
        - name: observe_case_audit-attribute-0-subject
          type: string
          merge: replace
        - name: observe_case_audit-fact-1
          type: string
          merge: replace
        - name: observe_case_audit-attribute-1-lane
          type: string
          merge: replace
        - name: observe_case_audit-attribute-1-kind
          type: string
          merge: replace
        - name: observe_case_audit-attribute-1-predicate
          type: string
          merge: replace
        - name: observe_case_audit-attribute-1-subject
          type: string
          merge: replace
        - name: load_case_state-route
          type: string
          merge: replace
        - name: route_case-route
          type: string
          merge: replace
        - name: generate_game_master-route
          type: string
          merge: replace
      nodes:
      - id: initialize-conversation
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    channels[\"main\"] = json.decode(json.encode(input[\"history\"]))\n    values[\"input\"\
          ] = input[\"text\"]\n    values[\"safety_fence\"] = input[\"fence\"]\n    return {\"values\":values,\"\
          channels\":channels}\n"
        inputs:
          values:
            from: values
          channels:
            from: channels
          history:
            from: input.messages
          fence:
            from: input.safety_fence
          text:
            from: input.text
        outputs:
          values: values
          channels: channels
        limits:
          max_execution_steps: 1000000
          timeout: 1s
          max_input_bytes: 1048576
          max_output_bytes: 1048576
      - id: load_case_state
        type: script
        language: starlark
        entrypoint: run
        source: "def _get(value, key):\n    if type(value) == \"dict\":\n        return value.get(key)\n    if type(value)\
