---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-chat-assistant
spec:
  driver: flowcraft
  memory: chat-memory
  flowcraft:
    graph:
      edges:
      - from: recall_memory
        to: style_prompt
      - from: style_prompt
        to: answer
      - from: answer
        to: observe_conversation
      - from: observe_conversation
        to: __end__
      entry: recall_memory
      name: claw-chat
      nodes:
      - config:
          query:
            text_from: input
          output: memory_context
          render:
            header: 'Relevant memory:'
            item_prefix: "- "
            max_items: 5
          top_k: 5
        id: recall_memory
        type: memory_recall
      - config:
          source: "const memoryContext = board.getVar(\"memory_context\") || \"\";\nconst
            commonStyle = [\n  \"This is a spoken voice conversation. Output only
            the exact words your character would say aloud.\",\n  \"Do not use emoji,
            emoticons, kaomoji, pictographic icons, decorative symbols, markdown,
            numbered lists, bullet lists, menus, or labels.\",\n  \"Any emoji or icon
            such as \U0001F62E, \U0001F609, \U0001F914, \U0001F415, \U0001F431, or
            \U0001F98A is invalid output. Use only plain Chinese text and ordinary
            punctuation.\",\n  \"Do not output placeholders, bracketed template text,
            stage directions, scene labels, location fields, or UI text.\",\n  \"Do
            not reveal reasoning, drafts, self-corrections, planning notes, or analysis.\",\n
            \ \"Reply like a real person in a flowing spoken conversation, not like
            a worksheet, form, assistant checklist, or option menu.\",\n  \"Keep each
            reply short and conversational. Use one small imaginative idea, then ask
            at most one natural follow-up question.\",\n  \"If the other speaker gives
            options or a list, do not mirror the list. Pick up the emotional thread
            and continue smoothly in plain dialogue.\"\n].join(\"\\n\");\nconst rolePrompt
            = [\n  \"You are a warm, natural conversational partner for a child persona.\",\n
            \ \"Speak in concise, oral Chinese.\"\n].join(\"\\n\");\nconst memoryPrompt
            = memoryContext ? [\n  \"Memory is factual background only. Use it for
            continuity without copying its wording.\",\n  memoryContext\n].join(\"\\n\")
            : \"\";\nboard.setVar(\"system_prompt\", [commonStyle, rolePrompt, memoryPrompt].filter(Boolean).join(\"\\n\\n\"));\n"
        id: style_prompt
        type: script
      - config:
          max_tokens: 2048
          model: llm
          system_prompt: "${board.system_prompt}"
          track_steps: true
        id: answer
        publish: true
        type: llm
      - config:
          observations:
          - turns_from: conversation
          wait_for_completion: false
        id: observe_conversation
        type: memory_observe
    max_iterations: 8
    conversation: {}
    voice_adapter:
      asr_model: asr
      default_voice: narrator
      node_voices:
        answer: narrator
