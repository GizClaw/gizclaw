# Original audio stays on the typed message path. Only the post-function waits for ASR.
apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Workflow
    metadata:
      id: eino-native-audio-functions
    spec:
      toolkit: {tool_ids: []}
      driver: eino
      eino:
        audio_input: model
        voice_adapter:
          default_voice: multilingual-voice
        graph:
          name: eino-native-audio-functions
          compile:
            node_trigger_mode: any_predecessor
            max_run_steps: 8
          state:
            fields:
            - name: messages
              type: messages
              merge: replace
            - name: answer
              type: string
              merge: replace
          nodes:
          - id: prompt
            type: prompt
            inputs:
              conversation:
                from: input.messages
            outputs:
              messages: messages
            format: f_string
            messages:
            - role: system
              template: 你是语音助手。用用户说话的语言自然回答，结合历史理解这轮原音。
            - placeholder: conversation
          - id: model
            type: chat_model
            inputs:
              messages:
                from: messages
            outputs:
              text: answer
            model: audio-llm
            temperature: 0
          - id: observe-text
            type: script
            inputs:
              text: {from: input.text}
              answer: {from: answer}
            outputs:
              text: answer
            language: starlark
            entrypoint: run
            limits: {max_execution_steps: 10000, timeout: 1s, max_input_bytes: 65536, max_output_bytes: 65536}
            source: |
              def run(input):
                if not input["text"].strip():
                  fail("missing final transcription")
                return {"text": input["answer"]}
          edges:
          - from: start
            to: prompt
          - from: prompt
            to: model
          - from: model
            to: observe-text
          - from: observe-text
            to: end
          branches: []
          outputs:
          - node: model
            field: answer
            name: assistant
            mime_type: text/plain
            primary: true
