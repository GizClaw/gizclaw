# One Workflow that declares both live-audio paths: the streaming ASR Model and
# the chat_model node that receives push-to-talk audio. The e2e-giztest
# RuntimeProfile binding selects the model path, where the audio-input Model
# transcribes the audio in the same reply; a Workspace audio_input parameter
# selects asr, where the ASR Model transcribes first and the Model gets text.
# benchmark.eino-audio-input-comparison compares both on one recording; the
# multilingual reply Voice speaks every sample language.
apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Workflow
    metadata:
      id: eino-audio-input
    spec:
      toolkit: {tool_ids: []}
      driver: eino
      eino:
        voice_adapter:
          asr_model: asr
          default_voice: multilingual-voice
        graph:
          name: eino-audio-input
          compile:
            node_trigger_mode: any_predecessor
            max_run_steps: 6
          state:
            fields:
            - name: messages
              type: messages
              merge: replace
            - name: answer
              type: string
              merge: replace
          nodes:
          - id: prompt
            type: prompt
            inputs:
              conversation:
                from: input.messages
            outputs:
              messages: messages
            format: f_string
            messages:
            - role: system
              template: 你是一个简短、准确的语音助手。用用户说话的语言回答，只说一两句话。
            - placeholder: conversation
          - id: model
            type: chat_model
            inputs:
              messages:
                from: messages
            outputs:
              text: answer
            model: audio-llm
            max_tokens: 256
            temperature: 0
            audio_transcript: true
          edges:
          - from: start
            to: prompt
          - from: prompt
            to: model
          - from: model
            to: end
          branches: []
          outputs:
          - node: model
            field: answer
            name: assistant
            mime_type: text/plain
            primary: true
