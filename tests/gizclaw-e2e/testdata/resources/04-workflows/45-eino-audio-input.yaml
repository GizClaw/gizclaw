# One reusable Workflow with Profile-owned ASR and conversation Models.
# e2e-giztest sends PTT audio to Eino and transcribes it through sideband ASR.
# e2e-audio-asr binds a text-only Model and sends ASR text to Eino.
apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Workflow
    metadata:
      id: eino-audio-input
    spec:
      toolkit: {tool_ids: []}
      driver: eino
      eino:
        voice_adapter:
          default_voice: multilingual-voice
        graph:
          name: eino-audio-input
          compile:
            node_trigger_mode: any_predecessor
            max_run_steps: 6
          state:
            fields:
            - name: messages
              type: messages
              merge: replace
            - name: answer
              type: string
              merge: replace
          nodes:
          - id: prompt
            type: prompt
            inputs:
              conversation:
                from: input.messages
            outputs:
              messages: messages
            format: f_string
            messages:
            - role: system
              template: 你是一个简短、准确的语音助手。用用户说话的语言回答，只说一两句话。
            - placeholder: conversation
          - id: model
            type: chat_model
            inputs:
              messages:
                from: messages
            outputs:
              text: answer
            model: audio-llm
            max_tokens: 256
            temperature: 0
          edges:
          - from: start
            to: prompt
          - from: prompt
            to: model
          - from: model
            to: end
          branches: []
          outputs:
          - node: model
            field: answer
            name: assistant
            mime_type: text/plain
            primary: true
