---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-memory-assistant
spec:
  driver: eino
  memory: default-memory
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: assistant-voice
    graph:
      name: eino-memory-assistant
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 16
      state:
        fields:
        - name: recalled
          type: string
          merge: replace
        - name: messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
        - name: published-answer
          type: string
          merge: replace
      nodes:
      - id: recall-memory
        type: memory_recall
        query_from: input.text
        output: recalled
        top_k: 5
      - id: capture-input
        type: passthrough
        inputs:
          value:
            from: input.text
        outputs:
          value: observation
      - id: prompt
        type: prompt
        inputs:
          text:
            from: observation
          memory:
            from: recalled
        outputs:
          messages: messages
        format: f_string
        messages:
        - role: system
          template: |
            你是一个简短、准确的中文助手。
            相关长期记忆如下；如果为空就忽略：
            {memory}
        - role: user
          template: "{text}"
      - id: model
        type: chat_model
        inputs:
          messages:
            from: messages
        outputs:
          text: answer
        model: llm
        max_tokens: 256
      - id: observe-answer
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      - id: publish-answer
        type: passthrough
        inputs:
          value:
            from: answer
        outputs:
          value: published-answer
      edges:
      - from: start
        to: recall-memory
      - from: recall-memory
        to: capture-input
      - from: capture-input
        to: prompt
      - from: prompt
        to: model
      - from: model
        to: observe-answer
      - from: observe-answer
        to: publish-answer
      - from: publish-answer
        to: end
      branches: []
      outputs:
      - node: publish-answer
        field: published-answer
        name: assistant
        mime_type: text/plain
        primary: true
