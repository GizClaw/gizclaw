      - id: select_speaker-prompt
        type: script
        language: starlark
        entrypoint: run
        source: "def run(input):\n    values = json.decode(json.encode(input[\"values\"]))\n    channels = json.decode(json.encode(input[\"\
          channels\"]))\n    values[\"safety_fence\"] = input[\"fence\"]\n    prompt = 'You select the next visible\
          \ speaker for a fixed-cast multi-role story.\\nYou do not write story prose. Output exactly one control\
          \ line.\\n\\nValid speakers are only:\\nnarrator, wukong, tangseng, bajie, monster\\n\\nRequired format:\\\
          nspeaker=<narrator|wukong|tangseng|bajie|monster>; await_user=<true|false>; guidance=<short Chinese plot\
          \ guidance>; reason=<short Chinese reason>\\n\\nRules:\\n- Use only allowed_speakers from the phase context.\
          \ It is the candidate list for this specific turn.\\n- The blueprint phase goal and guard control the\
          \ scene; do not invent a new story plan.\\n- guidance is a private one-sentence cue for the selected speaker,\
          \ grounded in the original blueprint and current phase.\\n- guidance must respect continuity_state, ending_state,\
          \ and guard.\\n- guidance must not add new major cast, new location, new enemy, or a different plot branch\
          \ unrelated to the phase goal.\\n- guidance and reason must not contain English semicolons or Chinese\
          \ semicolons.\\n- Prefer first_speaker_hint when phase_spoken is empty unless latest_user_text strongly\
          \ addresses another allowed speaker.\\n- Do not repeat last_speaker unless latest_user_text directly addresses\
          \ that speaker or no other allowed speaker fits.\\n- When phase_spoken is not empty and any allowed speaker\
          \ has not spoken in this phase, choose an unused allowed speaker.\\n- Do not choose narrator twice in\
          \ the same phase unless narrator is the only allowed speaker or this is the handoff speaker.\\n- When\
          \ phase_spoken length plus this next speaker reaches handoff_after, choose narrator if narrator is allowed\
          \ and set await_user=true.\\n- await_user=true means narrator will naturally pause for the user. Do not\
          \ create an ask_user node.\\n- If phase is resolution, guide the speaker toward a concrete ending beat,\
          \ not another escalation.\\n- If phase is aftermath, guide toward \"no more danger in this arc\" and dawn\
          \ departure.\\n- If phase is epilogue, speaker must be narrator, await_user must be true, and guidance\
          \ should answer only from confirmed facts or lightly point outside this arc.\\n- If latest_user_text asks\
          \ what happens, who appears, or how the scene changes, narrator is usually best.\\n- If latest_user_text\
          \ talks to or about 悟空/猴/打/砸/开门/金箍棒, wukong may be best.\\n- If latest_user_text talks to or about 唐僧/师父/慈悲/误伤,\
          \ tangseng may be best.\\n- If latest_user_text talks to or about 八戒/老猪, bajie may be best.\\n- If latest_user_text\
          \ talks to or about 妖怪/货郎/门外人/求饶/他说什么, monster may be best when monster is allowed.\\n'\n    messages\
          \ = [{\"role\":\"system\",\"content\":prompt}] if prompt else []\n    for message in channels.get('speaker_select_channel',\
          \ []):\n        content = message.get(\"content\", \"\")\n        if not content:\n            content\
          \ = \"\".join([part.get(\"text\", \"\") for part in message.get(\"parts\", []) if part.get(\"type\") ==\
          \ \"text\"])\n        messages.append({\"role\":message.get(\"role\", \"user\"),\"content\":content})\n\
          \    return {\"values\":values,\"channels\":channels,\"messages\":messages}\n"
        inputs:
