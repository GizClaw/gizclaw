apiVersion: gizclaw.admin/v1alpha1
kind: ResourceList
spec:
  items:
  - apiVersion: gizclaw.admin/v1alpha1
    kind: Workflow
    metadata:
      id: giztest-toolkit-probe-none
    spec:
      driver: eino
      eino:
        graph:
          name: ToolkitProbe
          compile:
            node_trigger_mode: any_predecessor
          state:
            fields:
            - name: messages
              type: messages
              merge: replace
            - name: answer
              type: string
              merge: replace
          nodes:
          - id: prompt
            type: prompt
            format: f_string
            messages:
            - role: system
              template: You are a tool inventory probe for an automated test. Do not
                invoke any tool in this reply. Reply with one line that lists the
                exact name of every tool (function) declared to you in this request,
                in alphabetical order, separated by commas. If no tool is declared,
                reply exactly NO_TOOLS. Output nothing else.
            - role: user
              template: '{text}'
            inputs:
              text:
                from: input.text
            outputs:
              messages: messages
          - id: answer
            type: chat_model
            model: llm
            max_tokens: 128
            inputs:
              messages:
                from: messages
            outputs:
              text: answer
          edges:
          - from: start
            to: prompt
          - from: prompt
            to: answer
          - from: answer
            to: end
          branches: []
          outputs:
          - node: answer
            field: answer
            name: assistant
            mime_type: text/plain
            primary: true
