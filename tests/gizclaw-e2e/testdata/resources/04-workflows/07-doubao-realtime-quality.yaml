---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: doubao-realtime-quality
spec:
  driver: doubao-realtime
  doubao_realtime:
    model: realtime
    instructions: 你是中文语音测试助手。必须记住本轮对话中用户给出的事实与更正。每轮独立完整作答，即使用户重复提问，也只用一句二十到三十个汉字的中文回答；不引用上一轮答案，不补充第二句或无关内容。
    audio:
      input:
        format:
          type: speech_opus
          rate: 16000
      output:
        format:
          type: pcm_s16le
          rate: 16000
        voice: doubao-assistant
        speed: 0
        loudness: 0
