    eino-chat-assistant: {resource_id: safety-fence-eino-script, tags: [assistants, "6-8", stories], i18n: {en: {display_name: Chat Assistant}, zh-CN: {display_name: 对话助手}}}
    safety-fence-eino-script: {resource_id: safety-fence-eino-script, tags: [assistants], i18n: {en: {display_name: Eino Fence}, zh-CN: {display_name: Eino 围栏}}}
    safety-fence-eino: {resource_id: safety-fence-eino, tags: [assistants], i18n: {en: {display_name: Eino Fence}, zh-CN: {display_name: Eino 围栏}}}
    safety-fence-doubao-realtime: {resource_id: safety-fence-doubao-realtime, tags: [assistants], i18n: {en: {display_name: Doubao Realtime Fence}, zh-CN: {display_name: 豆包实时围栏}}}
