    alpha: {prompt: '安全规则：你的每一次回复都必须以“安全模式已开启”这六个字开头，然后再正常回答。'}
    bravo: {prompt: 完整的测试规则 B。}
    charlie: {prompt: 完整的测试规则 C。}
    delta: {prompt: 完整的测试规则 D。}
