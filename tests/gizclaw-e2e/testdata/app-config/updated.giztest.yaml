# User Story:
# As a registered device,
# I want configuration reads to reflect the persisted RuntimeProfile,
# So that administrator updates survive reconnects and Server restarts.
version: gizclaw.test/v1alpha1
name: app-config-updated
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
steps:
- id: register
  client: peer
  rpc:
    method: server.register
    request: {token: "${registration_token}"}
- id: updated_value
  client: peer
  rpc: {method: server.app_config.get, request: {key: ui.theme}}
  expect:
    /value: {equals: light}
- id: replaced_keys
  client: peer
  rpc: {method: server.app_config.list, request: {}}
  expect:
    /keys: {count: 1}
    /keys/0: {equals: ui.theme}
    /has_next: {equals: false}
- id: removed_key
  client: peer
  rpc: {method: server.app_config.get, request: {key: app.entrypoints}}
  expect_error: {code: 5}
finally:
- client: peer
  rpc: {method: server.peer.delete, request: {}}
