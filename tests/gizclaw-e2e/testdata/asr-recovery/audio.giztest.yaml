  expect:
    /transcript: {equals: "answer 9"}
    /reply: {equals: "question 9: answer 9"}
    /response_count: {equals: 1}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_integrity/violations: {equals: 0}
- id: history_has_nine_turns
  client: audio_peer
  rpc:
    method: server.workspace.history.list
    request:
      workspace_name: ${audio_workspace_name}
      order: WORKSPACE_HISTORY_LIST_REQUEST_ORDER_ASC
      limit: 30
  expect:
    /items: {count: 18}
    /items/14/text: {equals: "answer 8"}
    /items/15/text: {equals: "question 8: answer 8"}
    /items/16/text: {equals: "answer 9"}
    /items/17/text: {equals: "question 9: answer 9"}
finally:
- client: audio_peer
  rpc:
    method: server.run.stop
    request: {}
- client: audio_peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${audio_workspace_name}
- client: audio_peer
  rpc:
    method: server.peer.delete
    request: {}
timeout: 240s
