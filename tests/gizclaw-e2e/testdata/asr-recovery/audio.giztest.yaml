    /transcript: {equals: "answer 3"}
    /reply: {equals: "question 3: answer 3"}
    /response_count: {equals: 1}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_integrity/violations: {equals: 0}
- id: question_4
  client: audio_peer
  timeout: 30s
  peer_stream:
