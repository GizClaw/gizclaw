# User Story:
# As a device using an audio Workspace,
# I want to keep the realtime client silent before sending text,
# So that the realtime workspace remains able to reply; PTT drivers do not own continuous VAD.
version: gizclaw.test/v1alpha1
name: device-text-doubao-realtime-silence
timeout: 5m
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: doubao-realtime-conversation
        parameters:
          doubao_realtime_workspace_parameters:
            agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
            input: WORKSPACE_INPUT_MODE_REALTIME
  - id: select
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: silence
    client: peer
    peer_stream:
      mode: listen
      duration: 10s
    expect:
      /audio_bytes:
        equals: 0
  - id: turn_1
    client: peer
    timeout: 60s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "第一轮，请回答苹果。"
      label: demo-home
      require_audio: false
      idle_timeout: 30s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
