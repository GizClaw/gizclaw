# User Story:
# As a device using an audio Workspace,
# I want to send whitespace only, observe silence, and send a normal turn,
# So that the empty input produces no reply and does not block the next turn.
version: gizclaw.test/v1alpha1
name: device-text-doubao-external-tts-whitespace
timeout: 5m
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: doubao-realtime-tts-conversation
        parameters:
          doubao_realtime_workspace_parameters:
            agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: turn_1
    client: peer
    timeout: 60s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: " \t\n\u3000 "
      label: demo-home
      require_text: false
      require_audio: false
      idle_timeout: 2s
    expect:
      /audio_bytes:
        equals: 0
  - id: turn_2
    client: peer
    timeout: 60s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "第二轮，请回答月亮。"
      label: demo-home
      require_audio: false
      idle_timeout: 30s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
