# User Story:
# As a device using an audio Workspace,
# I want to send the device phrase 开始 to the story or adventure workflow,
# So that the workflow starts replying; this product phrase is not a Doubao-specific behavior.
version: gizclaw.test/v1alpha1
name: device-text-opening
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: http://127.0.0.1
variables: {}
steps:
  - id: turn_1
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "开始"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
