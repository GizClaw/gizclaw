# User Story:
# As a device using an audio Workspace,
# I want to send two different messages after each reply ends,
# So that both replies belong to their own turns without duplicates.
version: gizclaw.test/v1alpha1
name: device-text-consecutive
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: http://127.0.0.1
variables: {}
steps:
  - id: turn_1
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "第一轮，请回答苹果。"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
  - id: turn_2
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "第二轮，请回答月亮。"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
