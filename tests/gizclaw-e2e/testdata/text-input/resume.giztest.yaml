# User Story:
# As a device using an audio Workspace,
# I want to create a conversation turn and then send 继续上次的内容,
# So that the story or adventure workflow replies after conversation history exists.
version: gizclaw.test/v1alpha1
name: device-text-resume
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: http://127.0.0.1
variables: {}
steps:
  - id: turn_1
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "我们上次走到了森林入口，请记住。"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
  - id: turn_2
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "继续上次的内容"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
