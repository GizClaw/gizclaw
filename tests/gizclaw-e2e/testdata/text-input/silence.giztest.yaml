# User Story:
# As a device using an audio Workspace,
# I want to keep the realtime client silent before sending text,
# So that the realtime workspace remains able to reply; PTT drivers do not own continuous VAD.
version: gizclaw.test/v1alpha1
name: device-text-silence
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: http://127.0.0.1
variables: {}
steps:
  - id: silence
    client: peer
    peer_stream:
      mode: listen
      duration: 1s
    expect:
      /audio_bytes:
        equals: 0
  - id: turn_1
    client: peer
    timeout: 5s
    peer_stream:
      mode: text
      text_done: true
      timestamp: zero
      input: "第一轮，请回答苹果。"
      label: demo-home
      require_audio: false
      idle_timeout: 3s
    expect:
      /text:
        non_empty: true
      /text_eos:
        equals: true
