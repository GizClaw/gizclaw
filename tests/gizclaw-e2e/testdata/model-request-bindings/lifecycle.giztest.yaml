# User Story:
# As a device whose model uses fixed or reported request headers,
# I want fixed headers to work before telemetry and safe errors for invalid metadata,
# So that each turn sends the configured headers without leaking stale values.
version: gizclaw.test/v1alpha1
name: model-request-bindings.lifecycle
timeout: 90s
clients:
  peer: {identity: ephemeral, connection: webrtc, access_point: '${endpoint}'}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  fixture: {direction: input, type: string, env: GIZCLAW_BINDING_FIXTURE}
  fixed_workspace: {direction: input, type: string, generate: token}
  required_workspace: {direction: input, type: string, generate: token}
  optional_workspace: {direction: input, type: string, generate: token}
steps:
  - id: register
    client: peer
    rpc: {method: server.register, request: {token: '${registration_token}'}}
  - id: create_fixed
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${fixed_workspace}
        workflow_name: fixed-workflow
        parameters:
          eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO}
  - id: select_fixed
    client: peer
    rpc: {method: server.run.workspace.set, request: {workspace_name: '${fixed_workspace}'}}
  - id: fixed_runtime_empty
    client: peer
    rpc: {method: server.status.get, request: {}}
    expect: {/reported_kv/identity: {present: false}}
  - id: fixed_without_telemetry
    client: peer
    timeout: 10s
    peer_stream: {mode: text, input: fixed headers need no telemetry, require_audio: false}
    expect:
      /reply: {equals: binding reply}
      /text_eos: {equals: true}
      /response_count: {equals: 1}
  - id: fixed_headers
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 1}
      /requests/0/has_vid: {equals: false}
      /requests/0/upstream_host: {equals: 'fixture.example:30100'}
      /requests/0/proxy_authorized: {equals: true}
  - id: fixed_refusal
    client: peer
    timeout: 10s
    peer_stream:
      mode: text
      input: exercise protected refusal
      expect_terminal_error:
        code: MODEL_PROVIDER_ERROR
        message: The model provider request failed.
        label: assistant
        retryable: false
    expect:
      /terminal_error/stream_id: {non_empty: true}
      /terminal_error/end_of_stream: {equals: true}
      /reply: {equals: ''}
      /audio_bytes: {equals: 0}
  - id: refusal_request_headers
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 2}
      /requests/1/has_vid: {equals: false}
      /requests/1/proxy_authorized: {equals: true}
  - id: create_required
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${required_workspace}
        workflow_name: required-workflow
        parameters:
          eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO}
  - id: create_optional
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${optional_workspace}
        workflow_name: optional-workflow
        parameters:
          eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO}
  - id: select_required
    client: peer
    rpc: {method: server.run.workspace.set, request: {workspace_name: '${required_workspace}'}}
  - id: reload_required
    client: peer
    rpc: {method: server.run.workspace.reload, request: {}}
  - id: required_missing
    client: peer
    timeout: 10s
    peer_stream:
      mode: text
      input: metadata is missing
      expect_terminal_error:
        code: MODEL_REQUEST_BINDING_MISSING
        message: Model request metadata could not be resolved.
        label: assistant
        retryable: false
    expect:
      /terminal_error/stream_id: {non_empty: true}
      /terminal_error/end_of_stream: {equals: true}
      /response_count: {equals: 0}
      /reply: {equals: ''}
      /audio_bytes: {equals: 0}
  - id: missing_blocks_provider
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect: {/count: {equals: 2}}
  - id: report_identity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000000000'
        observations:
          - kv: {key: identity, json_value: '{"vid":"device-secret-one"}'}
  - id: wait_identity
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect: {/reported_kv/identity/json_value: {equals: '{"vid":"device-secret-one"}'}}
  - id: recovered_turn
    client: peer
    timeout: 10s
    peer_stream: {mode: text, input: metadata is available, require_audio: false}
    expect:
      /reply: {equals: binding reply}
      /text_eos: {equals: true}
      /response_count: {equals: 1}
  - id: first_header
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 3}
      /requests/2/vid: {equals: device-secret-one}
      /requests/2/has_vid: {equals: true}
      /requests/2/upstream_host: {equals: 'fixture.example:30100'}
      /requests/2/proxy_authorized: {equals: true}
  - id: replace_identity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000001000'
        observations:
          - kv: {key: identity, json_value: '{"vid":"device-secret-two"}'}
  - id: wait_replacement
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect: {/reported_kv/identity/json_value: {equals: '{"vid":"device-secret-two"}'}}
  - id: updated_turn
    client: peer
    timeout: 10s
    peer_stream: {mode: text, input: metadata has changed, require_audio: false}
    expect: {/reply: {equals: binding reply}, /text_eos: {equals: true}}
  - id: replacement_header
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 4}
      /requests/3/vid: {equals: device-secret-two}
  - id: delete_identity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000002000'
        observations:
          - kv: {key: identity, delete: true}
          - kv: {key: barrier, json_value: '1'}
  - id: wait_deletion
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect:
      /reported_kv/barrier/json_value: {equals: '1'}
      /reported_kv/identity: {present: false}
  - id: required_deleted
    client: peer
    timeout: 10s
    peer_stream:
      mode: text
      input: metadata was deleted
      expect_terminal_error:
        code: MODEL_REQUEST_BINDING_MISSING
        message: Model request metadata could not be resolved.
        label: assistant
        retryable: false
    expect:
      /terminal_error/stream_id: {non_empty: true}
      /terminal_error/end_of_stream: {equals: true}
      /reply: {equals: ''}
      /audio_bytes: {equals: 0}
  - id: report_null
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000003000'
        observations:
          - kv: {key: identity, json_value: '{"vid":null}'}
  - id: wait_null
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect: {/reported_kv/identity/json_value: {equals: '{"vid":null}'}}
  - id: required_null
    client: peer
    timeout: 10s
    peer_stream:
      mode: text
      input: metadata is null
      expect_terminal_error:
        code: MODEL_REQUEST_BINDING_NULL
        message: Model request metadata could not be resolved.
        label: assistant
        retryable: false
    expect: {/reply: {equals: ''}, /audio_bytes: {equals: 0}}
  - id: deletion_and_null_block_provider
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect: {/count: {equals: 4}}
  - id: select_optional
    client: peer
    rpc: {method: server.run.workspace.set, request: {workspace_name: '${optional_workspace}'}}
  - id: reload_optional
    client: peer
    rpc: {method: server.run.workspace.reload, request: {}}
  - id: optional_null
    client: peer
    timeout: 10s
    peer_stream: {mode: text, input: null metadata is optional, require_audio: false}
    expect: {/reply: {equals: binding reply}, /text_eos: {equals: true}}
  - id: null_omits_header
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 5}
      /requests/4/has_vid: {equals: false}
  - id: report_invalid
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000004000'
        observations:
          - kv: {key: identity, json_value: '{"vid":42}'}
  - id: wait_invalid
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect: {/reported_kv/identity/json_value: {equals: '{"vid":42}'}}
  - id: optional_invalid
    client: peer
    timeout: 10s
    peer_stream:
      mode: text
      input: invalid metadata is not omitted
      expect_terminal_error:
        code: MODEL_REQUEST_BINDING_INVALID
        message: Model request metadata could not be resolved.
        label: assistant
        retryable: false
    expect: {/reply: {equals: ''}, /audio_bytes: {equals: 0}}
  - id: invalid_blocks_provider
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect: {/count: {equals: 5}}
  - id: delete_optional_identity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: '1600000005000'
        observations:
          - kv: {key: identity, delete: true}
          - kv: {key: barrier, json_value: '2'}
  - id: wait_optional_deletion
    client: peer
    rpc: {method: server.status.get, request: {}}
    retry: {attempts: 10, on: [assertion], delay: 100ms}
    expect:
      /reported_kv/barrier/json_value: {equals: '2'}
      /reported_kv/identity: {present: false}
  - id: optional_missing
    client: peer
    timeout: 10s
    peer_stream: {mode: text, input: missing metadata is optional, require_audio: false}
    expect: {/reply: {equals: binding reply}, /text_eos: {equals: true}}
  - id: missing_omits_header
    client: peer
    http: {method: GET, endpoint: '${fixture}', path: /requests}
    expect:
      /count: {equals: 6}
      /requests/5/has_vid: {equals: false}
finally:
  - id: stop
    client: peer
    rpc: {method: server.run.stop, request: {}}
  - id: delete_required_workspace
    client: peer
    rpc: {method: server.workspace.delete, request: {name: '${required_workspace}'}}
  - id: delete_fixed_workspace
    client: peer
    rpc: {method: server.workspace.delete, request: {name: '${fixed_workspace}'}}
  - id: delete_optional_workspace
    client: peer
    rpc: {method: server.workspace.delete, request: {name: '${optional_workspace}'}}
  - id: delete_peer
    client: peer
    rpc: {method: server.peer.delete, request: {}}
