# User Story:
# As a native PTT device using a hidden structured control node,
# I want both model nodes to receive original audio while only the answer reaches History,
# So that internal JSON never becomes an assistant reply and reload keeps ordered History.
# Response latency is qualified separately with completion: first_response.
# This fixture declares one model response per turn; counts describe only this graph.
version: gizclaw.test/v1alpha1
name: eino-native-structured-control.push-to-talk-transcript
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  workflow_name:
    direction: input
    type: string
    env: GIZCLAW_NATIVE_AUDIO_WORKFLOW
  input_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  transcript_1:
    direction: output
    type: string
  reply_1:
    direction: output
    type: string
  transcript_2:
    direction: output
    type: string
  reply_2:
    direction: output
    type: string
  user_history_1:
    direction: output
    type: string
  reply_history_1:
    direction: output
    type: string
  user_history_2:
    direction: output
    type: string
  reply_history_2:
    direction: output
    type: string
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: ${workflow_name}
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: reload_workspace
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
    expect:
      /audio_input:
        equals: AUDIO_INPUT_PATH_MODEL
  - id: synthesize_question
    client: peer
    speech:
      cache: run
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 三加五等于几？
        accepted_content_types:
          - audio/ogg
    save_as: input_audio
  - id: ask_by_voice
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      trim_trailing_silence: true
      wait_for_history: true
      require_text: true
      require_audio: true
      reply_observation: 1s
    expect:
      /first_transcript_ms:
        minimum: 1
      /first_text_ms:
        minimum: 1
      /first_audio_ms:
        minimum: 1
      /transcript:
        non_empty: true
      /reply:
        non_empty: true
      /history_name:
        non_empty: true
      /text_eos:
        equals: true
      /audio_eos:
        equals: true
      /response_count:
        equals: 1
      /audio_bytes:
        minimum: 1
      /audio_integrity/streams:
        equals: 1
      /audio_integrity/max_active:
        equals: 1
      /audio_integrity/open:
        equals: 0
      /audio_integrity/violations:
        equals: 0
    capture:
      transcript_1: /transcript
      reply_1: /reply
  - id: exact_history_1
    client: peer
    rpc:
      method: server.workspace.history.list
      request:
        workspace_name: ${workspace_name}
        order: WORKSPACE_HISTORY_LIST_REQUEST_ORDER_ASC
        limit: 20
    expect:
      /available:
        equals: true
      /has_next:
        equals: false
      /items:
        count: 2
      /items/0/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_GEAR
      /items/0/text:
        equals: ${transcript_1}
      /items/0/audio_available:
        equals: true
      /items/1/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_AGENT
      /items/1/text:
        equals: ${reply_1}
      /items/1/audio_available:
        equals: true
    capture:
      user_history_1: /items/0/name
      reply_history_1: /items/1/name
  - id: download_user_1
    client: peer
    rpc_stream:
      method: server.workspace.history.audio.download
      request:
        workspace_name: ${workspace_name}
        history_name: ${user_history_1}
      max_bytes: 16777216
    expect:
      /bytes:
        minimum: 1
  - id: download_reply_1
    client: peer
    rpc_stream:
      method: server.workspace.history.audio.download
      request:
        workspace_name: ${workspace_name}
        history_name: ${reply_history_1}
      max_bytes: 16777216
    expect:
      /bytes:
        minimum: 1
  - id: reload_between_turns
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
    expect:
      /audio_input:
        equals: AUDIO_INPUT_PATH_MODEL
  - id: synthesize_second_question
    client: peer
    speech:
      cache: run
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 我再说长一点，请记住刚才已经回答过的那道题。现在想象我们走进一间安静的图书馆，先把手里的书放回桌上，再看一眼墙上的钟，随后找到窗边的座位坐下。窗外有风，桌上还有一杯水，这些只是背景说明，不需要逐句重复，也不需要解释图书馆的规则。请保留前面的对话，最后只回答这个新问题：九减四等于多少？
        accepted_content_types:
          - audio/ogg
    save_as: input_audio_2
  - id: ask_again
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio_2}
      pacing: 20ms
      trim_trailing_silence: true
      wait_for_history: true
      require_text: true
      require_audio: true
      reply_observation: 1s
    expect:
      /input_ms:
        minimum: 15000
      /first_transcript_ms:
        minimum: 1
      /first_text_ms:
        minimum: 1
      /first_audio_ms:
        minimum: 1
      /transcript:
        non_empty: true
      /reply:
        non_empty: true
      /history_name:
        non_empty: true
      /text_eos:
        equals: true
      /audio_eos:
        equals: true
      /response_count:
        equals: 1
      /audio_bytes:
        minimum: 1
      /audio_integrity/streams:
        equals: 1
      /audio_integrity/max_active:
        equals: 1
      /audio_integrity/open:
        equals: 0
      /audio_integrity/violations:
        equals: 0
    capture:
      transcript_2: /transcript
      reply_2: /reply
  - id: exact_history_2
    client: peer
    rpc:
      method: server.workspace.history.list
      request:
        workspace_name: ${workspace_name}
        order: WORKSPACE_HISTORY_LIST_REQUEST_ORDER_ASC
        limit: 20
    expect:
      /available:
        equals: true
      /has_next:
        equals: false
      /items:
        count: 4
      /items/0/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_GEAR
      /items/0/text:
        equals: ${transcript_1}
      /items/0/audio_available:
        equals: true
      /items/1/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_AGENT
      /items/1/text:
        equals: ${reply_1}
      /items/1/audio_available:
        equals: true
      /items/2/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_GEAR
      /items/2/text:
        equals: ${transcript_2}
      /items/2/audio_available:
        equals: true
      /items/3/type:
        equals: PEER_RUN_HISTORY_ENTRY_TYPE_AGENT
      /items/3/text:
        equals: ${reply_2}
      /items/3/audio_available:
        equals: true
    capture:
      user_history_2: /items/2/name
      reply_history_2: /items/3/name
  - id: download_user_2
    client: peer
    rpc_stream:
      method: server.workspace.history.audio.download
      request:
        workspace_name: ${workspace_name}
        history_name: ${user_history_2}
      max_bytes: 16777216
    expect:
      /bytes:
        minimum: 1
  - id: download_reply_2
    client: peer
    rpc_stream:
      method: server.workspace.history.audio.download
      request:
        workspace_name: ${workspace_name}
        history_name: ${reply_history_2}
      max_bytes: 16777216
    expect:
      /bytes:
        minimum: 1
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
