# User Story:
# As a voice user sending consecutive turns after an opening,
# I want each reply to belong to its own input despite queued earlier output,
# So that an old text or audio tail cannot make the next turn pass.
version: gizclaw.test/v1alpha1
name: audio-turn-ownership.push-to-talk.reopened
timeout: 45s
clients:
  peer: {identity: ephemeral, connection: webrtc, access_point: '${endpoint}'}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  fixture_endpoint: {direction: input, type: string, env: GIZCLAW_TURN_FIXTURE}
  workspace_name: {direction: input, type: string, generate: token}
  input_audio: {direction: output, type: audio, max_bytes: 1048576, media_type: audio/ogg, codec: opus}
steps:
- id: register
  client: peer
  rpc: {method: server.register, request: {token: '${registration_token}'}}
- id: create
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      workflow_name: native-history
      parameters:
        eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO, input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK}
- id: select
  client: peer
  rpc: {method: server.run.workspace.set, request: {workspace_name: '${workspace_name}'}}
- id: reload
  client: peer
  rpc: {method: server.run.workspace.reload, request: {}}
- id: prepare_audio
  client: peer
  speech:
    method: server.speech.synthesize
    request: {voice_name: speech, text: input tone, accepted_content_types: [audio/ogg]}
  save_as: input_audio
- id: opening
  client: peer
  peer_stream:
    mode: text
    input: opening
    completion: first_response
    require_audio: false
    first_text_timeout: 3s
  expect:
    /reply: {equals: 'slow-opening.'}
- id: release_old_tail
  client: peer
  http: {method: POST, endpoint: '${fixture_endpoint}', path: /opening-tail, body: {}, status: 200}
  expect: {/released: {equals: true}}
- id: first_turn
  client: peer
  timeout: 12s
  peer_stream:
    mode: push-to-talk
    input: ${input_audio}
    pacing: 20ms
    completion: first_response
    first_text_timeout: 3s
    first_audio_timeout: 3s
  expect:
    /reply: {equals: first reply}
    /first_text_ms: {minimum: 100}
    /first_audio_ms: {minimum: 100}
    /response_count: {equals: 1}
    /audio_bytes: {minimum: 1}
    /audio_integrity/streams: {equals: 1}
    /audio_integrity/violations: {equals: 0}
- id: second_turn
  client: peer
  timeout: 12s
  peer_stream:
    mode: push-to-talk
    input: ${input_audio}
    pacing: 20ms
    completion: first_response
    first_text_timeout: 3s
    first_audio_timeout: 3s
  expect:
    /reply: {equals: second reply}
    /first_text_ms: {minimum: 100}
    /first_audio_ms: {minimum: 100}
    /response_count: {equals: 1}
    /audio_bytes: {minimum: 1}
    /audio_integrity/streams: {equals: 1}
    /audio_integrity/violations: {equals: 0}
finally:
- id: stop
  client: peer
  rpc: {method: server.run.stop, request: {}}
- id: delete_workspace
  client: peer
  rpc: {method: server.workspace.delete, request: {name: '${workspace_name}'}}
- id: delete_peer
  client: peer
  rpc: {method: server.peer.delete, request: {}}
report: {redact: [registration_token]}
