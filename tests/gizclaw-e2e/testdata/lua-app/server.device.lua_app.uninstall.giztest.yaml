# User Story:
# As a device owner,
# I want to uninstall Lua apps through the real device RPC,
# So that removal, repeated calls, safe IDs and reinstallation are observable.
{
  "version": "gizclaw.test/v1alpha1",
  "name": "server.device.lua_app.uninstall",
  "clients": {
    "peer": {
      "identity": "ephemeral",
      "connection": "webrtc",
      "access_point": "${endpoint}"
    }
  },
  "variables": {
    "endpoint": {
      "direction": "input",
      "type": "string",
      "env": "GIZCLAW_TEST_ENDPOINT"
    },
    "registration_token": {
      "direction": "input",
      "type": "string",
      "env": "GIZCLAW_TEST_REGISTRATION_TOKEN",
      "secret": true
    },
    "resource_name": {
      "direction": "input",
      "type": "string",
      "generate": "token"
    },
    "api_key": {
      "direction": "output",
      "type": "string",
      "secret": true
    }
  },
  "steps": [
    {
      "id": "register",
      "client": "peer",
      "rpc": {
        "method": "server.register",
        "request": {
          "token": "${registration_token}"
        }
      }
    },
    {
      "id": "key",
      "client": "peer",
      "rpc": {
        "method": "server.api_key.create",
        "request": {
          "display_name": "${resource_name}"
        }
      },
      "capture": {
        "api_key": "/api_key"
      }
    },
    {
      "id": "install",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.install",
          "args": {
            "url": "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib",
            "sha256": "370b1d1a471466d21c312cde40b0a9a962c7abbe5ea19320e00fac406b2b5728"
          }
        },
        "status": 200
      },
      "expect": {
        "/result/app/app_id": {
          "equals": "tetris"
        },
        "/result/app/version": {
          "equals": "0.1.0"
        }
      }
    },
    {
      "id": "uninstall",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.uninstall",
          "args": {
            "app_id": "tetris"
          }
        },
        "status": 200
      },
      "expect": {
        "/result": {
          "equals": {}
        }
      }
    },
    {
      "id": "repeat_uninstall",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.uninstall",
          "args": {
            "app_id": "tetris"
          }
        },
        "status": 200
      },
      "expect": {
        "/result": {
          "equals": {}
        }
      }
    },
    {
      "id": "removed_catalog",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.list",
          "args": {}
        },
        "status": 200
      },
      "expect": {
        "/result/apps": {
          "equals": []
        }
      }
    },
    {
      "id": "removed_run",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.run",
          "args": {
            "app_id": "tetris"
          }
        },
        "status": 404
      },
      "expect": {
        "/error/code": {
          "equals": "LUA_APP_NOT_FOUND"
        }
      }
    },
    {
      "id": "invalid_id",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.uninstall",
          "args": {
            "app_id": "../tetris"
          }
        },
        "status": 400
      },
      "expect": {
        "/error/code": {
          "equals": "INVALID_REQUEST"
        }
      }
    },
    {
      "id": "reinstall",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.install",
          "args": {
            "url": "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib",
            "sha256": "370b1d1a471466d21c312cde40b0a9a962c7abbe5ea19320e00fac406b2b5728"
          }
        },
        "status": 200
      },
      "expect": {
        "/result/app/app_id": {
          "equals": "tetris"
        },
        "/result/app/version": {
          "equals": "0.1.0"
        }
      }
    },
    {
      "id": "reinstalled_catalog",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.list",
          "args": {}
        },
        "status": 200
      },
      "expect": {
        "/result/apps/0/app_id": {
          "equals": "tetris"
        }
      }
    },
    {
      "id": "provider_lua_app_list",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.list",
        "response": {
          "lua_apps": {
            "capacity_bytes": 4096,
            "packages": {
              "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib": ""
            }
          }
        },
        "expect_calls": 2
      },
      "expect": {
        "/calls": {
          "equals": 2
        }
      }
    },
    {
      "id": "provider_lua_app_install",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.install",
        "response": {
          "lua_apps": {
            "capacity_bytes": 4096,
            "packages": {
              "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib": ""
            }
          }
        },
        "expect_calls": 2
      },
      "expect": {
        "/calls": {
          "equals": 2
        }
      }
    },
    {
      "id": "provider_lua_app_run",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.run",
        "response": {
          "lua_apps": {
            "capacity_bytes": 4096,
            "packages": {
              "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib": ""
            }
          }
        },
        "expect_calls": 1
      },
      "expect": {
        "/calls": {
          "equals": 1
        }
      }
    },
    {
      "id": "provider_lua_app_uninstall",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.uninstall",
        "response": {
          "lua_apps": {
            "capacity_bytes": 4096,
            "packages": {
              "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib": ""
            }
          }
        },
        "expect_calls": 2
      },
      "expect": {
        "/calls": {
          "equals": 2
        }
      }
    }
  ],
  "finally": [
    {
      "id": "cleanup",
      "client": "peer",
      "rpc": {
        "method": "server.peer.delete",
        "request": {}
      }
    }
  ]
}
