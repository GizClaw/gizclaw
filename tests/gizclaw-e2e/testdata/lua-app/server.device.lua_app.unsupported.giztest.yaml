# User Story:
# As a device owner,
# I want to install and launch complete Lua applications through the real device RPC,
# So that package validation, capacity failures and launch parameters are observable.
{
  "version": "gizclaw.test/v1alpha1",
  "name": "server.device.lua_app.unsupported",
  "clients": {
    "peer": {
      "identity": "ephemeral",
      "connection": "webrtc",
      "access_point": "${endpoint}"
    }
  },
  "variables": {
    "endpoint": {
      "direction": "input",
      "type": "string",
      "env": "GIZCLAW_TEST_ENDPOINT"
    },
    "registration_token": {
      "direction": "input",
      "type": "string",
      "env": "GIZCLAW_TEST_REGISTRATION_TOKEN",
      "secret": true
    },
    "resource_name": {
      "direction": "input",
      "type": "string",
      "generate": "token"
    },
    "api_key": {
      "direction": "output",
      "type": "string",
      "secret": true
    }
  },
  "steps": [
    {
      "id": "register",
      "client": "peer",
      "rpc": {
        "method": "server.register",
        "request": {
          "token": "${registration_token}"
        }
      }
    },
    {
      "id": "key",
      "client": "peer",
      "rpc": {
        "method": "server.api_key.create",
        "request": {
          "display_name": "${resource_name}"
        }
      },
      "capture": {
        "api_key": "/api_key"
      }
    },
    {
      "id": "install",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.install",
          "args": {
            "url": "https://apps.example.test/tetris-0.1.0.lua-app.tar.zlib"
          }
        },
        "status": 501
      },
      "expect": {
        "/error/code": {
          "equals": "DEVICE_UNSUPPORTED"
        }
      }
    },
    {
      "id": "run",
      "client": "peer",
      "http": {
        "method": "POST",
        "path": "/gizclaw/v1/device/tool/v0/invoke",
        "headers": {
          "Authorization": "Bearer ${api_key}"
        },
        "body": {
          "tool": "lua.app.run",
          "args": {
            "app_id": "tetris"
          }
        },
        "status": 501
      },
      "expect": {
        "/error/code": {
          "equals": "DEVICE_UNSUPPORTED"
        }
      }
    },
    {
      "id": "provider_lua_app_install",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.install",
        "response": {
          "unavailable": true
        },
        "expect_calls": 1
      },
      "expect": {
        "/calls": {
          "equals": 1
        }
      }
    },
    {
      "id": "provider_lua_app_run",
      "client": "peer",
      "client_rpc": {
        "method": "client.tool.v0.invoke",
        "tool": "lua.app.run",
        "response": {
          "unavailable": true
        },
        "expect_calls": 1
      },
      "expect": {
        "/calls": {
          "equals": 1
        }
      }
    }
  ],
  "finally": [
    {
      "id": "cleanup",
      "client": "peer",
      "rpc": {
        "method": "server.peer.delete",
        "request": {}
      }
    }
  ]
}
