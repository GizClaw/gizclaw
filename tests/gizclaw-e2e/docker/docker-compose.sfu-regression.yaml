services:
  postgres:
    image: gizcr.gizclaw.com/docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${GIZCLAW_E2E_SFU_PG_PASSWORD:?generated by the local SFU runner}
    command: [postgres, -c, max_connections=300]
    volumes:
      - ./init-sfu-postgres.sh:/docker-entrypoint-initdb.d/sfu.sh:ro
    healthcheck:
      # Initialization briefly runs a Unix-socket-only PostgreSQL. Wait for
      # the final TCP listener before allowing either Server to open its DB.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres]
      interval: 1s
      timeout: 2s
      retries: 60
  server-a:
    environment:
      GIZCLAW_E2E_POSTGRES_DSN: postgres://sfu_test:${GIZCLAW_E2E_SFU_PG_PASSWORD}@postgres:5432/server_a?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  server-b:
    environment:
      GIZCLAW_E2E_POSTGRES_DSN: postgres://sfu_test:${GIZCLAW_E2E_SFU_PG_PASSWORD}@postgres:5432/server_b?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
