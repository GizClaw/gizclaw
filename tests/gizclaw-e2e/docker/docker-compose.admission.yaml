# Admission uses only Server and Edge. Keep this file independent of the
# provider stack: Compose interpolates required variables even for unused services.
x-build: &build
  context: ../../..
  dockerfile: tests/gizclaw-e2e/docker/Dockerfile.server
  args:
    BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    PREBUILD_CLI: "1"

services:
  server:
    build: *build
    environment:
      GIZCLAW_E2E_ADMISSION_ONLY: "1"
      GIZCLAW_E2E_PEER_ADMISSION: registration-token
      GIZCLAW_E2E_CONFIG_HOME: /src/tests/gizclaw-e2e/testdata/cmd-config-home
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:-127.0.0.1:9820}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-e2e-server-http-ready && curl -fsS http://127.0.0.1:9820/server-info >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 300s
    ports:
      - "${GIZCLAW_E2E_DOCKER_ADMIN_BIND:-127.0.0.1}:${GIZCLAW_E2E_DOCKER_ADMIN_PORT:-9820}:9820/tcp"

  edge: &edge
    build: *build
    entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-edge.sh"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:-127.0.0.1:9820}
      GIZCLAW_E2E_EDGE_ENDPOINT: ${GIZCLAW_E2E_EDGE_ENDPOINT:-127.0.0.1:9821}
      GIZCLAW_E2E_EDGE_UPSTREAM_ENDPOINT: http://server:9820
    ports:
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE_PORT:-9821}:9821/tcp"
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE_PORT:-9821}:9821/udp"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-e2e-edge-ready && curl -fsS http://127.0.0.1:9821/server-info >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 300s

  edge2:
    <<: *edge
    environment:
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:-127.0.0.1:9820}
      GIZCLAW_E2E_EDGE_ENDPOINT: ${GIZCLAW_E2E_EDGE2_ENDPOINT:-127.0.0.1:9822}
      GIZCLAW_E2E_EDGE_PRIVATE_KEY: BHu9b5qgfhTtpzKKLCjRWPerv6rtvDowad4AftyFTY6o
      GIZCLAW_E2E_EDGE_UPSTREAM_ENDPOINT: http://server:9820
    ports:
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE2_PORT:-9822}:9821/tcp"
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE2_PORT:-9822}:9821/udp"
