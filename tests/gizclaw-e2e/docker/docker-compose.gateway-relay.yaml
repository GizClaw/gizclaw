x-coturn: &coturn
  image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
  entrypoint: ["/usr/local/bin/gizclaw-coturn-entrypoint"]
  environment: &coturn-environment
    GIZCLAW_COTURN_AUTH_MODE: static
    GIZCLAW_COTURN_REALM: ${GIZCLAW_E2E_GATEWAY_RELAY_REALM:?set by docker-compose-up.sh}
    GIZCLAW_COTURN_USERNAME: ${GIZCLAW_E2E_GATEWAY_RELAY_USERNAME:?set by docker-compose-up.sh}
    GIZCLAW_COTURN_CREDENTIAL: ${GIZCLAW_E2E_GATEWAY_RELAY_CREDENTIAL:?set by docker-compose-up.sh}
    GIZCLAW_COTURN_LISTEN_PORT: "3478"
    GIZCLAW_COTURN_RELAY_MIN_PORT: "49160"
    GIZCLAW_COTURN_RELAY_MAX_PORT: "49200"
    GIZCLAW_COTURN_METRICS_PORT: "9641"
  volumes:
    - type: bind
      source: ../../fixtures/coturn/entrypoint.sh
      target: /usr/local/bin/gizclaw-coturn-entrypoint
      read_only: true
      bind:
        create_host_path: false
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/gizclaw-coturn-ready && kill -0 $$(cat /tmp/gizclaw-coturn.pid)"]
    interval: 1s
    timeout: 1s
    retries: 60
    start_period: 30s

x-relay-edge: &relay-edge
  depends_on:
    coturn-a:
      condition: service_healthy
    coturn-b:
      condition: service_healthy
  environment: &relay-edge-environment
    GIZCLAW_E2E_GATEWAY_RELAY: ${GIZCLAW_E2E_GATEWAY_RELAY_MODE:-1}
    GIZCLAW_E2E_GATEWAY_RELAY_RECOVERY: ${GIZCLAW_E2E_GATEWAY_RELAY_RECOVERY:-}
    GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_RELAY_REALM: ${GIZCLAW_E2E_GATEWAY_RELAY_REALM:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_RELAY_USERNAME: ${GIZCLAW_E2E_GATEWAY_RELAY_USERNAME:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_RELAY_CREDENTIAL: ${GIZCLAW_E2E_GATEWAY_RELAY_CREDENTIAL:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_MAX_SESSIONS: ${GIZCLAW_E2E_GATEWAY_MAX_SESSIONS:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_MAX_UPSTREAMS: ${GIZCLAW_E2E_GATEWAY_MAX_UPSTREAMS:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_SESSIONS_PER_UPSTREAM: ${GIZCLAW_E2E_GATEWAY_SESSIONS_PER_UPSTREAM:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_STREAMS_PER_UPSTREAM: ${GIZCLAW_E2E_GATEWAY_STREAMS_PER_UPSTREAM:?set by docker-compose-up.sh}
    GIZCLAW_E2E_GATEWAY_MAX_PENDING_HANDSHAKES: ${GIZCLAW_E2E_GATEWAY_MAX_PENDING_HANDSHAKES:?set by docker-compose-up.sh}
  volumes:
    - type: bind
      source: ${GIZCLAW_E2E_GATEWAY_RELAY_ENV_FILE:?set by docker-compose-up.sh}
      target: /src/tests/gizclaw-e2e/.env
      read_only: true
      bind:
        create_host_path: false

services:
  server:
    environment:
      GIZCLAW_E2E_SINGLE_EDGE: ${GIZCLAW_E2E_SINGLE_EDGE:-}
      GIZCLAW_E2E_CAPACITY_ONLY: "1"
      GIZCLAW_E2E_GATEWAY_RELAY: ${GIZCLAW_E2E_GATEWAY_RELAY_MODE:-1}
      GIZCLAW_E2E_GATEWAY_RELAY_RECOVERY: ${GIZCLAW_E2E_GATEWAY_RELAY_RECOVERY:-}
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP:?set by docker-compose-up.sh}:9820
    networks:
      default:
        ipv4_address: ${GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP:?set by docker-compose-up.sh}
    volumes:
      - type: bind
        source: ${GIZCLAW_E2E_GATEWAY_RELAY_ENV_FILE:?set by docker-compose-up.sh}
        target: /src/tests/gizclaw-e2e/.env
        read_only: true
        bind:
          create_host_path: false

  edge:
    <<: *relay-edge
    networks:
      default:
        ipv4_address: ${GIZCLAW_E2E_GATEWAY_RELAY_EDGE_IP:?set by docker-compose-up.sh}
    volumes:
      - type: bind
        source: ${GIZCLAW_E2E_GATEWAY_RELAY_ENV_FILE:?set by docker-compose-up.sh}
        target: /src/tests/gizclaw-e2e/.env
        read_only: true
        bind:
          create_host_path: false
      - gateway-relay-fault:/run/gizclaw-gateway-fault

  edge2:
    <<: *relay-edge
    environment:
      <<: *relay-edge-environment
      GIZCLAW_E2E_EDGE_PRIVATE_KEY: BHu9b5qgfhTtpzKKLCjRWPerv6rtvDowad4AftyFTY6o
    networks:
      default:
        ipv4_address: ${GIZCLAW_E2E_GATEWAY_RELAY_EDGE2_IP:?set by docker-compose-up.sh}

  coturn-a:
    <<: *coturn
    environment:
      <<: *coturn-environment
      GIZCLAW_COTURN_PRIVATE_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_PUBLIC_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP:?set by docker-compose-up.sh}
    networks:
      default:
        ipv4_address: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP:?set by docker-compose-up.sh}

  coturn-b:
    <<: *coturn
    environment:
      <<: *coturn-environment
      GIZCLAW_COTURN_PRIVATE_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_PUBLIC_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP:?set by docker-compose-up.sh}
    networks:
      default:
        ipv4_address: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP:?set by docker-compose-up.sh}

  gateway-fault:
    image: nicolaka/netshoot:v0.13@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: service:edge
    cap_add:
      - NET_ADMIN
    depends_on:
      edge:
        condition: service_started
    environment:
      GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP:?set by docker-compose-up.sh}
      GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_A_IP:?set by docker-compose-up.sh}
      GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP: ${GIZCLAW_E2E_GATEWAY_RELAY_TURN_B_IP:?set by docker-compose-up.sh}
    volumes:
      - gateway-relay-fault:/run/gizclaw-gateway-fault
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        iptables -I OUTPUT 1 -p udp -d "$${GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP}" -j REJECT
        iptables -I INPUT 1 -p udp -s "$${GIZCLAW_E2E_GATEWAY_RELAY_SERVER_IP}" -j REJECT
        touch /run/gizclaw-gateway-fault/ready
        trap 'rm -f /run/gizclaw-gateway-fault/ready' EXIT
        while :; do sleep 3600; done

networks:
  default:
    ipam:
      config:
        - subnet: ${GIZCLAW_E2E_GATEWAY_RELAY_SUBNET:?set by docker-compose-up.sh}

volumes:
  gateway-relay-fault:
