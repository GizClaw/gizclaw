x-postgres: &postgres
  image: ${RECOVERY_POSTGRES_IMAGE:?built by runner}
  environment:
    POSTGRES_USER: recovery
    POSTGRES_PASSWORD: ${RECOVERY_PG_PASSWORD:?generated by runner}
    POSTGRES_DB: recovery
  # The databases live only for this run; bound storage and avoid host-volume
  # initialization stalls while keeping both regional clusters independent.
  tmpfs:
    - /var/lib/postgresql/data:size=512m,mode=0700
  command: [postgres, -c, max_connections=100]
  healthcheck:
    test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U recovery -d recovery]
    interval: 1s
    timeout: 2s
    retries: 60
x-server: &server
  image: ${RECOVERY_BASE_IMAGE:?built by runner}
  user: "${RECOVERY_UID:?set by runner}:${RECOVERY_GID:?set by runner}"
  entrypoint: [/binaries/gizclaw, serve, --force, /state]
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:9820/server-info]
    interval: 1s
    timeout: 2s
    retries: 90
services:
  redis:
    image: gizcr.gizclaw.com/docker.io/library/redis:8.4.6-alpine@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 60
  replica:
    image: gizcr.gizclaw.com/docker.io/library/redis:8.4.6-alpine@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: [redis-server, --save, "", --appendonly, "no", --replicaof, redis, "6379"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "redis-cli info replication | grep -q 'master_link_status:up'"]
      interval: 1s
      timeout: 1s
      retries: 60
  pg-a:
    <<: *postgres
  pg-b:
    <<: *postgres
  server-a:
    <<: *server
    volumes:
      - ${RECOVERY_ROOT}/bin:/binaries:ro
      - ${RECOVERY_ROOT}/server-a:/state
  server-b:
    <<: *server
    volumes:
      - ${RECOVERY_ROOT}/bin:/binaries:ro
      - ${RECOVERY_ROOT}/server-b:/state
  tests:
    image: ${RECOVERY_BASE_IMAGE}
    user: "${RECOVERY_UID:?set by runner}:${RECOVERY_GID:?set by runner}"
    entrypoint: [/binaries/recovery.test, -test.v, -test.timeout=3m]
    volumes:
      - ${RECOVERY_ROOT}/bin:/binaries:ro
      - ${RECOVERY_ROOT}:/evidence
    environment:
      RECOVERY_PG_A: postgres://recovery:${RECOVERY_PG_PASSWORD}@pg-a:5432/recovery?sslmode=disable
      RECOVERY_PG_B: postgres://recovery:${RECOVERY_PG_PASSWORD}@pg-b:5432/recovery?sslmode=disable
      RECOVERY_ADMIN_A: BHUtU547UzMM5ZBvGCEEgiFcCND4hpMvRcfTSHVayiDr
      RECOVERY_ADMIN_B: BJ4LoLyU7mbs1e56jahtyJEJHyh3DEWHXsBZr98SyQyf
