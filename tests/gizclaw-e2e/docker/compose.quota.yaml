services:
  fixture:
    image: ${GIZCLAW_QUOTA_IMAGE:?}
    env_file: ["${GIZCLAW_QUOTA_STATE:?}/runtime.env"]
    entrypoint: [quota-fixture]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9825/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
  server:
    image: ${GIZCLAW_QUOTA_IMAGE}
    env_file: ["${GIZCLAW_QUOTA_STATE}/runtime.env"]
    entrypoint: [gizclaw, serve, --force, /workspace]
    volumes: ["${GIZCLAW_QUOTA_STATE}/server:/workspace"]
    depends_on:
      fixture: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9820/server-info"]
      interval: 1s
      timeout: 2s
      retries: 60
  edge:
    image: ${GIZCLAW_QUOTA_IMAGE}
    env_file: ["${GIZCLAW_QUOTA_STATE}/runtime.env"]
    entrypoint: [gizclaw, edge, serve, /workspace]
    volumes: ["${GIZCLAW_QUOTA_STATE}/edge:/workspace"]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9821/server-info"]
      interval: 1s
      timeout: 2s
      retries: 60
  seed:
    image: ${GIZCLAW_QUOTA_IMAGE}
    env_file: ["${GIZCLAW_QUOTA_STATE}/runtime.env"]
    entrypoint: [quota-fixture, -seed]
    depends_on:
      server: {condition: service_healthy}
  test:
    image: ${GIZCLAW_QUOTA_IMAGE}
    environment:
      GIZCLAW_TEST_ENDPOINT: edge:9821
      GIZCLAW_QUOTA_FIXTURE: http://fixture:9825
    entrypoint: [gizclaw, test, run]
    command: ["/src/tests/gizclaw-e2e/giztest/quota", --output, /reports/giztest.json]
    volumes: ["${GIZCLAW_QUOTA_REPORTS:?}:/reports"]
    depends_on:
      server: {condition: service_healthy}
