services:
  mem0:
    profiles: ["memory"]
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.mem0
    volumes:
      - type: bind
        source: ../.env
        target: /run/gizclaw-e2e.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).read()"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 30s

  turn:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    entrypoint: ["/usr/local/bin/gizclaw-coturn-entrypoint"]
    environment:
      GIZCLAW_COTURN_AUTH_MODE: rest
      GIZCLAW_COTURN_REALM: ${GIZCLAW_E2E_TURN_REALM:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_USERNAME: ${GIZCLAW_E2E_TURN_USERNAME:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_CREDENTIAL: ${GIZCLAW_E2E_TURN_CREDENTIAL:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_LISTEN_PORT: "9823"
      GIZCLAW_COTURN_RELAY_MIN_PORT: ${GIZCLAW_E2E_TURN_RELAY_MIN_PORT:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_RELAY_MAX_PORT: ${GIZCLAW_E2E_TURN_RELAY_MAX_PORT:?set by docker-compose-up.sh}
      GIZCLAW_COTURN_METRICS_PORT: "9641"
      GIZCLAW_COTURN_PUBLIC_IP: ${GIZCLAW_E2E_TURN_RELAY_ADDRESS:?set by docker-compose-up.sh}
    volumes:
      - type: bind
        source: ../../fixtures/coturn/entrypoint.sh
        target: /usr/local/bin/gizclaw-coturn-entrypoint
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-coturn-ready && kill -0 $$(cat /tmp/gizclaw-coturn.pid)"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 30s
    ports:
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_TURN_PORT:?set by docker-compose-up.sh}:9823/udp"
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_TURN_RELAY_MIN_PORT:?set by docker-compose-up.sh}-${GIZCLAW_E2E_TURN_RELAY_MAX_PORT:?set by docker-compose-up.sh}:${GIZCLAW_E2E_TURN_RELAY_MIN_PORT:?set by docker-compose-up.sh}-${GIZCLAW_E2E_TURN_RELAY_MAX_PORT:?set by docker-compose-up.sh}/udp"

  server:
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.server
      args:
        BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    environment:
      GIZCLAW_E2E_CONFIG_HOME: /src/tests/gizclaw-e2e/testdata/cmd-config-home
      GIZCLAW_E2E_CAPACITY_ONLY: ${GIZCLAW_E2E_CAPACITY_ONLY:-}
      GIZCLAW_E2E_RESOURCE_PATHS: ${GIZCLAW_E2E_RESOURCE_PATHS:-}
      GIZCLAW_E2E_SYNC_VOLC_TENANT_ID: ${GIZCLAW_E2E_SYNC_VOLC_TENANT_ID-volc-main}
      GIZCLAW_E2E_PRESERVE_DATA_ON_RESTART: ${GIZCLAW_E2E_PRESERVE_DATA_ON_RESTART:-}
      GIZCLAW_E2E_PERSISTENT_KV: ${GIZCLAW_E2E_PERSISTENT_KV:-}
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_TURN_ENDPOINT: ${GIZCLAW_E2E_TURN_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_TURN_REALM: ${GIZCLAW_E2E_TURN_REALM:?set by docker-compose-up.sh}
      GIZCLAW_E2E_TURN_USERNAME: ${GIZCLAW_E2E_TURN_USERNAME:?set by docker-compose-up.sh}
      GIZCLAW_E2E_TURN_CREDENTIAL: ${GIZCLAW_E2E_TURN_CREDENTIAL:?set by docker-compose-up.sh}
    depends_on:
      mem0:
        condition: service_healthy
        required: false
      turn:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../.env
        target: /src/tests/gizclaw-e2e/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-e2e-server-http-ready && curl -fsS http://127.0.0.1:9820/server-info >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 300s
    ports:
      - "${GIZCLAW_E2E_DOCKER_ADMIN_BIND:-127.0.0.1}:${GIZCLAW_E2E_DOCKER_ADMIN_PORT:?set by docker-compose-up.sh}:9820/tcp"

  edge:
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.server
      args:
        BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-edge.sh"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_EDGE_ENDPOINT: ${GIZCLAW_E2E_EDGE_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_EDGE_UPSTREAM_ENDPOINT: http://server:9820
    ports:
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE_PORT:?set by docker-compose-up.sh}:9821/tcp"
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE_PORT:?set by docker-compose-up.sh}:9821/udp"
    volumes:
      - type: bind
        source: ../.env
        target: /src/tests/gizclaw-e2e/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-e2e-edge-ready && curl -fsS http://127.0.0.1:9821/server-info >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 300s

  edge2:
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.server
      args:
        BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-edge.sh"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_SERVER_ENDPOINT: ${GIZCLAW_E2E_SERVER_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_EDGE_ENDPOINT: ${GIZCLAW_E2E_EDGE2_ENDPOINT:?set by docker-compose-up.sh}
      GIZCLAW_E2E_EDGE_PRIVATE_KEY: BHu9b5qgfhTtpzKKLCjRWPerv6rtvDowad4AftyFTY6o
      GIZCLAW_E2E_EDGE_UPSTREAM_ENDPOINT: http://server:9820
    ports:
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE2_PORT:?set by docker-compose-up.sh}:9821/tcp"
      - "${GIZCLAW_E2E_DOCKER_SERVER_BIND:-0.0.0.0}:${GIZCLAW_E2E_DOCKER_EDGE2_PORT:?set by docker-compose-up.sh}:9821/udp"
    volumes:
      - type: bind
        source: ../.env
        target: /src/tests/gizclaw-e2e/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/gizclaw-e2e-edge-ready && curl -fsS http://127.0.0.1:9821/server-info >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 300s

  desktop:
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.desktop
      args:
        BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    depends_on:
      edge:
        condition: service_healthy
      edge2:
        condition: service_healthy
    ports:
      - "${GIZCLAW_E2E_DOCKER_DESKTOP_BIND:-0.0.0.0}::4191/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4191/ >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 5s
