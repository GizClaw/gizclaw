x-server-health: &server-health
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9820/server-info"]
  interval: 2s
  timeout: 2s
  retries: 90
  start_period: 10s

x-edge-health: &edge-health
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9821/server-info"]
  interval: 2s
  timeout: 2s
  retries: 90
  start_period: 10s

x-build: &build
  context: ../../..
  dockerfile: tests/gizclaw-e2e/docker/Dockerfile.multi-server
  args:
    BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}

x-server: &server
  build: *build
  entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-multi-server.sh"]
  depends_on:
    redis:
      condition: service_healthy
    livekit:
      condition: service_healthy
  environment: &server-environment
    GIZCLAW_E2E_REDIS_DSN: redis://redis:6379/0
    GIZCLAW_E2E_LIVEKIT_URL: ws://livekit:7880
    GIZCLAW_E2E_LIVEKIT_HTTP_URL: http://livekit:7880
    GIZCLAW_E2E_LIVEKIT_API_KEY: ${GIZCLAW_E2E_LIVEKIT_API_KEY:?generated by run_multi_server_tests.sh}
    GIZCLAW_E2E_LIVEKIT_API_SECRET: ${GIZCLAW_E2E_LIVEKIT_API_SECRET:?generated by run_multi_server_tests.sh}

x-edge: &edge
  build: *build
  entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-multi-edge.sh"]
  depends_on:
    server-a:
      condition: service_healthy
    server-b:
      condition: service_healthy

# Provider credentials are optional. They only reach the seed runner, which
# adds the ASR model and TTS voice aliases when every value is present; the
# GizClaw Servers never read them from the environment.
x-provider-environment: &provider-environment
  GIZCLAW_E2E_DOUBAO_APP_ID: ${GIZCLAW_E2E_DOUBAO_APP_ID:-}
  GIZCLAW_E2E_DOUBAO_API_KEY: ${GIZCLAW_E2E_DOUBAO_API_KEY:-}
  GIZCLAW_E2E_DOUBAO_SEARCH_API_KEY: ${GIZCLAW_E2E_DOUBAO_SEARCH_API_KEY:-}
  GIZCLAW_E2E_VOLC_ARK_API_KEY: ${GIZCLAW_E2E_VOLC_ARK_API_KEY:-}
  GIZCLAW_E2E_VOLC_OPENAPI_ACCESS_KEY_ID: ${GIZCLAW_E2E_VOLC_OPENAPI_ACCESS_KEY_ID:-}
  GIZCLAW_E2E_VOLC_OPENAPI_ACCESS_KEY: ${GIZCLAW_E2E_VOLC_OPENAPI_ACCESS_KEY:-}

services:
  redis:
    image: redis:8.4.6-alpine@sha256:12da49daa000c2be4d55118574f889c8cc298140ecf343d04f345c818f227823
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 60

  # Single-node livekit-server. The advertised media address is the container
  # address on the project network, resolved at start because Compose only
  # assigns it at runtime; nothing is published to the host. API credentials
  # are generated per `compose up` by run_multi_server_tests.sh.
  livekit:
    image: livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node_ip="$$(hostname -i)"
        node_ip="$${node_ip%% *}"
        exec /livekit-server --config-body "$$LIVEKIT_CONFIG" --node-ip "$$node_ip"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
        keys:
          ${GIZCLAW_E2E_LIVEKIT_API_KEY:?generated by run_multi_server_tests.sh}: ${GIZCLAW_E2E_LIVEKIT_API_SECRET:?generated by run_multi_server_tests.sh}
        room:
          empty_timeout: 300
          departure_timeout: 20
        logging:
          level: info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 1s
      timeout: 2s
      retries: 60

  server-a:
    <<: *server
    environment:
      <<: *server-environment
      GIZCLAW_E2E_SERVER_PRIVATE_KEY: 287thuEga1hbBYjM7sxrY3eMoPAqpB3nJ81S8CEuNHKu
      GIZCLAW_E2E_SERVER_ENDPOINT: server-a:9820
      # Peer ownership is claimed by the first Server a key connects to, so
      # each Server has its own admin identity.
      GIZCLAW_E2E_ADMIN_PUBLIC_KEY: CdSRDESnon72PG3Cobd3G518f6NCNkA62nQ5kBrNCyz2
    volumes:
      - server-a-state:/var/lib/gizclaw
    healthcheck: *server-health

  server-b:
    <<: *server
    environment:
      <<: *server-environment
      GIZCLAW_E2E_SERVER_PRIVATE_KEY: Get8yS32Es6muYoEbUgCQt15wF1Hcyc5sLRn7egBKCD1
      GIZCLAW_E2E_SERVER_ENDPOINT: server-b:9820
      GIZCLAW_E2E_ADMIN_PUBLIC_KEY: 9sie57gGyik7yWDwWQMCYPGyCLDr9FX7MvJkkZjtriJD
    volumes:
      - server-b-state:/var/lib/gizclaw
    healthcheck: *server-health

  edge-a:
    <<: *edge
    environment:
      GIZCLAW_E2E_EDGE_PRIVATE_KEY: 65kcbmbz2Eo2SgSA2Q3QqBoLhyLvYyMuZ7gfTSKaTvpR
      GIZCLAW_E2E_EDGE_ENDPOINT: edge-a:9821
      GIZCLAW_E2E_UPSTREAM_A_ENDPOINT: http://server-a:9820
      GIZCLAW_E2E_UPSTREAM_A_PUBLIC_KEY: BoYfN5LcjihD8j7HmzDW56s3E9F2R1AX8JsucW5Zvd7T
      GIZCLAW_E2E_UPSTREAM_B_ENDPOINT: http://server-b:9820
      GIZCLAW_E2E_UPSTREAM_B_PUBLIC_KEY: 6Ww6ANsXDCf91Yp7Tvi65hqpywjMmXqAoZDiq33kfCee
    healthcheck: *edge-health

  edge-b:
    <<: *edge
    environment:
      GIZCLAW_E2E_EDGE_PRIVATE_KEY: BHu9b5qgfhTtpzKKLCjRWPerv6rtvDowad4AftyFTY6o
      GIZCLAW_E2E_EDGE_ENDPOINT: edge-b:9821
      GIZCLAW_E2E_UPSTREAM_A_ENDPOINT: http://server-b:9820
      GIZCLAW_E2E_UPSTREAM_A_PUBLIC_KEY: 6Ww6ANsXDCf91Yp7Tvi65hqpywjMmXqAoZDiq33kfCee
      GIZCLAW_E2E_UPSTREAM_B_ENDPOINT: http://server-a:9820
      GIZCLAW_E2E_UPSTREAM_B_PUBLIC_KEY: BoYfN5LcjihD8j7HmzDW56s3E9F2R1AX8JsucW5Zvd7T
    healthcheck: *edge-health

  # Seeds one Server's local catalog (Pet Workflow, RuntimeProfile,
  # RegistrationToken) through the Admin API. Invoked once per Server by
  # run_multi_server_tests.sh with `docker compose run --rm seed <flags>`.
  seed:
    build: *build
    entrypoint: ["/usr/local/bin/multiserver-seed"]
    environment:
      <<: *provider-environment
      GIZCLAW_E2E_ADMIN_PRIVATE_KEY_A: BHUtU547UzMM5ZBvGCEEgiFcCND4hpMvRcfTSHVayiDr
      GIZCLAW_E2E_ADMIN_PRIVATE_KEY_B: BJ4LoLyU7mbs1e56jahtyJEJHyh3DEWHXsBZr98SyQyf
    depends_on:
      edge-a:
        condition: service_healthy
      edge-b:
        condition: service_healthy

  tests:
    build: *build
    entrypoint: ["/usr/local/bin/multiserver-e2e", "-test.v"]
    environment:
      GIZCLAW_E2E_SERVER_A: server-a:9820
      GIZCLAW_E2E_SERVER_B: server-b:9820
      GIZCLAW_E2E_EDGE_A: edge-a:9821
      GIZCLAW_E2E_EDGE_B: edge-b:9821
      GIZCLAW_E2E_REDIS_DSN: redis://redis:6379/0
      GIZCLAW_E2E_SERVER_A_STATE: /server-a-state/data/gameplay.sqlite
      GIZCLAW_E2E_SERVER_B_STATE: /server-b-state/data/gameplay.sqlite
      GIZCLAW_E2E_ADMIN_PRIVATE_KEY_A: BHUtU547UzMM5ZBvGCEEgiFcCND4hpMvRcfTSHVayiDr
      GIZCLAW_E2E_ADMIN_PRIVATE_KEY_B: BJ4LoLyU7mbs1e56jahtyJEJHyh3DEWHXsBZr98SyQyf
      GIZCLAW_E2E_LIVEKIT_URL: http://livekit:7880
      GIZCLAW_E2E_LIVEKIT_API_KEY: ${GIZCLAW_E2E_LIVEKIT_API_KEY:?generated by run_multi_server_tests.sh}
      GIZCLAW_E2E_LIVEKIT_API_SECRET: ${GIZCLAW_E2E_LIVEKIT_API_SECRET:?generated by run_multi_server_tests.sh}
      GIZCLAW_TEST_REGISTRATION_TOKEN_A: ${GIZCLAW_TEST_REGISTRATION_TOKEN_A:-}
      GIZCLAW_TEST_REGISTRATION_TOKEN_B: ${GIZCLAW_TEST_REGISTRATION_TOKEN_B:-}
    volumes:
      - server-a-state:/server-a-state:ro
      - server-b-state:/server-b-state:ro
    depends_on:
      edge-a:
        condition: service_healthy
      edge-b:
        condition: service_healthy

  # Runs `gizclaw test run` against both Edges. Scenario files are passed as
  # the command; the JSON report lands in the bind-mounted, git-ignored
  # tests/gizclaw-e2e/testdata/multi-server directory.
  giztest:
    build: *build
    entrypoint: ["/src/tests/gizclaw-e2e/docker/entrypoint-multi-giztest.sh"]
    environment:
      GIZCLAW_TEST_EDGE_A: edge-a:9821
      GIZCLAW_TEST_EDGE_B: edge-b:9821
      GIZCLAW_TEST_REGISTRATION_TOKEN_A: ${GIZCLAW_TEST_REGISTRATION_TOKEN_A:-}
      GIZCLAW_TEST_REGISTRATION_TOKEN_B: ${GIZCLAW_TEST_REGISTRATION_TOKEN_B:-}
      GIZCLAW_E2E_SFU_PROVIDER: ${GIZCLAW_E2E_SFU_PROVIDER:-0}
      GIZCLAW_E2E_GIZTEST_REPORT: /reports/${GIZCLAW_E2E_GIZTEST_REPORT_NAME:-sfu-report.json}
      GIZCLAW_E2E_GIZTEST_EVIDENCE: ${GIZCLAW_E2E_GIZTEST_EVIDENCE:-redacted}
    volumes:
      - ../testdata/multi-server:/reports
    depends_on:
      edge-a:
        condition: service_healthy
      edge-b:
        condition: service_healthy

volumes:
  server-a-state:
  server-b-state:
