services:
  metrics-sink:
    build:
      context: ../../..
      dockerfile: tests/gizclaw-e2e/docker/Dockerfile.server
      args:
        BASE_IMAGE: ${GIZCLAW_E2E_DOCKER_BASE_IMAGE:-gizclaw-go:linux-amd64-cn-base}
    entrypoint:
      - go
      - run
      - ./tests/gizclaw-e2e/cmd/metrics-sink
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/health >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 120
      start_period: 60s

  server:
    depends_on:
      metrics-sink:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_OBSERVABILITY: "1"
      GIZCLAW_E2E_METRICS_REMOTE_WRITE_URL: http://metrics-sink:9090/api/v1/write
      GIZCLAW_E2E_METRICS_QUERY_URL: http://metrics-sink:9090

  edge:
    depends_on:
      metrics-sink:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_OBSERVABILITY: "1"
      GIZCLAW_E2E_METRICS_REMOTE_WRITE_URL: http://metrics-sink:9090/api/v1/write
      GIZCLAW_E2E_METRICS_QUERY_URL: http://metrics-sink:9090

  edge2:
    depends_on:
      metrics-sink:
        condition: service_healthy
    environment:
      GIZCLAW_E2E_OBSERVABILITY: "1"
      GIZCLAW_E2E_METRICS_REMOTE_WRITE_URL: http://metrics-sink:9090/api/v1/write
      GIZCLAW_E2E_METRICS_QUERY_URL: http://metrics-sink:9090
