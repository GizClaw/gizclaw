name: giztest
description: Runs GizClaw scenario documents with the Flutter device SDK and the Dart control SDK.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.6.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_webrtc:
    git:
      url: https://github.com/GizClaw/flutter-webrtc.git
      ref: 15a7c37726c355a05a8392061b263a699fb9e242
  gizclaw:
    path: ../../../../sdk/flutter/gizclaw
  gizclaw_control:
    path: ../../../../sdk/flutter/gizclaw_control
  http: ^1.2.0
  protobuf: ^6.0.0
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
