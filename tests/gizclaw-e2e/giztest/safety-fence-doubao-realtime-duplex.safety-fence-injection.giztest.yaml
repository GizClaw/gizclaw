# User Story:
# As a raid author who places the Workspace safety fence in a Doubao realtime duplex Workflow,
# I want the RuntimeProfile fence selected by safety_fence_level to reach the model through the ${input.safety_fence} placeholder in its instructions,
# So that a device switching the level on reload changes what the agent is told.
#
# The e2e-giztest RuntimeProfile defines safety_fences.general as an instruction
# to open every reply with a fixed marker; the marker in the reply proves the
# fence text was injected.
version: gizclaw.test/v1alpha1
name: safety-fence-doubao-realtime-duplex.safety-fence-injection
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: safety-fence-doubao-realtime-duplex
        parameters:
          doubao_realtime_duplex_workspace_parameters:
            agent_type: DOUBAO_REALTIME_DUPLEX_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME_DUPLEX
  - id: reload_with_general_fence
    client: peer
    rpc:
      method: server.run.workspace.reload-with-options
      request:
        workspace_name: ${workspace_name}
        parameters:
          safety_fence_level: SAFETY_FENCE_LEVEL_GENERAL
    expect:
      /workspace_name:
        equals: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 你好，请用一句话介绍一下你自己。
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: fenced_reply
    client: peer
    timeout: 90s
    peer_stream:
      mode: realtime
      input: ${input_audio}
      pacing: 20ms
      require_text: true
    expect:
      /text:
        contains: 安全模式已开启
        normalize: [case, punctuation, whitespace]
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
