# User Story:
# As a Peer API consumer,
# I want Workspace toolkit selections to survive RPC and control execution,
# So that inheritance, explicit restrictions, and unavailable tools remain distinct.
version: gizclaw.test/v1alpha1
name: client.tool.workspace.subset
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
steps:
- id: register
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${workspace_name}"
      collection: assistants
      workflow_name: flowcraft-chat-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
      toolkit:
        tool_names:
          value:
          - giztest_echo
  expect:
    "/toolkit/tool_names/value":
      equals:
      - giztest-echo
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${workspace_name}"
- id: selected_call
  client: peer
  peer_stream:
    mode: text
    input: Call giztest_echo exactly once with key current-peer if it is available.
      After a successful call reply only with the marker from its result. If the tool is not available or
      returns an error, reply only TOOL_UNAVAILABLE. Do not call any other tool.
  expect:
    "/text":
      contains: ECHO_OK
    "/text_eos":
      equals: true
- id: excluded_call
  client: peer
  peer_stream:
    mode: text
    input: Call giztest_other exactly once with key current-peer if it is available.
      After a successful call reply only with the marker from its result. If the tool is not available or
      returns an error, reply only TOOL_UNAVAILABLE. Do not call any other tool.
  # Assert exclusion through the exact device-call count, not model wording.
  expect:
    "/text_eos":
      equals: true
- id: selected_handler
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.invoke
    response:
      name: giztest_echo
      result:
        marker: ECHO_OK
    expect_calls: 1
  expect:
    "/calls":
      equals: 1
- id: excluded_handler_not_called
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.invoke
    response:
      name: giztest_other
      result:
        marker: OTHER_OK
    expect_calls: 1
  expect:
    "/calls":
      equals: 1
finally:
- id: stop
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace_name
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${workspace_name}"
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
