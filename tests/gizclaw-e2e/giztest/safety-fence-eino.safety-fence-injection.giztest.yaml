# User Story:
# As a raid author who places the Workspace safety fence in a Eino Workflow,
# I want the RuntimeProfile fence selected by safety_fence_level to reach the model through the input.safety_fence binding in a prompt node,
# So that a device switching the level on reload changes what the agent is told.
#
# The e2e-giztest RuntimeProfile defines safety_fences.general as an instruction
# to open every reply with a fixed marker; the marker in the reply proves the
# fence text was injected.
version: gizclaw.test/v1alpha1
name: safety-fence-eino.safety-fence-injection
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: safety-fence-eino
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: reload_with_general_fence
    client: peer
    rpc:
      method: server.run.workspace.reload-with-options
      request:
        workspace_name: ${workspace_name}
        parameters:
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
          safety_fence_level: SAFETY_FENCE_LEVEL_GENERAL
    expect:
      /workspace_name:
        equals: ${workspace_name}
  - id: fenced_reply
    client: peer
    timeout: 90s
    peer_stream:
      mode: text
      input: 你好，请用一句话介绍一下你自己。
      require_text: true
      require_audio: false
    expect:
      /text:
        contains: 安全模式已开启
        normalize: [case, punctuation, whitespace]
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
