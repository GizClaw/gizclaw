# User Story:
# As a raid author who binds Tools in a RuntimeProfile,
# I want a model to see only the Tools its Workflow lists, narrowed by the Workspace selection,
# So that binding a Tool never attaches it to Workflows that did not opt in.
#
# The e2e-giztest RuntimeProfile binds the declaration-only giztest_echo and
# giztest_other Tools. Each giztest-toolkit-probe-* Workflow asks the real model to
# list the Tools declared to it without invoking them, or to answer NO_TOOLS.
# The Tool names appear in no prompt, so a listed name proves its declaration.
version: gizclaw.test/v1alpha1
name: server.workspace.toolkit.exposure
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  omitted_name:
    direction: input
    type: string
    generate: token
  listed_name:
    direction: input
    type: string
    generate: token
  narrowed_name:
    direction: input
    type: string
    generate: token
  widened_name:
    direction: input
    type: string
    generate: token
  probe:
    direction: input
    type: string
    value: 列出本次请求中声明给你的全部工具名称。
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  # The Workflow omits spec.toolkit, so a Workspace selection cannot grant a Tool.
  - id: create_omitted
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${omitted_name}
        workflow_name: giztest-toolkit-probe-none
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
        toolkit:
          tool_names:
            value: [giztest-echo]
  - id: select_omitted
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${omitted_name}
  - id: activate_omitted
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
  - id: probe_omitted
    client: peer
    timeout: 90s
    peer_stream:
      mode: text
      input: ${probe}
      require_text: true
      require_audio: false
    expect:
      /text:
        contains: NO_TOOLS
        not_contains: [giztest_echo, giztest_other]
      /text_eos:
        equals: true
  # Both Tools are listed and the Workspace omits its policy, so both are exposed.
  - id: create_listed
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${listed_name}
        workflow_name: giztest-toolkit-probe-both
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_listed
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${listed_name}
  - id: activate_listed
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
  - id: probe_listed
    client: peer
    timeout: 90s
    peer_stream:
      mode: text
      input: ${probe}
      require_text: true
      require_audio: false
    expect:
      /text:
        contains_all: [giztest_echo, giztest_other]
        not_contains: NO_TOOLS
      /text_eos:
        equals: true
  # The Workspace narrows the Workflow list to one Tool.
  - id: create_narrowed
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${narrowed_name}
        workflow_name: giztest-toolkit-probe-both
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
        toolkit:
          tool_names:
            value: [giztest-other]
  - id: select_narrowed
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${narrowed_name}
  - id: activate_narrowed
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
  - id: probe_narrowed
    client: peer
    timeout: 90s
    peer_stream:
      mode: text
      input: ${probe}
      require_text: true
      require_audio: false
    expect:
      /text:
        contains: giztest_other
        not_contains: [giztest_echo, NO_TOOLS]
      /text_eos:
        equals: true
  # The Workspace selects both bound Tools, but the Workflow lists only echo.
  - id: create_widened
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${widened_name}
        workflow_name: giztest-toolkit-probe-echo
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
        toolkit:
          tool_names:
            value: [giztest-echo, giztest-other]
  - id: select_widened
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${widened_name}
  - id: activate_widened
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
  - id: probe_widened
    client: peer
    timeout: 90s
    peer_stream:
      mode: text
      input: ${probe}
      require_text: true
      require_audio: false
    expect:
      /text:
        contains: giztest_echo
        not_contains: [giztest_other, NO_TOOLS]
      /text_eos:
        equals: true
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${omitted_name}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${listed_name}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${narrowed_name}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${widened_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
