# User Story:
# As a device API caller,
# I want to replace, append and read a playlist, play index zero, set repeat and stop,
# So that the real server and device SDK contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.audioplayer.control
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: replace
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.playlist.set
        args:
          items:
            - &a1
              url: https://audio.example.test/a.mp3
              title: Track a
              source_ref: catalog:a
            - &a2
              url: https://audio.example.test/b.mp3
              title: Track b
              source_ref: catalog:b
      status: 200
    expect:
      /result/value/playlist_length:
        equals: 2
      /result/value/state:
        equals: stopped
  - id: append
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.playlist.append
        args:
          items:
            - &a3
              url: https://audio.example.test/c.mp3
              title: Track c
              source_ref: catalog:c
      status: 200
    expect:
      /result/value/playlist_length:
        equals: 3
      /result/value/playlist_revision:
        equals: 2
  - id: read_playlist
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      status: 200
      body:
        tool: audioplayer.playlist.get
        args: {}
    expect:
      /result/items/0/url:
        equals: https://audio.example.test/a.mp3
      /result/items/1/source_ref:
        equals: catalog:b
      /result/items/2/url:
        equals: https://audio.example.test/c.mp3
      /result/playlist_revision:
        equals: 2
  - id: play_zero
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.play
        args:
          index: 0
      status: 200
    expect:
      /result/value/state:
        equals: playing
      /result/value/current_index:
        equals: 0
  - id: repeat_one
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.mode.set
        args:
          repeat: one
      status: 200
    expect:
      /result/value/repeat:
        equals: one
  - id: stop
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.stop
        args: {}
      status: 200
    expect:
      /result/value/state:
        equals: stopped
  - id: stop_again
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: audioplayer.stop
        args: {}
      status: 200
    expect:
      /result/value/state:
        equals: stopped
      /result/value/playlist_length:
        equals: 3
  - id: get_player
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      status: 200
      body:
        tool: audioplayer.get
        args: {}
    expect:
      /result/value/state:
        equals: stopped
      /result/value/repeat:
        equals: one
  - id: read_snapshot
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /audioplayer/state:
        equals: stopped
      /audioplayer/repeat:
        equals: one
      /audioplayer/playlist_revision:
        equals: 2
  - id: rpc_snapshot
    client: peer
    rpc:
      method: server.status.get
      request: {}
    expect:
      /audioplayer/state:
        equals: stopped
      /audioplayer/playlist_length:
        equals: 3
  - id: provider_playlist_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: stopped
        repeat: off
        playlist_length: 2
        playlist_revision: 1
        position_ms: 0
      expect_calls: 1
      tool: audioplayer.playlist.set
  - id: provider_playlist_append
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: stopped
        repeat: off
        playlist_length: 3
        playlist_revision: 2
        position_ms: 0
      expect_calls: 1
      tool: audioplayer.playlist.append
  - id: provider_playlist_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        items:
          - *a1
          - *a2
          - *a3
        playlist_revision: 2
      expect_calls: 1
      tool: audioplayer.playlist.get
  - id: provider_play
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: playing
        repeat: off
        playlist_length: 3
        playlist_revision: 2
        position_ms: 0
        current_index: 0
      expect_calls: 1
      tool: audioplayer.play
  - id: provider_mode_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: playing
        repeat: one
        playlist_length: 3
        playlist_revision: 2
        position_ms: 0
        current_index: 0
      expect_calls: 1
      tool: audioplayer.mode.set
  - id: provider_stop
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: stopped
        repeat: one
        playlist_length: 3
        playlist_revision: 2
        position_ms: 0
        current_index: 0
      expect_calls: 2
      tool: audioplayer.stop
  - id: provider_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      response:
        state: stopped
        repeat: one
        playlist_length: 3
        playlist_revision: 2
        position_ms: 0
        current_index: 0
      expect_calls: 1
      tool: audioplayer.get
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
