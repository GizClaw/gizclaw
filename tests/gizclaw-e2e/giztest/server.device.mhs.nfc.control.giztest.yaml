# User Story:
# As a GizClaw device operator,
# I want to exercise server.device.mhs.nfc.control,
# So that the protocol is verified over real Server and SDK transports.
version: gizclaw.test/v1alpha1
name: server.device.mhs.nfc.control
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: read
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      body:
        id: nfc.left
        hwd: nfc
      status: 200
    expect: &a1
      /value/enabled:
        equals: false
      /value/card_present:
        equals: false
      /value/last_read/result:
        equals: failed
      /value/last_read/error_code:
        equals: READ_FAILED
      /value/last_read/read_at_unix_ms:
        equals: "1600000000000"
      /value/last_read/uid:
        equals: AAH/
      /value/last_read/raw_data:
        equals: AP8=
  - id: write
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/write
      headers:
        Authorization: Bearer ${api_key}
      body:
        id: nfc.left
        hwd: nfc
        value:
          enabled: true
      status: 200
    expect:
      /value/enabled:
        equals: false
      /value/last_read/result:
        equals: failed
  - id: cached_read
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      body:
        id: nfc.left
        hwd: nfc
      status: 200
    expect: *a1
  - id: invalid_write
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/write
      headers:
        Authorization: Bearer ${api_key}
      body:
        id: nfc.left
        hwd: nfc
        value: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_read
    client: peer
    client_rpc:
      method: client.mhs.v0.read
      response:
        payload: CAAQABo1CICAurvILhIDAAH/Gglpc28xNDQ0M2EiA3JhdyoCAP8yBmZhaWxlZDoLUkVBRF9GQUlMRUQ=
      expect_calls: 2
  - id: provider_write
    client: peer
    client_rpc:
      method: client.mhs.v0.write
      response:
        payload: CjsIABAAGjUIgIC6u8guEgMAAf8aCWlzbzE0NDQzYSIDcmF3KgIA/zIGZmFpbGVkOgtSRUFEX0ZBSUxFRA==
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
