# User Story:
# As a GizClaw Peer API consumer,
# I want exercise the server.api_key.revoke behavior through its real transport,
# So that the generated RPC contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.api-key.revoke
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key_name:
    direction: output
    type: string
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: Giztest temporary key
  capture:
    api_key_name: "/value/name"
- id: primary_rpc
  client: peer
  rpc:
    method: server.api_key.revoke
    request:
      name: "${api_key_name}"
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
