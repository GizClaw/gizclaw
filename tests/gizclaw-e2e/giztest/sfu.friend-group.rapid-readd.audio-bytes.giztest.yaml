# User Story:
# As a cross-server group member,
# I want to repeat immediate remove/add cycles on the same connection,
# So that PTT and realtime audio recover without waiting for periodic revocation.
# Uses a committed two-second Opus tone; media assertions are never retried.
# Delete is immediately followed by add, without waiting for revocation.
# This exercises a race window without assuming the periodic recheck ran.
# Realtime listen windows include the runner's four-second silence tail.
version: gizclaw.test/v1alpha1
name: sfu.friend-group.rapid-readd.audio-bytes
timeout: 5m
clients:
  alice:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_a}
    registration_token: ${token_a}
  bob:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_b}
    registration_token: ${token_b}
variables:
  edge_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_A
  edge_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_B
  token_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_A
    secret: true
  token_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_B
    secret: true
  tone:
    direction: input
    type: audio
    env: GIZCLAW_TEST_SFU_TONE_OGG_BASE64
    media_type: audio/ogg
    codec: opus
    max_bytes: 262144
  group:
    direction: input
    type: string
    generate: token
  group_invite:
    direction: output
    type: string
    secret: true
  group_workspace:
    direction: output
    type: string
  bob_member:
    direction: output
    type: string
  bob_public_key:
    direction: output
    type: string
steps:
  - id: create_group
    client: alice
    rpc:
      method: server.friend_group.create
      request: {name: '${group}'}
    capture:
      group_workspace: /workspace_name
    expect:
      /workspace_name: {non_empty: true}
  - id: invite_group
    client: alice
    rpc:
      method: server.friend_group.invite_token.create
      request: {friend_group_name: '${group}'}
    capture:
      group_invite: /invite_token
  - id: join_group_bob
    client: bob
    rpc:
      method: server.friend_group.join
      request: {invite_token: '${group_invite}', name: '${group}'}
    capture:
      bob_member: /member/name
      bob_public_key: /member/peer_public_key
    expect:
      /group/workspace_name: {equals: '${group_workspace}'}
  - id: alice_initial
    client: alice
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: alice_initial_running
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: bob_initial
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: bob_initial_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: baseline
    timeout: 20s
    parallel:
      - id: baseline_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: baseline_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: baseline_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /baseline_bob_listen/audio_bytes: {minimum: 2000}
      /baseline_bob_listen/packets: {minimum: 50}
      /baseline_alice_listen/audio_bytes: {maximum: 0}
      /baseline_alice_speak/input_sent: {equals: true}
  - id: cycle1_remove
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: '${group}', name: '${bob_member}'}
  - id: cycle1_readd
    client: alice
    rpc:
      method: server.friend_group.members.add
      request: {friend_group_name: '${group}', peer_public_key: '${bob_public_key}', member_name: '${group}', role: 
          FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER}
    expect:
      /peer_public_key: {equals: '${bob_public_key}'}
      /name:
        equals: ${bob_member}
  - id: cycle1_members
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 2}
  - id: cycle1_select
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: cycle1_select_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle1_owner
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle1_forward
    timeout: 20s
    parallel:
      - id: cycle1_forward_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle1_forward_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle1_forward_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle1_forward_bob_listen/audio_bytes: {minimum: 2000}
      /cycle1_forward_bob_listen/packets: {minimum: 50}
      /cycle1_forward_alice_listen/audio_bytes: {maximum: 0}
      /cycle1_forward_alice_speak/input_sent: {equals: true}
  - id: cycle1_reverse
    timeout: 20s
    parallel:
      - id: cycle1_reverse_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle1_reverse_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle1_reverse_bob_speak
        client: bob
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle1_reverse_alice_listen/audio_bytes: {minimum: 2000}
      /cycle1_reverse_alice_listen/packets: {minimum: 50}
      /cycle1_reverse_bob_listen/audio_bytes: {maximum: 0}
      /cycle1_reverse_bob_speak/input_sent: {equals: true}
  - id: cycle2_remove
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: '${group}', name: '${bob_member}'}
  - id: cycle2_readd
    client: alice
    rpc:
      method: server.friend_group.members.add
      request: {friend_group_name: '${group}', peer_public_key: '${bob_public_key}', member_name: '${group}', role: 
          FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER}
    expect:
      /peer_public_key: {equals: '${bob_public_key}'}
      /name:
        equals: ${bob_member}
  - id: cycle2_members
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 2}
  - id: cycle2_select
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: cycle2_select_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle2_owner
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle2_forward
    timeout: 20s
    parallel:
      - id: cycle2_forward_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle2_forward_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle2_forward_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle2_forward_bob_listen/audio_bytes: {minimum: 2000}
      /cycle2_forward_bob_listen/packets: {minimum: 50}
      /cycle2_forward_alice_listen/audio_bytes: {maximum: 0}
      /cycle2_forward_alice_speak/input_sent: {equals: true}
  - id: cycle2_reverse
    timeout: 20s
    parallel:
      - id: cycle2_reverse_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 8s}
      - id: cycle2_reverse_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 8s}
      - id: cycle2_reverse_bob_speak
        client: bob
        delay: 200ms
        peer_stream: {mode: realtime, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle2_reverse_alice_listen/audio_bytes: {minimum: 2000}
      /cycle2_reverse_alice_listen/packets: {minimum: 50}
      /cycle2_reverse_bob_listen/audio_bytes: {maximum: 0}
      /cycle2_reverse_bob_speak/input_sent: {equals: true}
  - id: cycle3_remove
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: '${group}', name: '${bob_member}'}
  - id: cycle3_readd
    client: alice
    rpc:
      method: server.friend_group.members.add
      request: {friend_group_name: '${group}', peer_public_key: '${bob_public_key}', member_name: '${group}', role: 
          FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER}
    expect:
      /peer_public_key: {equals: '${bob_public_key}'}
      /name:
        equals: ${bob_member}
  - id: cycle3_members
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 2}
  - id: cycle3_select
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: cycle3_select_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle3_owner
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: cycle3_forward
    timeout: 20s
    parallel:
      - id: cycle3_forward_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle3_forward_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle3_forward_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle3_forward_bob_listen/audio_bytes: {minimum: 2000}
      /cycle3_forward_bob_listen/packets: {minimum: 50}
      /cycle3_forward_alice_listen/audio_bytes: {maximum: 0}
      /cycle3_forward_alice_speak/input_sent: {equals: true}
  - id: cycle3_reverse
    timeout: 20s
    parallel:
      - id: cycle3_reverse_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle3_reverse_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: cycle3_reverse_bob_speak
        client: bob
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /cycle3_reverse_alice_listen/audio_bytes: {minimum: 2000}
      /cycle3_reverse_alice_listen/packets: {minimum: 50}
      /cycle3_reverse_bob_listen/audio_bytes: {maximum: 0}
      /cycle3_reverse_bob_speak/input_sent: {equals: true}
finally:
  - client: alice
    rpc:
      method: server.run.stop
      request: {}
  - client: bob
    rpc:
      method: server.run.stop
      request: {}
  - client: alice
    rpc:
      method: server.friend_group.delete
      request: {name: '${group}'}
  - client: alice
    rpc:
      method: server.peer.delete
      request: {}
  - client: bob
    rpc:
      method: server.peer.delete
      request: {}
report:
  redact:
    - token_a
    - token_b
    - group_invite
