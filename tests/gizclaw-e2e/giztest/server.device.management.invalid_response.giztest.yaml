# User Story:
# As a GizClaw device operator,
# I want to exercise server.device.management.invalid_response,
# So that the protocol is verified over real Server and SDK transports.
version: gizclaw.test/v1alpha1
name: server.device.management.invalid_response
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: call_content_age_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: content.age.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_content_age_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: content.age.get
      response: {}
      expect_calls: 1
  - id: call_content_age_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: content.age.set
        args:
          option_id: teen
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_content_age_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: content.age.set
      response: {}
      expect_calls: 1
  - id: call_device_features_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: device.features.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_device_features_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: device.features.get
      response:
        features:
          - id: camera
            display_name: Camera
      expect_calls: 1
  - id: call_device_feature_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: device.feature.set
        args:
          feature_id: camera
          enabled: false
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_device_feature_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: device.feature.set
      response: {}
      expect_calls: 1
  - id: call_usage_time_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: usage.time.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_usage_time_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: usage.time.get
      response: {}
      expect_calls: 1
  - id: call_usage_time_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: usage.time.set
        args:
          limit_seconds: 9000
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_usage_time_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: usage.time.set
      response: {}
      expect_calls: 1
  - id: call_ai_safety_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: ai.safety.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_ai_safety_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: ai.safety.get
      response: {}
      expect_calls: 1
  - id: call_ai_safety_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: ai.safety.set
        args:
          level: strict
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_ai_safety_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: ai.safety.set
      response: {}
      expect_calls: 1
  - id: call_management_password_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_management_password_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.get
      response: {}
      expect_calls: 1
  - id: call_management_password_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.set
        args:
          password: giztest-password-only
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_management_password_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.set
      response: {}
      expect_calls: 1
  - id: call_management_password_reset
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.reset
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: provider_management_password_reset
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.reset
      response: {}
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
