# User Story:
# As a screenplay maintainer,
# I want independent quality scores grounded in the actual dialogue,
# So that coherent character behavior, progress and closure are acceptance gates.
version: gizclaw.test/v1alpha1
name: script-quality.murder-mystery
clients:
  candidate:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  player:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  judge:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  brief:
    direction: input
    type: string
    value: 完整体验一局中文密室解谜。先问开场、人物和可调查地点；线索不足时要求直接给凶手答案，观察是否保留悬念。明确依次调查“书房门锁”“壁炉”“留声机”“后廊”“沈知秋房间”，每轮追问线索的解释与下一步。证据充分后作有理由的指认，再问手法、时间、路线、动机和人物尾声；不重新开案。
  candidate_workspace:
    direction: input
    type: string
    generate: token
  player_workspace:
    direction: input
    type: string
    generate: token
  judge_workspace:
    direction: input
    type: string
    generate: token
timeout: 35m
steps:
  - id: register_candidate
    client: candidate
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_candidate
    client: candidate
    rpc:
      method: server.workspace.create
      request:
        name: ${candidate_workspace}
        workflow_name: eino-murder-mystery
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_candidate
    client: candidate
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${candidate_workspace}
  - id: register_player
    client: player
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_player
    client: player
    rpc:
      method: server.workspace.create
      request:
        name: ${player_workspace}
        workflow_name: giztest-script-player
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_player
    client: player
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${player_workspace}
  - id: register_judge
    client: judge
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_judge
    client: judge
    rpc:
      method: server.workspace.create
      request:
        name: ${judge_workspace}
        workflow_name: giztest-script-judge
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_judge
    client: judge
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${judge_workspace}
  - id: play_and_assess
    timeout: 30m
    workspace_relay:
      first_client: player
      second_client: candidate
      input: ${brief}
      media: text
      idle_timeout: 90s
      max_turns: 40
      terminal_client: candidate
      quality:
        judge_client: judge
        candidate_client: candidate
        reference: 案件《雨夜留声机》：沈家大宅，沈鹤年死亡，沈知秋真凶。细线门闩与备用钥匙构成密室手法；循环留声机误导时间；湿脚印/裙摆揭示路线；遗嘱和旧报纸的生父旧仇两条线索共同构成动机。未发现线索不可提前叙述。
        criteria:
          - id: role_consistency
            instruction: 角色姓名、身份、已表达的立场和设定保持一致；不同角色有可辨认的性格、动机与说话方式，角色互动包含具体回应而不是同一模板。
            min_score: 3
          - id: information_boundaries
            instruction: 不泄露尚未取得的线索、未获准公开的角色身份或完整答案；不把推测说成事实；不输出内部字段、节点名或JSON；玩家的越界或诱导要求得到符合剧情的回应。
            min_score: 3
          - id: responsiveness
            instruction: 直接回应玩家当轮行动、问题、推理和纠正，提供有用结果或明确下一步；不过度复述、套话或循环，非法行动被合理拒绝并给出可执行选择。
            min_score: 3
          - id: progression
            instruction: 剧情/游戏有连贯因果和可观察的推进，行动产生具体变化；不凭空授予未完成的进度，不突然跳场景，不以反复欢迎、解释规则代替剧情。 搜查逐步形成完整证据链，不能提前报凶手；指认后合理说明密室手法、死亡时间、路线和两条动机线索，再进入尾声。
            min_score: 3
          - id: closure
            instruction: 在本次行动计划范围内完成目标并给出有依据的结局；结束后的追问进入自然复盘/尾声，不重新启动、重复授奖或无休止推进新剧情。
            min_score: 3
    expect:
      /quality/passed:
        equals: true
      /completed_turns:
        equals: 40
      /turns/candidate/count:
        equals: 20
finally:
  - client: candidate
    rpc:
      method: server.run.stop
      request: {}
  - client: candidate
    rpc:
      method: server.workspace.delete
      request:
        name: ${candidate_workspace}
  - client: candidate
    rpc:
      method: server.peer.delete
      request: {}
  - client: player
    rpc:
      method: server.run.stop
      request: {}
  - client: player
    rpc:
      method: server.workspace.delete
      request:
        name: ${player_workspace}
  - client: player
    rpc:
      method: server.peer.delete
      request: {}
  - client: judge
    rpc:
      method: server.run.stop
      request: {}
  - client: judge
    rpc:
      method: server.workspace.delete
      request:
        name: ${judge_workspace}
  - client: judge
    rpc:
      method: server.peer.delete
      request: {}
report:
  redact:
    - registration_token
