# User Story:
# As a registered device using AST with MiniMax speech,
# I want to hear MiniMax translation during input and finish its final subtitle,
# So that capture policy, streaming synthesis and output completion remain testable.
version: gizclaw.test/v1alpha1
name: volc-ast-translate-minimax.realtime-streaming
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: volc-ast-translate-tts
        parameters:
          asttranslate_workspace_parameters:
            agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
            input: WORKSPACE_INPUT_MODE_REALTIME
            lang_pair: zh/en
            voice:
              asttranslate_external_voice_parameters:
                tts_voice: minimax-boy
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 我们明天上午九点在学校门口见面。请记得带上借书证和水杯。中午我们在附近吃饭，下午一起去公园散步。晚上七点再坐地铁回家。下一天我们会去博物馆看展览，听讲解员介绍这座城市的历史，然后一起分享今天最喜欢的故事。
        accepted_content_types:
          - audio/ogg
    save_as: input_audio
  - id: exercise_workflow
    client: peer
    peer_stream:
      mode: realtime
      input: ${input_audio}
      pacing: 20ms
      require_text: true
      require_audio: true
      wait_for_history: true
    expect:
      /audio_bytes:
        minimum: 1
      /audio_integrity/violations:
        equals: 0
      /input_ms:
        minimum: 11000
      /first_audio_ms:
        maximum: 8000
      /response_count:
        minimum: 2
      /text_eos:
        equals: true
      /audio_eos:
        equals: true
      /history_name:
        non_empty: true
      /audio_integrity/open:
        equals: 0
    timeout: 120s
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
