# User Story:
# As a GizClaw API key holder,
# I want exercise the server.device.volume.set behavior through its real transport,
# So that the Public HTTP device contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.volume.set
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: primary_http
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: speaker.main
            state: volume
            value: 35
          - device_id: speaker.main
            state: muted
            value: true
      status: 200
    expect:
      /states/0/value:
        equals: 35
      /states/1/value:
        equals: true
  - id: read_device_status
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: device.status.get
        args: {}
      status: 200
    expect:
      /result/battery_percent:
        equals: 88
  - id: read_back
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /volume:
        equals: 35
      /muted:
        equals: true
  - id: rpc_read_back
    client: peer
    rpc:
      method: server.status.get
      request: {}
    expect:
      /volume:
        minimum: 35
        maximum: 35
      /muted:
        equals: true
  - id: out_of_range
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: speaker.main
            state: volume
            value: 101
          - device_id: speaker.main
            state: muted
            value: false
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_volume
    client: peer
    client_rpc:
      method: client.mhs.v0.write
      response:
        states:
          - device_id: speaker.main
            state: volume
            value:
              int_value: 35
          - device_id: speaker.main
            state: muted
            value:
              bool_value: true
      expect_calls: 1
  - id: provider_status
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: device.status.get
      response:
        volume: 35
        muted: true
        battery_percent: 88
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
