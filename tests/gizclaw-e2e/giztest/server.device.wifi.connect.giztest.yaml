# User Story:
# As a GizClaw API key holder,
# I want the device to accept replacement Wi-Fi credentials before switching,
# So that I can observe the switch complete once the device comes back.
version: gizclaw.test/v1alpha1
name: server.device.wifi.connect
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: before_connect
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      status: 200
      body:
        states:
          - device_id: wifi.main
            state: connected
          - device_id: wifi.main
            state: ssid
    expect:
      /states/0/value:
        equals: true
  - id: connect
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: wifi.connect
        args:
          ssid: Office
          passphrase: correct-horse
      status: 202
  - id: switching_is_offline
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      status: 409
      body:
        states:
          - device_id: wifi.main
            state: connected
          - device_id: wifi.main
            state: ssid
    expect:
      /error/code:
        equals: DEVICE_OFFLINE
  - id: switched_networks
    client: peer
    reconnect:
      await_ms: 30000
  - id: after_connect
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      status: 200
      body:
        states:
          - device_id: wifi.main
            state: connected
          - device_id: wifi.main
            state: ssid
    expect:
      /states/1/value:
        equals: Office
      /states/0/value:
        equals: true
  - id: provider_status
    client: peer
    client_rpc:
      method: client.mhs.v0.read
      response:
        states:
          - device_id: wifi.main
            state: connected
            value:
              bool_value: true
          - device_id: wifi.main
            state: ssid
            value:
              string_value: Office
      expect_calls: 2
  - id: provider_connect
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      expect_calls: 1
      tool: wifi.connect
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
