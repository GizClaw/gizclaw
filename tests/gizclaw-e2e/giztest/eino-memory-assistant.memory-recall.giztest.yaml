# User Story:
# As a registered device using the eino-memory-assistant Workflow,
# I want complete the independent eino-memory-assistant.memory-recall scenario,
# So that conversation behavior and cleanup remain reproducible.
version: gizclaw.test/v1alpha1
name: eino-memory-assistant.memory-recall
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Remember that the Giztest verification color is cobalt blue.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  recall_prompt:
    direction: input
    type: string
    value: What verification color did I ask you to remember?
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${workspace_name}"
      collection: assistants
      workflow_name: eino-memory-assistant
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${workspace_name}"
- id: synthesize_input
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: narrator
      text: Giztest audio input
      accepted_content_types:
      - audio/ogg
  save_as: input_audio
- id: exercise_workflow
  client: peer
  peer_stream:
    mode: push-to-talk
    input: "${input_audio}"
    pacing: 20ms
  expect:
    "/events":
      non_empty: true
- id: recall_turn
  client: peer
  peer_stream:
    mode: text
    input: "${recall_prompt}"
  expect:
    "/events":
      non_empty: true
- id: memory_stats
  client: peer
  rpc:
    method: server.run.workspace.memory.stats
    request: {}
  expect:
    "/available":
      equals: true
- id: memory_recall
  client: peer
  rpc:
    method: server.run.workspace.recall
    request:
      query: cobalt blue
  expect:
    "/available":
      equals: true
finally:
- client: peer
  rpc:
    method: server.run.stop
    request: {}
- client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${workspace_name}"
- client: peer
  rpc:
    method: server.peer.delete
    request: {}
