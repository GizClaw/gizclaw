# User Story:
# As a GizClaw API key holder,
# I want to ring my bound device through its real transport,
# So that "find my device" reaches client.device.find instead of a music track.
version: gizclaw.test/v1alpha1
name: server.device.find
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: find_with_duration
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/actions/find
    headers:
      Authorization: "Bearer ${api_key}"
    body:
      duration_ms: 8000
    status: 204
- id: find_with_device_default
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/actions/find
    headers:
      Authorization: "Bearer ${api_key}"
    body: {}
    status: 204
- id: negative_duration
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/actions/find
    headers:
      Authorization: "Bearer ${api_key}"
    body:
      duration_ms: -1
    status: 400
  expect:
    /error/code:
      equals: INVALID_REQUEST
- id: provider_find
  client: peer
  client_rpc:
    method: client.device.find
    expect_calls: 2
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
