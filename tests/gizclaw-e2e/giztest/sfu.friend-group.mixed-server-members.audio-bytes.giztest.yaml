      /bob_restored_dave_listen/audio_bytes: {minimum: 2000}
      /bob_restored_dave_listen/packets: {minimum: 50}
      /bob_restored_carol_listen/audio_bytes: {maximum: 0}
      /bob_restored_bob_listen/audio_bytes: {maximum: 0}
      /bob_restored_bob_speak/input_sent: {equals: true}
  - id: carol_rejoins_with_invite
    client: carol
    rpc:
      method: server.friend_group.join
      request: {invite_token: '${group_invite}', name: '${group}'}
    expect:
      /group/workspace_name: {equals: '${group_workspace}'}
      /member/name:
        equals: ${carol_member}
      /member/peer_public_key:
        equals: ${carol_public_key}
  - id: four_restored
