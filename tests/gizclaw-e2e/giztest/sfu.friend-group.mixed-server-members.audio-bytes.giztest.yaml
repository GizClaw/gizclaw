      /restored_carol_dave_listen/packets: {minimum: 50}
      /restored_carol_carol_listen/audio_bytes: {maximum: 0}
      /restored_carol_carol_speak/input_sent: {equals: true}
  - id: restored_dave
    timeout: 20s
    parallel:
      - id: restored_dave_alice_listen
