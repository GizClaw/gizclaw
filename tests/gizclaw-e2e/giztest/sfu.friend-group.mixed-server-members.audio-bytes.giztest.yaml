      /restored_bob_carol_listen/audio_bytes: {minimum: 2000}
      /restored_bob_carol_listen/packets: {minimum: 50}
      /restored_bob_dave_listen/audio_bytes: {minimum: 2000}
      /restored_bob_dave_listen/packets: {minimum: 50}
      /restored_bob_bob_listen/audio_bytes: {maximum: 0}
      /restored_bob_bob_speak/input_sent: {equals: true}
  - id: restored_carol
    timeout: 20s
    parallel:
      - id: restored_carol_alice_listen
        client: alice
