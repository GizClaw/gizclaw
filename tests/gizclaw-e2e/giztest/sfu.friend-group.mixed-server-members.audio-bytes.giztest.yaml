      - id: restored_carol_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: restored_carol_dave_listen
        client: dave
        peer_stream: {mode: listen, duration: 5s}
      - id: restored_carol_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: restored_carol_carol_speak
