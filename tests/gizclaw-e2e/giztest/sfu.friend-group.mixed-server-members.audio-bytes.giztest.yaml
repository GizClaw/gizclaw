      - id: remaining_reverse_dave_speak
        client: dave
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /remaining_reverse_alice_listen/audio_bytes: {minimum: 2000}
      /remaining_reverse_alice_listen/packets: {minimum: 50}
      /remaining_reverse_bob_listen/audio_bytes: {maximum: 0}
      /remaining_reverse_carol_listen/audio_bytes: {maximum: 0}
      /remaining_reverse_dave_listen/audio_bytes: {maximum: 0}
      /remaining_reverse_dave_speak/input_sent: {equals: true}
  - id: owner_readds_bob
    client: alice
    rpc:
      method: server.friend_group.members.add
      request: {friend_group_name: '${group}', peer_public_key: '${bob_public_key}', member_name: '${group}', role: 
          FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER}
    expect:
      /peer_public_key: {equals: '${bob_public_key}'}
      /name:
        equals: ${bob_member}
  - id: duplicate_add_bob
    client: alice
    rpc:
      method: server.friend_group.members.add
      request: {friend_group_name: '${group}', peer_public_key: '${bob_public_key}', member_name: '${group}', role: 
          FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER}
    expect:
      /peer_public_key: {equals: '${bob_public_key}'}
      /name:
        equals: ${bob_member}
  - id: duplicate_does_not_duplicate_member
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 3}
  - id: bob_returns
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: bob_returns_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: bob_restored
    timeout: 20s
    parallel:
      - id: bob_restored_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: bob_restored_dave_listen
        client: dave
        peer_stream: {mode: listen, duration: 5s}
      - id: bob_restored_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: bob_restored_bob_listen
