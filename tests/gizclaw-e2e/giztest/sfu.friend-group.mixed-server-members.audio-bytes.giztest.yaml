      /baseline_dave_bob_listen/audio_bytes: {minimum: 2000}
      /baseline_dave_bob_listen/packets: {minimum: 50}
      /baseline_dave_carol_listen/audio_bytes: {minimum: 2000}
      /baseline_dave_carol_listen/packets: {minimum: 50}
      /baseline_dave_dave_listen/audio_bytes: {maximum: 0}
      /baseline_dave_dave_speak/input_sent: {equals: true}
  - id: remove_remote
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: '${group}', name: '${bob_member}'}
  - id: remove_local
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: '${group}', name: '${carol_member}'}
  - id: bob_revoked
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$}
  - id: bob_ping
    client: bob
    rpc:
      method: all.ping
      request: {client_send_time: 0}
  - id: carol_revoked
    client: carol
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$}
  - id: carol_ping
    client: carol
    rpc:
      method: all.ping
      request: {client_send_time: 0}
  - id: two_remain
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 2}
  - id: remaining_forward
    timeout: 20s
    parallel:
      - id: remaining_forward_dave_listen
        client: dave
        peer_stream: {mode: listen, duration: 5s}
      - id: remaining_forward_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: remaining_forward_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: remaining_forward_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: remaining_forward_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /remaining_forward_dave_listen/audio_bytes: {minimum: 2000}
      /remaining_forward_dave_listen/packets: {minimum: 50}
      /remaining_forward_bob_listen/audio_bytes: {maximum: 0}
      /remaining_forward_carol_listen/audio_bytes: {maximum: 0}
      /remaining_forward_alice_listen/audio_bytes: {maximum: 0}
      /remaining_forward_alice_speak/input_sent: {equals: true}
  - id: remaining_reverse
    timeout: 20s
    parallel:
      - id: remaining_reverse_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: remaining_reverse_bob_listen
