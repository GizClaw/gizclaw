      /baseline_carol_alice_listen/packets: {minimum: 50}
      /baseline_carol_bob_listen/audio_bytes: {minimum: 2000}
      /baseline_carol_bob_listen/packets: {minimum: 50}
      /baseline_carol_dave_listen/audio_bytes: {minimum: 2000}
      /baseline_carol_dave_listen/packets: {minimum: 50}
      /baseline_carol_carol_listen/audio_bytes: {maximum: 0}
      /baseline_carol_carol_speak/input_sent: {equals: true}
  - id: baseline_dave
