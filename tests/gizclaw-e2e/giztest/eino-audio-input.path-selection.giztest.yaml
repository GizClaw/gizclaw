# User Story:
# As a device using Profile-owned speech input,
# I want PTT and realtime to use their independently selected ASR Models,
# So that Workspace updates cannot change the input source chosen by the Profile.
version: gizclaw.test/v1alpha1
name: eino-audio-input.path-selection
clients:
  peer: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  asr_peer: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  workspace_name: {direction: input, type: string, generate: token}
  asr_workspace: {direction: input, type: string, generate: token}
steps:
  - id: register_peer
    client: peer
    rpc: {method: server.register, request: {token: "${registration_token}"}}
  - id: register_asr_peer
    client: asr_peer
    rpc: {method: server.register, request: {token: gizclaw-e2e-audio-asr}}
  - id: create_native_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: eino-audio-input
        parameters:
          eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO, input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK}
  - id: native_ptt
    client: peer
    rpc: {method: server.run.workspace.reload-with-options, request: {workspace_name: "${workspace_name}"}}
    expect:
      /audio_input: {equals: AUDIO_INPUT_PATH_MODEL}
  - id: realtime_uses_profile_asr
    client: peer
    rpc:
      method: server.run.workspace.reload-with-options
      request:
        parameters: {input: WORKSPACE_INPUT_MODE_REALTIME}
    expect:
      /audio_input: {equals: AUDIO_INPUT_PATH_ASR}
  - id: ptt_keeps_profile_native_input
    client: peer
    rpc:
      method: server.run.workspace.reload-with-options
      request:
        parameters: {input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK}
    expect:
      /audio_input: {equals: AUDIO_INPUT_PATH_MODEL}
  - id: create_asr_workspace
    client: asr_peer
    rpc:
      method: server.workspace.create
      request:
        name: ${asr_workspace}
        workflow_name: eino-audio-input
        parameters:
          eino_workspace_parameters: {agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO, input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK}
  - id: other_profile_selects_ptt_asr
    client: asr_peer
    rpc: {method: server.run.workspace.reload-with-options, request: {workspace_name: "${asr_workspace}"}}
    expect:
      /audio_input: {equals: AUDIO_INPUT_PATH_ASR}
finally:
  - client: peer
    rpc: {method: server.run.stop, request: {}}
  - client: asr_peer
    rpc: {method: server.run.stop, request: {}}
  - client: peer
    rpc: {method: server.workspace.delete, request: {name: "${workspace_name}"}}
  - client: asr_peer
    rpc: {method: server.workspace.delete, request: {name: "${asr_workspace}"}}
  - client: peer
    rpc: {method: server.peer.delete, request: {}}
  - client: asr_peer
    rpc: {method: server.peer.delete, request: {}}
