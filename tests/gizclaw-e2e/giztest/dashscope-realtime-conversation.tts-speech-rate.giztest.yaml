# User Story:
# As a device that lets its user slow down AI replies,
# I want a DashScope realtime Workspace reloaded with tts_speech_rate_percent to keep replying,
# So that providers without a native rate still speak through the transformer time-stretch.
version: gizclaw.test/v1alpha1
name: dashscope-realtime-conversation.tts-speech-rate
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: dashscope-realtime-conversation
        parameters:
          dash_scope_realtime_workspace_parameters:
            agent_type: DASH_SCOPE_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DASH_SCOPE_REALTIME
  - id: reload_with_slow_rate
    client: peer
    rpc:
      method: server.run.workspace.reload-with-options
      request:
        workspace_name: ${workspace_name}
        parameters:
          tts_speech_rate_percent: 70
    expect:
      /workspace_name:
        equals: ${workspace_name}
  - id: verify_stored_rate
    client: peer
    rpc:
      method: server.workspace.get
      request:
        name: ${workspace_name}
    expect:
      /value/parameters/dash_scope_realtime_workspace_parameters/tts_speech_rate_percent:
        equals: 70
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: Giztest audio input
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: slow_reply
    client: peer
    timeout: 90s
    peer_stream:
      mode: realtime
      input: ${input_audio}
      pacing: 20ms
    expect:
      /events:
        non_empty: true
      /audio_bytes:
        minimum: 1000
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
