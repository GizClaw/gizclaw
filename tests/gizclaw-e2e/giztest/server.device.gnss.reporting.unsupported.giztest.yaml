# User Story:
# As a device API caller,
# I want to discover only installed tools and reject unimplemented GNSS reporting procedures,
# So that GNSS reporting invoke is verified over the real Server and device SDK transport.
version: gizclaw.test/v1alpha1
name: server.device.gnss.reporting.unsupported
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: key_peer
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: tools_peer
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/tool/v0/tools
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /tools:
        equals:
          - info.get
          - identifiers.get
  - id: unsupported_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: gnss.reporting.get
        args: {}
      status: 501
    expect:
      /error/code:
        equals: DEVICE_UNSUPPORTED
  - id: unsupported_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: gnss.reporting.set
        args:
          enabled: false
      status: 501
    expect:
      /error/code:
        equals: DEVICE_UNSUPPORTED
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
