# User Story:
# As a GizClaw device operator,
# I want to exercise server.device.management.validation,
# So that the protocol is verified over real Server and SDK transports.
version: gizclaw.test/v1alpha1
name: server.device.management.validation
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: call_content_age_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: content.age.get
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_content_age_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: content.age.get
      response:
        state:
          option_id: child
          options: &a1
            - id: child
              display_name: Child
              min_age_years: 6
              max_age_years: 12
            - id: teen
              display_name: Teen
              min_age_years: 13
              max_age_years: 17
      expect_calls: 0
  - id: call_content_age_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: content.age.set
        args: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_content_age_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: content.age.set
      response:
        applied:
          option_id: teen
          options: *a1
      expect_calls: 0
  - id: call_device_features_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: device.features.get
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_device_features_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: device.features.get
      response:
        features:
          - &a2
            id: camera
            display_name: Camera
            enabled: false
            writable: true
      expect_calls: 0
  - id: call_device_feature_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: device.feature.set
        args: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_device_feature_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: device.feature.set
      response:
        applied: *a2
      expect_calls: 0
  - id: call_usage_time_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: usage.time.get
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_usage_time_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: usage.time.get
      response:
        state:
          limit_seconds: 0
          used_seconds: 0
          exhausted: false
      expect_calls: 0
  - id: call_usage_time_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: usage.time.set
        args: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_usage_time_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: usage.time.set
      response:
        applied:
          limit_seconds: 3600
          used_seconds: 30
          exhausted: false
      expect_calls: 0
  - id: call_ai_safety_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: ai.safety.get
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_ai_safety_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: ai.safety.get
      response:
        state:
          level: standard
          options: &a3
            - id: standard
              display_name: Standard
            - id: strict
              display_name: Strict
      expect_calls: 0
  - id: call_ai_safety_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: ai.safety.set
        args: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_ai_safety_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: ai.safety.set
      response:
        applied:
          level: strict
          options: *a3
      expect_calls: 0
  - id: call_management_password_get
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.get
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_management_password_get
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.get
      response:
        is_set: false
      expect_calls: 0
  - id: call_management_password_set
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.set
        args: {}
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_management_password_set
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.set
      response:
        is_set: true
      expect_calls: 0
  - id: call_management_password_reset
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: management.password.reset
        args:
          unexpected: true
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_management_password_reset
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: management.password.reset
      response:
        is_set: false
      expect_calls: 0
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
