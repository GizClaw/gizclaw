# User Story:
# As a registered device sending native audio to the Lite chat Model,
# I want the Model adapter to produce both the reply and the user transcript,
# So that no external ASR Model or application transcription prompt is required.
version: gizclaw.test/v1alpha1
name: eino-lite-native-audio.asr-roundtrip
timeout: 2m
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  transcript:
    direction: output
    type: string
  reply:
    direction: output
    type: string
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: eino-lite-native-audio
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: reload_model_audio
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
    expect:
      /audio_input:
        equals: AUDIO_INPUT_PATH_MODEL
  # Speech synthesis prepares input only. The Workflow has no ASR stage.
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 请帮我计算七加五是多少
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: lite_native_audio_turn
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      require_text: true
      require_audio: false
    expect:
      /input_packets:
        minimum: 1
      /transcript:
        equals: 请帮我计算7加5是多少
        normalize: [digits, punctuation, whitespace]
      /reply:
        non_empty: true
        contains_any: ["12", 十二]
        not_contains: ["<asr>", "</asr>"]
    capture:
      transcript: /transcript
      reply: /reply
  - id: output_transcript
    output:
      variable: transcript
  - id: output_reply
    output:
      variable: reply
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
