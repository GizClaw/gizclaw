# User Story:
# As a registered device using the doubao-realtime-conversation Workflow,
# I want complete the independent benchmark.doubao-realtime-conversation.concurrency-interrupt-20 scenario,
# So that conversation behavior and cleanup remain reproducible.
version: gizclaw.test/v1alpha1
name: benchmark.doubao-realtime-conversation.concurrency-interrupt-20
repeat: 20
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Hello from an independent Giztest workflow task.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: synchronize_repeats
  barrier:
    participants: 20
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${workspace_name}"
      collection: assistants
      workflow_name: doubao-realtime-conversation
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${workspace_name}"
- id: synthesize_input
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: narrator
      text: Giztest audio input
      accepted_content_types:
      - audio/ogg
  save_as: input_audio
- id: exercise_workflow
  client: peer
  peer_stream:
    mode: realtime
    pacing: 20ms
    interrupt_after: 250ms
    input: "${input_audio}"
    max_events: 1024
  expect:
    "/events":
      non_empty: true
    "/interrupted":
      equals: true
finally:
- client: peer
  rpc:
    method: server.run.stop
    request: {}
- client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${workspace_name}"
- client: peer
  rpc:
    method: server.peer.delete
    request: {}
