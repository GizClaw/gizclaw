# User Story:
# As a GizClaw API key holder,
# I want exercise the server.device.sound.play.unavailable behavior through its real transport,
# So that the Public HTTP device contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.sound.play.unavailable
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: primary_http
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/actions/play-sound
    headers:
      Authorization: "Bearer ${api_key}"
    body:
      sound: chime
      duration_ms: 1500
    status: 409
  expect:
    /error/code:
      equals: DEVICE_OFFLINE
- id: provider_sound
  client: peer
  client_rpc:
    method: client.device.sound.play
    response:
      error_code: 14
    expect_calls: 1
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
