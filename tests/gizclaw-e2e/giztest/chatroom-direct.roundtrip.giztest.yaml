# User Story:
# As a pair of independently registered devices that become friends,
# I want each device to send and retain a turn in its relationship-owned direct-chat Workspace,
# So that both authorized Workspace lifecycles, histories, and cleanup are verified.
version: gizclaw.test/v1alpha1
name: chatroom-direct.roundtrip
clients:
  alice: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  bob: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  bob_invite_token: {direction: output, type: string}
  friend_name: {direction: output, type: string}
  alice_workspace: {direction: output, type: string}
  bob_workspace: {direction: output, type: string}
  alice_prompt: {direction: input, type: string, value: Alice says hello to Bob.}
  bob_prompt: {direction: input, type: string, value: Bob replies to Alice.}
steps:
  - id: register_alice
    client: alice
    rpc: {method: server.register, request: {token: "${registration_token}"}}
  - id: register_bob
    client: bob
    rpc: {method: server.register, request: {token: "${registration_token}"}}
  - id: create_bob_invite
    client: bob
    rpc: {method: server.friend.invite_token.create, request: {}}
    capture:
      bob_invite_token: /invite_token
  - id: add_bob
    client: alice
    rpc: {method: server.friend.add, request: {invite_token: "${bob_invite_token}"}}
    capture:
      friend_name: /name
      alice_workspace: /workspace_name
  - id: find_alice_workspace
    client: bob
    rpc: {method: server.friend.list, request: {}}
    capture:
      bob_workspace: /items/0/workspace_name
  - id: select_alice_workspace
    client: alice
    rpc: {method: server.run.workspace.set, request: {workspace_name: "${alice_workspace}"}}
  - id: select_bob_workspace
    client: bob
    rpc: {method: server.run.workspace.set, request: {workspace_name: "${bob_workspace}"}}
  - id: alice_to_bob
    client: alice
    peer_stream:
      mode: text
      input: "${alice_prompt}"
      terminal_label: transcript
      wait_for_history: true
      max_events: 1024
    expect:
      /events: {non_empty: true}
  - id: alice_reads_own_history
    client: alice
    rpc: {method: server.run.workspace.history, request: {limit: 20}}
    expect:
      /items: {non_empty: true}
  - id: bob_to_alice
    client: bob
    peer_stream:
      mode: text
      input: "${bob_prompt}"
      terminal_label: transcript
      wait_for_history: true
      max_events: 1024
    expect:
      /events: {non_empty: true}
  - id: bob_reads_own_history
    client: bob
    rpc: {method: server.run.workspace.history, request: {limit: 20}}
    expect:
      /items: {non_empty: true}
finally:
  - client: alice
    rpc: {method: server.run.stop, request: {}}
  - client: bob
    rpc: {method: server.run.stop, request: {}}
  - client: alice
    rpc: {method: server.friend.delete, request: {name: "${friend_name}"}}
  - client: alice
    rpc: {method: server.peer.delete, request: {}}
  - client: bob
    rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token, bob_invite_token]
