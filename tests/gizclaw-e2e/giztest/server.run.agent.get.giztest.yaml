# User Story:
# As a GizClaw Peer API consumer,
# I want exercise the server.run.agent.get behavior through its real transport,
# So that the generated RPC contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.run.agent.get
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: primary_rpc
    client: peer
    rpc:
      method: server.run.agent.get
      request:
        {}
finally:
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
