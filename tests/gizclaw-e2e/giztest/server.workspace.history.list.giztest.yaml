# User Story:
# As a GizClaw Peer API consumer,
# I want exercise the server.workspace.history.list behavior through its real transport,
# So that the generated RPC contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.workspace.history.list
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${resource_name}"
      collection: assistants
      workflow_name: flowcraft-chat-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: primary_rpc
  client: peer
  rpc:
    method: server.workspace.history.list
    request:
      workspace_name: "${resource_name}"
- id: time_range_rpc
  client: peer
  rpc:
    method: server.workspace.history.list
    request:
      workspace_name: "${resource_name}"
      order: WORKSPACE_HISTORY_LIST_REQUEST_ORDER_DESC
      start_time_ms: 1
      end_time_ms: 4102444800000
      limit: 10
  expect:
    /items:
      count: 0
    /has_next:
      equals: false
- id: inverted_time_range_rpc
  client: peer
  rpc:
    method: server.workspace.history.list
    request:
      workspace_name: "${resource_name}"
      start_time_ms: 2
      end_time_ms: 1
  expect_error:
    code: 3
finally:
- id: cleanup_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${resource_name}"
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
