# User Story:
# As a device API caller,
# I want to reject a device response that omits the required enabled value,
# So that GNSS reporting invoke is verified over the real Server and device SDK transport.
version: gizclaw.test/v1alpha1
name: server.device.gnss.reporting.invalid_response
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: key_peer
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: get_invalid_response
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: gnss.reporting.get
        args: {}
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: set_invalid_response
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/tool/v0/invoke
      headers:
        Authorization: Bearer ${api_key}
      body:
        tool: gnss.reporting.set
        args:
          enabled: false
      status: 502
    expect:
      /error/code:
        equals: DEVICE_ERROR
  - id: get_calls
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: gnss.reporting.get
      response: {}
      expect_calls: 1
  - id: set_calls
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: gnss.reporting.set
      response: {}
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
