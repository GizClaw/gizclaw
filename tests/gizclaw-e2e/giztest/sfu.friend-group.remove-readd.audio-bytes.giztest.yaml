# User Story:
# As a group member removed and added back while my device stays connected,
# I want to speak and hear again after selecting the same SFU Workspace,
# So that revocation does not leave the participant or media bridge unusable.
# Uses the committed Ogg/Opus tone; no TTS/ASR credentials are needed.
version: gizclaw.test/v1alpha1
name: sfu.friend-group.remove-readd.audio-bytes
clients:
  alice:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_a}
    registration_token: ${token_a}
  bob:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_b}
    registration_token: ${token_b}
variables:
  edge_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_A
  edge_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_B
  token_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_A
    secret: true
  token_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_B
    secret: true
  tone:
    direction: input
    type: audio
    env: GIZCLAW_TEST_SFU_TONE_OGG_BASE64
    media_type: audio/ogg
    codec: opus
    max_bytes: 262144
  group_name:
    direction: input
    type: string
    generate: token
  group_invite:
    direction: output
    type: string
    secret: true
  bob_member:
    direction: output
    type: string
  bob_public_key:
    direction: output
    type: string
  alice_workspace:
    direction: output
    type: string
  bob_workspace:
    direction: output
    type: string
steps:
  - id: alice_create_group
    client: alice
    rpc:
      method: server.friend_group.create
      request: {name: "${group_name}"}
    capture:
      alice_workspace: /workspace_name
    expect:
      /workspace_name: {non_empty: true}
  - id: alice_create_invite
    client: alice
    rpc:
      method: server.friend_group.invite_token.create
      request: {friend_group_name: "${group_name}"}
    capture:
      group_invite: /invite_token
  - id: bob_join
    client: bob
    rpc:
      method: server.friend_group.join
      request: {invite_token: "${group_invite}", name: "${group_name}"}
    capture:
      bob_workspace: /group/workspace_name
      bob_member: /member/name
      bob_public_key: /member/peer_public_key
    expect:
      /group/workspace_name: {equals: "${alice_workspace}"}
      /member/name: {non_empty: true}
      /member/peer_public_key: {non_empty: true}
  # Both sides see one shared Workspace identity; each client selects it
  # under the name captured by the other side, which joins the Room at once.
  - id: alice_select_shared_workspace
    client: alice
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${bob_workspace}
    expect:
      /selected_workspace_name: {equals: "${bob_workspace}"}
      /runtime_state: {pattern: "^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$"}
  - id: alice_select_shared_workspace_running
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 500ms}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
  - id: bob_select_shared_workspace
    client: bob
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${alice_workspace}
    expect:
      /selected_workspace_name: {equals: "${alice_workspace}"}
      /runtime_state: {pattern: "^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$"}
  - id: bob_select_shared_workspace_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 500ms}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
  # One step starts the speaker and both listen windows at the same moment, so
  # the windows cover the whole utterance.
  - id: alice_speaks_before_removal
    timeout: 30s
    parallel:
      - id: bob_listen_before_removal
        client: bob
        peer_stream:
          mode: listen
          duration: 8s
      - id: alice_listen_self_before_removal
        client: alice
        peer_stream:
          mode: listen
          duration: 8s
      - id: alice_speak_before_removal
        client: alice
        peer_stream:
          mode: push-to-talk
          input: ${tone}
          pacing: 20ms
          completion: input_sent
    expect:
      /alice_speak_before_removal/input_sent: {equals: true}
      /bob_listen_before_removal/audio_bytes: {minimum: 2000}
      /bob_listen_before_removal/packets: {minimum: 50}
      /alice_listen_self_before_removal/audio_bytes: {maximum: 0}
  - id: bob_speaks_before_removal
    timeout: 30s
    parallel:
      - id: alice_listen_before_removal
        client: alice
        peer_stream:
          mode: listen
          duration: 8s
      - id: bob_listen_self_before_removal
        client: bob
        peer_stream:
          mode: listen
          duration: 8s
      - id: bob_speak_before_removal
        client: bob
        peer_stream:
          mode: push-to-talk
          input: ${tone}
          pacing: 20ms
          completion: input_sent
    expect:
      /bob_speak_before_removal/input_sent: {equals: true}
      /alice_listen_before_removal/audio_bytes: {minimum: 2000}
      /alice_listen_before_removal/packets: {minimum: 50}
      /bob_listen_self_before_removal/audio_bytes: {maximum: 0}
  # Keep the original WebRTC connections and Alice's runtime throughout.
  - id: alice_remove_bob
    client: alice
    rpc:
      method: server.friend_group.members.delete
      request: {friend_group_name: "${group_name}", name: "${bob_member}"}
  - id: bob_runtime_revoked
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: "^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$"}
  - id: bob_still_connected_after_removal
    client: bob
    rpc: {method: all.ping, request: {client_send_time: 0}}
  - id: alice_speaks_while_bob_removed
    timeout: 30s
    parallel:
      - id: bob_listen_removed
        client: bob
        peer_stream: {mode: listen, duration: 8s}
      - id: alice_speak_removed
        client: alice
        peer_stream: {mode: push-to-talk, input: "${tone}", pacing: 20ms, completion: input_sent}
    expect:
      /alice_speak_removed/input_sent: {equals: true}
      /bob_listen_removed/audio_bytes: {maximum: 0}
  - id: alice_readd_bob
    client: alice
    rpc:
      method: server.friend_group.members.add
      request:
        friend_group_name: ${group_name}
        peer_public_key: ${bob_public_key}
        member_name: ${group_name}
        role: FRIEND_GROUP_MEMBER_MUTABLE_ROLE_MEMBER
    expect:
      /peer_public_key: {equals: "${bob_public_key}"}
  - id: bob_sees_original_workspace
    client: bob
    rpc:
      method: server.friend_group.get
      request: {name: "${group_name}"}
    expect:
      /workspace_name: {equals: "${bob_workspace}"}
  # An explicit selection is the supported activation path. Do not reconnect,
  # reload, stop Alice or create a new group to hide stale runtime state.
  - id: bob_reselect_workspace
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: "${bob_workspace}"}
    expect:
      /selected_workspace_name: {equals: "${bob_workspace}"}
      /runtime_state: {pattern: "^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$"}
  - id: bob_reselect_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 500ms}
    rpc: {method: server.run.workspace.get, request: {}}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
  - id: alice_still_running
    client: alice
    rpc: {method: server.run.workspace.get, request: {}}
    expect:
      /selected_workspace_name: {equals: "${alice_workspace}"}
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
  # One step starts the speaker and both listen windows at the same moment, so
  # the windows cover the whole utterance.
  - id: alice_speaks_after_readd
    timeout: 30s
    parallel:
      - id: bob_listen_after_readd
        client: bob
        peer_stream:
          mode: listen
          duration: 8s
      - id: alice_listen_self_after_readd
        client: alice
        peer_stream:
          mode: listen
          duration: 8s
      - id: alice_speak_after_readd
        client: alice
        peer_stream:
          mode: push-to-talk
          input: ${tone}
          pacing: 20ms
          completion: input_sent
    expect:
      /alice_speak_after_readd/input_sent: {equals: true}
      /bob_listen_after_readd/audio_bytes: {minimum: 2000}
      /bob_listen_after_readd/packets: {minimum: 50}
      /alice_listen_self_after_readd/audio_bytes: {maximum: 0}
  - id: bob_speaks_after_readd
    timeout: 30s
    parallel:
      - id: alice_listen_after_readd
        client: alice
        peer_stream:
          mode: listen
          duration: 8s
      - id: bob_listen_self_after_readd
        client: bob
        peer_stream:
          mode: listen
          duration: 8s
      - id: bob_speak_after_readd
        client: bob
        peer_stream:
          mode: push-to-talk
          input: ${tone}
          pacing: 20ms
          completion: input_sent
    expect:
      /bob_speak_after_readd/input_sent: {equals: true}
      /alice_listen_after_readd/audio_bytes: {minimum: 2000}
      /alice_listen_after_readd/packets: {minimum: 50}
      /bob_listen_self_after_readd/audio_bytes: {maximum: 0}
finally:
  - client: alice
    rpc:
      method: server.run.stop
      request: {}
  - client: bob
    rpc:
      method: server.run.stop
      request: {}
  - client: alice
    rpc:
      method: server.friend_group.delete
      request:
        name: ${group_name}
  - client: alice
    rpc:
      method: server.peer.delete
      request: {}
  - client: bob
    rpc:
      method: server.peer.delete
      request: {}
report:
  redact: [token_a, token_b, group_invite]
