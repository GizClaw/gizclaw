# User Story:
# As a GizClaw API key holder controlling hardware through MHS v0,
# I want the control app to read and adjust speaker volume and mute through MHS v0,
# So that the Public HTTP MHS contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.mhs.volume
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: manifest
  client: peer
  http:
    method: GET
    path: /gizclaw/v1/device/mhs/v0/manifest
    headers:
      Authorization: "Bearer ${api_key}"
    status: 200
  expect:
    /devices/3/id: {equals: speaker.main}
    /devices/3/states/2/name: {equals: volume}
    /devices/3/states/2/max: {equals: 100}
    /devices/3/states/3/type: {equals: bool}
- id: read_volume
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/read
    headers:
      Authorization: "Bearer ${api_key}"
    body: {states: [{device_id: speaker.main, state: volume}, {device_id: speaker.main, state: muted}]}
    status: 200
  expect:
    /states/0/value: {equals: 30}
    /states/1/value: {equals: true}
- id: volume_above_max
  client: peer
  http:
    method: PATCH
    path: /gizclaw/v1/device/mhs/v0/states
    headers:
      Authorization: "Bearer ${api_key}"
    body: {states: [{device_id: speaker.main, state: volume, value: 101}]}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: set_volume
  client: peer
  http:
    method: PATCH
    path: /gizclaw/v1/device/mhs/v0/states
    headers:
      Authorization: "Bearer ${api_key}"
    body: {states: [{device_id: speaker.main, state: volume, value: 60}, {device_id: speaker.main, state: muted, value: false}]}
    status: 200
  expect:
    /states/0/device_id: {equals: speaker.main}
    /states/0/state: {equals: volume}
    /states/0/value: {equals: 60}
    /states/1/value: {equals: false}
- id: provider_read
  client: peer
  client_rpc:
    method: client.mhs.v0.read
    response: {states: [{device_id: speaker.main, state: volume, value: {int_value: 30}}, {device_id: speaker.main, state: muted, value: {bool_value: true}}]}
    expect_calls: 1
- id: provider_write
  client: peer
  client_rpc:
    method: client.mhs.v0.write
    response: {states: [{device_id: speaker.main, state: volume, value: {int_value: 60}}, {device_id: speaker.main, state: muted, value: {bool_value: false}}]}
    expect_calls: 1
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
