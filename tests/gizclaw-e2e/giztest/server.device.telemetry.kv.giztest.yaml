# User Story:
# As a GizClaw device operator,
# I want to verify opaque JSON state including null values,
# So that snapshots survive deletion replays and reconnects.
version: gizclaw.test/v1alpha1
name: server.device.telemetry.kv
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: report
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000000000"
        observations:
          - kv:
              key: object
              json_value: '{"nested":[null,false,0]}'
          - kv:
              key: "null"
              json_value: "null"
          - kv:
              key: "false"
              json_value: "false"
          - kv:
              key: zero
              json_value: "0"
          - kv:
              key: array
              json_value: "[1,2]"
          - kv:
              key: string
              json_value: '"value"'
          - kv:
              key: online
              json_value: "false"
  - id: wait
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/object/json_value:
        equals: '{"nested":[null,false,0]}'
  - id: status
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/false/value:
        equals: false
      /reported_kv/zero/value:
        equals: 0
      /reported_kv/object/value:
        equals:
          nested:
            - null
            - false
            - 0
      /reported_kv/array/value:
        equals:
          - 1
          - 2
      /reported_kv/string/value:
        equals: value
      /reported_kv/object/observed_at:
        equals: 2020-09-13T12:26:40Z
      /reported_kv/null:
        equals:
          value: null
          json_value: "null"
          observed_at: 2020-09-13T12:26:40Z
  - id: runtime
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/runtime
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /online:
        equals: true
      /debug_mode:
        equals: off
      /reported_kv/online/value:
        equals: false
  - id: overwrite
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000001000"
        observations:
          - kv:
              key: object
              json_value: '{"changed":true}'
  - id: wait_overwrite
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/object/json_value:
        equals: '{"changed":true}'
  - id: delete
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: object
              delete: true
  - id: barrier
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000003000"
        observations:
          - kv:
              key: marker
              json_value: "true"
  - id: wait_marker
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/marker/json_value:
        equals: "true"
  - id: deleted
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/object:
        present: false
  - id: reconnect
    client: peer
    reconnect:
      await_ms: 15000
  - id: old_replay
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000001000"
        observations:
          - kv:
              key: object
              json_value: '{"old":true}'
  - id: marker_after_replay
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000004000"
        observations:
          - kv:
              key: marker
              json_value: "false"
  - id: wait_after_replay
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/marker/json_value:
        equals: "false"
  - id: replay_cannot_revive
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/object:
        present: false
      /reported_kv/null:
        equals:
          value: null
          json_value: "null"
          observed_at: 2020-09-13T12:26:40Z
  - id: new_null
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000005000"
        observations:
          - kv:
              key: object
              json_value: "null"
  - id: wait_new_null
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/object/json_value:
        equals: "null"
  - id: new_null_present
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/object:
        equals:
          value: null
          json_value: "null"
          observed_at: 2020-09-13T12:26:45Z
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
