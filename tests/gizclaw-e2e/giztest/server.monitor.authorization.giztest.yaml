# User Story:
# As a device owner using Monitor,
# I want the owning Server to enforce my runtime access setting on every monitor API,
# So that a public key never bypasses disabled access or Workspace ownership.
version: gizclaw.test/v1alpha1
name: server.monitor.authorization
clients:
  peer: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  api_key: {direction: output, type: string, secret: true}
  public_key: {direction: output, type: string}
steps:
  - id: register
    client: peer
    rpc: {method: server.register, request: {token: "${registration_token}"}}
  - id: create_key
    client: peer
    rpc: {method: server.api_key.create, request: {display_name: monitor-test}}
    capture: {api_key: /api_key}
  - id: capture_identity
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/telemetry/latest
      headers: {Authorization: "Bearer ${api_key}"}
      status: 200
    capture: {public_key: /peer_public_key}
  - id: disabled_workspaces
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/workspaces
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 403
    expect:
      /error/code: {equals: DEBUG_ACCESS_FORBIDDEN}
  - id: enable_readonly
    client: peer
    rpc: {method: server.runtime.put, request: {debug_mode: readonly}}
  - id: owned_workspaces
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/workspaces
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 200
  - id: missing_history
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/workspaces/nonexistent-monitor-workspace/history
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 404
    expect:
      /error/code: {equals: WORKSPACE_NOT_FOUND}
  - id: missing_audio
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/workspaces/nonexistent-monitor-workspace/history/missing/audio.ogg
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 404
    expect:
      /error/code: {equals: HISTORY_NOT_FOUND}
  - id: invalid_level
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/logs/search?start_time_ms=1000&end_time_ms=2000&level=TRACE
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 400
    expect:
      /error/code: {equals: INVALID_REQUEST}
  - id: revoke_debug
    client: peer
    rpc: {method: server.runtime.put, request: {debug_mode: off}}
  - id: revoked_logs
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/logs/search?start_time_ms=1000&end_time_ms=2000
      headers: {Authorization: "Bearer gizclaw_pk_${public_key}"}
      status: 403
    expect:
      /error/code: {equals: DEBUG_ACCESS_FORBIDDEN}
finally:
  - client: peer
    rpc: {method: server.peer.delete, request: {}}
