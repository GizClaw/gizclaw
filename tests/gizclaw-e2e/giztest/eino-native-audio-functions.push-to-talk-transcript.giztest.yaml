# User Story:
# As a registered device using the eino-native-audio-functions Workflow on a RuntimeProfile that selects the model audio input path,
# I want original audio answered by the chat Model while independent ASR transcribes it,
# So that AudioDock publishes the transcript for the client, History, and the next turn.
version: gizclaw.test/v1alpha1
name: eino-native-audio-functions.push-to-talk-transcript
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: eino-native-audio-functions
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: reload_workspace
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
    expect:
      /audio_input:
        equals: AUDIO_INPUT_PATH_MODEL
  - id: synthesize_question
    client: peer
    speech:
      cache: run
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 三加五等于几？
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: ask_by_voice
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      trim_trailing_silence: true
      wait_for_history: true
    expect:
      /first_transcript_ms:
        minimum: 1
      /first_text_ms:
        minimum: 1
        maximum: 2000
      /first_audio_ms:
        minimum: 1
        maximum: 3000
      /transcript:
        non_empty: true
      /reply:
        non_empty: true
      /history_name:
        non_empty: true
  - id: ask_again
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      trim_trailing_silence: true
      wait_for_history: true
    expect:
      /first_transcript_ms:
        minimum: 1
      /first_text_ms:
        minimum: 1
        maximum: 2000
      /first_audio_ms:
        minimum: 1
        maximum: 3000
      /transcript:
        non_empty: true
      /reply:
        non_empty: true
      /history_name:
        non_empty: true
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
