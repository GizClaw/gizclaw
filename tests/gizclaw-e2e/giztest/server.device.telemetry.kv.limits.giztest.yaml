  - id: wait_full
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/k63/json_value:
        equals: "0"
  - id: overwrite_full
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000001000"
        observations:
          - kv:
              key: k0
              json_value: "false"
  - id: wait_overwrite
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/k0/json_value:
        equals: "false"
  - id: over_key_limit
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: overflow
              json_value: "true"
          - kv:
              key: k0
              json_value: "true"
  - id: accepted_barrier
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000003000"
        observations:
          - kv:
              key: k63
              json_value: "true"
  - id: wait_barrier
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/k63/json_value:
        equals: "true"
  - id: over_limit_atomic
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/overflow:
        present: false
      /reported_kv/k0/value:
        equals: false
  - id: delete_at_capacity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000004000"
        observations:
          - kv:
              key: k0
              delete: true
  - id: marker_after_delete
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000005000"
        observations:
          - kv:
              key: k63
              json_value: "false"
  - id: wait_after_delete
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/k63/json_value:
        equals: "false"
  - id: tombstone
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/k0:
        present: false
  - id: cannot_reuse_tombstone_capacity
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000006000"
        observations:
          - kv:
              key: another
              json_value: "0"
  - id: final_marker
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000007000"
        observations:
          - kv:
              key: k63
              json_value: "true"
  - id: wait_final
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/k63/json_value:
        equals: "true"
  - id: bounded_deleted_key
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/another:
        present: false
      /reported_kv/k0:
        present: false
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
