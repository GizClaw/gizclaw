# User Story:
# As a GizClaw device operator,
# I want to exercise server.device.telemetry.kv.limits,
# So that the protocol is verified over real Server and SDK transports.
version: gizclaw.test/v1alpha1
name: server.device.telemetry.kv.limits
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: batch_0
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000000000"
        observations:
          - kv:
              key: k0
              json_value: "0"
          - kv:
              key: k1
              json_value: "0"
          - kv:
              key: k2
              json_value: "0"
          - kv:
              key: k3
              json_value: "0"
          - kv:
