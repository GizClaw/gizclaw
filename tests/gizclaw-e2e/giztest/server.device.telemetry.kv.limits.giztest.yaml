              json_value: "0"
  - id: batch_1
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000000000"
        observations:
          - kv:
              key: k16
              json_value: "0"
          - kv:
              key: k17
              json_value: "0"
