# User Story:
# As a GizClaw Peer API consumer,
# I want list the app_config keys of my selected RuntimeProfile,
# So that a device can discover its configuration downlink end to end.
version: gizclaw.test/v1alpha1
name: server.app_config.list
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  page_cursor: {direction: output, type: string}
  last_cursor: {direction: output, type: string}
  profile_revision: {direction: output, type: string}
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: primary_rpc
  client: peer
  rpc:
    method: server.app_config.list
    request: {}
  expect:
    "/keys":
      count: 3
      contains_all: [app.entrypoints, feature.flags, ui.theme]
    "/keys/0":
      equals: app.entrypoints
    "/has_next":
      equals: false
    "/runtime_profile_name":
      non_empty: true
    "/runtime_profile_revision":
      non_empty: true
- id: first_page
  client: peer
  rpc:
    method: server.app_config.list
    request:
      limit: 1
  capture:
    page_cursor: /next_cursor
    profile_revision: /runtime_profile_revision
  expect:
    "/keys":
      count: 1
    "/keys/0":
      equals: app.entrypoints
    "/has_next":
      equals: true
    "/next_cursor":
      non_empty: true
- id: second_page
  client: peer
  rpc:
    method: server.app_config.list
    request: {cursor: "${page_cursor}", limit: 1}
  capture:
    last_cursor: /next_cursor
  expect:
    /keys: {count: 1}
    /keys/0: {equals: feature.flags}
    /has_next: {equals: true}
    /runtime_profile_revision: {equals: "${profile_revision}"}
- id: last_page
  client: peer
  rpc:
    method: server.app_config.list
    request: {cursor: "${last_cursor}", limit: 1}
  expect:
    /keys: {count: 1}
    /keys/0: {equals: ui.theme}
    /has_next: {equals: false}
    /runtime_profile_revision: {equals: "${profile_revision}"}
finally:
- client: peer
  rpc:
    method: server.peer.delete
    request: {}
