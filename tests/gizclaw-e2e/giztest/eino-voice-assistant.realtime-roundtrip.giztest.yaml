# User Story:
# As a registered device using the eino-voice-assistant Workflow,
# I want realtime audio to use the Profile's PTT ASR when realtime ASR is null,
# So that transcription and spoken replies still work with a shared ASR Model.
version: gizclaw.test/v1alpha1
name: eino-voice-assistant.realtime-roundtrip
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Hello from an independent Giztest workflow task.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: eino-voice-assistant
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_REALTIME
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: verify_realtime_asr_fallback
    client: peer
    rpc:
      method: server.run.workspace.reload
      request: {}
    expect:
      /audio_input: {equals: AUDIO_INPUT_PATH_ASR}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 三加五等于几？
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: exercise_workflow
    client: peer
    timeout: 90s
    peer_stream:
      mode: realtime
      input: ${input_audio}
      pacing: 20ms
      reply_observation: 1s
    expect:
      /events:
        non_empty: true
      /transcript:
        contains_all: ["3", "5"]
        normalize: [digits]
      /reply:
        contains: "8"
        normalize: [digits]
      /audio_bytes: {minimum: 1}
      /text_eos: {equals: true}
      /audio_eos: {equals: true}
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
