# User Story:
# As a Peer using a real eino Workspace through Edge,
# I want quota hook failures to leave Workspace dialogue available,
# So that both initial and later turns reach the provider.
version: gizclaw.test/v1alpha1
name: server.quota.dialogue.eino.failure
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  fixture:
    direction: input
    type: string
    env: GIZCLAW_QUOTA_FIXTURE
steps:
  - id: dialogue
    client: peer
    timeout: 25s
    http:
      endpoint: ${fixture}
      method: POST
      path: /dialogue/eino
      body:
        hook_failure: true
    expect:
      /allowed_text:
        equals: quota fixture answer
      /last_text:
        equals: quota fixture answer
      /error/end_of_stream:
        equals: true
      /new_response:
        equals: true
      /provider_calls:
        equals: 1
