# User Story:
# As a registered Peer governed by an external quota service,
# I want calls to complete before and after a real hook timeout,
# So that missing quota results never block normal use.
version: gizclaw.test/v1alpha1
name: server.quota.timeout
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  fixture:
    direction: input
    type: string
    env: GIZCLAW_QUOTA_FIXTURE
  name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
  peer_key:
    direction: output
    type: string
  audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/pcm
    codec: pcm_s16le
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: quota-timeout
  - id: debug
    client: peer
    rpc:
      method: server.runtime.put
      request:
        debug_mode: fullcontrol
  - id: key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: quota-test
    capture:
      api_key: /api_key
  - id: refresh
    client: peer
    timeout: 15s
    http:
      method: POST
      path: /prepare
      endpoint: ${fixture}
      body:
        name: ${name}
    capture:
      peer_key: /public_key
  - id: identifiers_provider
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: identifiers.get
      response:
        sn: ${name}
        imeis:
          - name: modem
            tac: "12345678"
            serial: ${name}
        labels:
          - key: hardware
            value: fixture
          - key: board
            value: quota-test
  - id: cold_chat
    client: peer
    timeout: 2s
    http:
      method: POST
      path: /openai/v1/chat/completions
      headers:
        Authorization: Bearer ${api_key}
      body:
        model: chat
        messages: [{role: user, content: hello}]
        stream: false
    expect:
      /choices/0/message/content:
        equals: quota fixture answer
  - id: hook_timed_out
    client: peer
    timeout: 15s
    http:
      method: GET
      endpoint: ${fixture}
      path: /record/timeout?canceled=1&failures=1&peer=${peer_key}
    expect:
      /canceled:
        minimum: 1
      /failures:
        minimum: 1
      /report/peer_public_key:
        equals: ${peer_key}
  - id: chat_after_timeout
    client: peer
    timeout: 2s
    http:
      method: POST
      path: /openai/v1/chat/completions
      headers:
        Authorization: Bearer ${api_key}
      body:
        model: chat
        messages: [{role: user, content: hello}]
        stream: false
    expect:
      /choices/0/message/content:
        equals: quota fixture answer
  - id: speech_after_timeout
    client: peer
    timeout: 2s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: short
        accepted_content_types: [audio/pcm]
    save_as: audio
    expect:
      /bytes:
        equals: 320
  - id: retry_in_background
    client: peer
    timeout: 10s
    http:
      method: GET
      endpoint: ${fixture}
      path: /record/timeout?queries=2&pending=1&peer=${peer_key}
    expect:
      /queries:
        minimum: 2
      /pending:
        equals: 1
      /canceled:
        minimum: 1
finally:
  - id: cleanup
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
