# User Story:
# As a registered Peer governed by an external quota service,
# I want active provider streams to obey both deadlines,
# So that audio stops early and subsequent calls are denied through real Docker transport.
version: gizclaw.test/v1alpha1
name: server.quota.expire
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  fixture:
    direction: input
    type: string
    env: GIZCLAW_QUOTA_FIXTURE
  name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
  peer_key:
    direction: output
    type: string
  provider_calls:
    direction: output
    type: number
  conversation:
    direction: output
    type: string
  audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/pcm
    codec: pcm_s16le
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: quota-expire
  - id: debug
    client: peer
    rpc:
      method: server.runtime.put
      request:
        debug_mode: fullcontrol
  - id: key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: quota-test
    capture:
      api_key: /api_key
  - id: refresh
    client: peer
    timeout: 15s
    http:
      method: POST
      path: /prepare
      endpoint: ${fixture}
      body:
        name: ${name}
    capture:
      peer_key: /public_key
  - id: identifiers_provider
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: identifiers.get
      response:
        sn: ${name}
        imeis:
          - name: modem
            tac: "12345678"
            serial: "123456"
        labels:
          - key: hardware
            value: fixture
          - key: board
            value: quota-test
  - id: speech
    client: peer
    timeout: 10s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: long
        accepted_content_types:
          - audio/pcm
    save_as: audio
    expect:
      /bytes:
        minimum: 320
        maximum: 32000
  - id: record
    client: peer
    timeout: 15s
    http:
      endpoint: ${fixture}
      method: GET
      path: /record/expire?queries=1
    expect:
      /report/identifiers/sn:
        equals: ${name}
  - id: provider_baseline
    client: peer
    http:
      method: GET
      endpoint: ${fixture}
      path: /provider-calls
    capture:
      provider_calls: /calls
  - id: subsequent_denial
    client: peer
    timeout: 10s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: short
        accepted_content_types:
          - audio/pcm
    expect_error:
      code: 7
      message_contains: Quota exhausted.
  - id: denied_chat
    client: peer
    http:
      method: POST
      path: /openai/v1/chat/completions
      status: 403
      headers:
        Authorization: Bearer ${api_key}
      body:
        model: chat
        messages: [{role: user, content: hello}]
        stream: false
    expect:
      /error/code:
        equals: quota_exhausted
      /error/type:
        equals: permission_error
      /error/message:
        equals: Quota exhausted.
  - id: conversation
    client: peer
    http:
      method: POST
      path: /openai/v1/conversations
      headers:
        Authorization: Bearer ${api_key}
      body:
        metadata:
          workflow_name: quota-eino
    capture:
      conversation: /id
  - id: denied_response
    client: peer
    http:
      method: POST
      path: /openai/v1/responses
      status: 403
      headers:
        Authorization: Bearer ${api_key}
      body:
        conversation: ${conversation}
        input: hello
    expect:
      /error/code:
        equals: quota_exhausted
      /error/type:
        equals: permission_error
      /error/message:
        equals: Quota exhausted.
  - id: no_denied_provider_call
    client: peer
    http:
      method: GET
      endpoint: ${fixture}
      path: /provider-calls
    expect:
      /calls:
        equals: ${provider_calls}
finally:
  - id: cleanup
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
