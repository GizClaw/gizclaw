# User Story:
# As a Peer using a real eino Workspace through Edge,
# I want an identifiable quota error on the affected response EOS,
# So that a rejected dialogue never starts a provider request.
version: gizclaw.test/v1alpha1
name: server.quota.dialogue.eino.unavailable
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  fixture:
    direction: input
    type: string
    env: GIZCLAW_QUOTA_FIXTURE
steps:
  - id: dialogue
    client: peer
    timeout: 25s
    http:
      endpoint: ${fixture}
      method: POST
      path: /dialogue/eino
      body:
        unavailable: true
    expect:
      /error/error_code:
        equals: QUOTA_UNAVAILABLE
      /error/error:
        equals: Quota unavailable.
      /error/error_retryable:
        equals: true
      /error/end_of_stream:
        equals: true
      /new_response:
        equals: true
      /provider_calls_after_expiry:
        equals: 0
