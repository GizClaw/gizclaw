# User Story:
# As a registered Peer governed by an external quota service,
# I want real provider calls to follow its quota decisions,
# So that identifiers, usage and both deadlines are verified.
version: gizclaw.test/v1alpha1
name: server.quota.recover
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  fixture:
    direction: input
    type: string
    env: GIZCLAW_QUOTA_FIXTURE
  name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
  peer_key:
    direction: output
    type: string
  audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/pcm
    codec: pcm_s16le
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: quota-recover
  - id: debug
    client: peer
    rpc:
      method: server.runtime.put
      request:
        debug_mode: fullcontrol
  - id: key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: quota-test
    capture:
      api_key: /api_key
  - id: refresh
    client: peer
    timeout: 15s
    http:
      method: POST
      path: /prepare
      endpoint: ${fixture}
      body:
        name: ${name}
    capture:
      peer_key: /public_key
  - id: identifiers_provider
    client: peer
    client_rpc:
      method: client.tool.v0.invoke
      tool: identifiers.get
      response:
        sn: ${name}
        imeis:
          - name: modem
            tac: "12345678"
            serial: "123456"
        labels:
          - key: hardware
            value: fixture
          - key: board
            value: quota-test
  - id: speech
    client: peer
    timeout: 10s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: short
        accepted_content_types:
          - audio/pcm
    expect_error:
      code: 7
  - id: wait_recovery
    client: peer
    timeout: 15s
    http:
      method: GET
      path: /record/recover?queries=2
      endpoint: ${fixture}
    expect:
      /queries:
        minimum: 2
  - id: recovered_speech
    client: peer
    timeout: 10s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: short
        accepted_content_types:
          - audio/pcm
    save_as: audio
    expect:
      /bytes:
        non_empty: true
  - id: usage_report
    client: peer
    timeout: 15s
    http:
      method: GET
      path: /record/recover?usage=1
      endpoint: ${fixture}
    expect:
      /report/identifiers/sn:
        equals: ${name}
      /report/identifiers/imeis:
        count: 1
      /report/identifiers/labels:
        count: 2
      /report/usage:
        non_empty: true
      /report/peer_public_key:
        equals: ${peer_key}
  - id: deny_again
    client: peer
    timeout: 15s
    http:
      method: POST
      path: /deny/recover
      endpoint: ${fixture}
      body: {}
  - id: denied_after_refresh
    client: peer
    timeout: 10s
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: short
        accepted_content_types:
          - audio/pcm
    expect_error:
      code: 7
finally:
  - id: cleanup
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
