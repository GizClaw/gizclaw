# User Story:
# As a GizClaw API key holder,
# I want exercise the server.device.telemetry.query behavior through its real transport,
# So that the Public HTTP device contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.telemetry.query
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: invalid_field
  client: peer
  http:
    method: GET
    path: /gizclaw/v1/device/telemetry?field=battery.unknown&start_time_ms=1&end_time_ms=2
    headers:
      Authorization: "Bearer ${api_key}"
    status: 400
  expect:
    /error/code:
      equals: INVALID_REQUEST
- id: primary_http
  client: peer
  http:
    method: GET
    path: /gizclaw/v1/device/telemetry?field=battery.percent&start_time_ms=1&end_time_ms=3600001&limit=10
    headers:
      Authorization: "Bearer ${api_key}"
    status: 200
  expect:
    /field:
      equals: battery.percent
    /points:
      present: true
- id: aggregate
  client: peer
  http:
    method: GET
    path: /gizclaw/v1/device/telemetry/aggregate?field=battery.percent&start_time_ms=1&end_time_ms=3600001&bucket_ms=3600000&aggregate=max
    headers:
      Authorization: "Bearer ${api_key}"
    status: 200
  expect:
    /aggregate:
      equals: max
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
