# User Story:
# As a GizClaw API key holder,
# I want to exercise server.device.mhs.validation through MHS v0,
# So that the HWD contract is verified on real transports.
version: gizclaw.test/v1alpha1
name: server.device.mhs.validation
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: unknown_instance
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/read
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: fan.main, hwd: display}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: wrong_hwd
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/read
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: display.main, hwd: battery}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: unknown_hwd
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/read
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: display.main, hwd: device}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: read_only_wifi
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: wifi.main, hwd: wifi, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: read_only_ble
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: ble.main, hwd: ble, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: read_only_modem
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: modem.main, hwd: modem, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: read_only_battery
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: battery.main, hwd: battery, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: read_only_mic
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: mic.main, hwd: mic, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: empty_display_write
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: display.main, hwd: display, value: {}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: display_over_max
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: display.main, hwd: display, value: {brightness_percent: 101}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: led_wrong_type
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: led.status, hwd: led, value: {brightness_percent: "50"}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
- id: speaker_unknown_field
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: speaker.main, hwd: speaker, value: {gain: 0.5}}
    status: 400
  expect:
    /error/code: {equals: INVALID_REQUEST}
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
