# User Story:
# As a registered device using the eino-concurrency-assistant Workflow,
# I want complete the independent benchmark.eino-concurrency-assistant.concurrency-interrupt-10 scenario,
# So that conversation behavior and cleanup remain reproducible.
version: gizclaw.test/v1alpha1
name: benchmark.eino-concurrency-assistant.concurrency-interrupt-10
repeat: 10
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: 请依次输出十二生肖，每个生肖之间用逗号分隔，不要解释
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${workspace_name}"
      collection: assistants
      workflow_name: eino-concurrency-assistant
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${workspace_name}"
- id: exercise_workflow
  client: peer
  peer_stream:
    mode: text
    interrupt_after: 250ms
    input: "${prompt}"
    require_audio: false
  expect:
    "/events":
      non_empty: true
    "/interrupted":
      equals: true
finally:
- client: peer
  rpc:
    method: server.run.stop
    request: {}
- client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${workspace_name}"
- client: peer
  rpc:
    method: server.peer.delete
    request: {}
