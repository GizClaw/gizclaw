# User Story:
# As a registered device using the eino-concurrency-assistant Workflow,
# I want ten Push-to-Talk ASR and end-to-end first-response trials,
# So that the separately evaluated transcript, assistant output, and cleanup timings remain reproducible.
version: gizclaw.test/v1alpha1
name: benchmark.eino-concurrency-assistant.push-to-talk-concurrency-10
repeat: 10
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: eino-concurrency-assistant
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      cache: run
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: Giztest audio input
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: exercise_workflow
    client: peer
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      completion: first_response
      first_text_timeout: 2s
      first_audio_timeout: 3s
    expect:
      /events:
        non_empty: true
      /first_transcript_ms:
        minimum: 1
        maximum: 700
      /first_text_ms:
        maximum: 2000
      /first_audio_ms:
        maximum: 3000
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
