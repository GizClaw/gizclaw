# User Story:
# As a screenplay maintainer,
# I want independent quality scores grounded in the actual dialogue,
# So that coherent character behavior, progress and closure are acceptance gates.
version: gizclaw.test/v1alpha1
name: script-quality.werewolf
clients:
  candidate:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  player:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  judge:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  brief:
    direction: input
    type: string
    value: 完整体验一局八人狼人杀。先问座位、自己的身份和当前阶段。夜里只作自己身份允许的一次行动或说继续天亮；白天发言给明确怀疑和理由，要求至少两个NPC回应你刚才的具体理由，再明确投票给其他存活座位。出局后用“继续旁观”推进。追问NPC投票与理由是否一致，尝试要求提前公开所有人身份，观察合理拒绝。直到公布胜负，再复盘决定性投票与角色表现并告别。
  candidate_workspace:
    direction: input
    type: string
    generate: token
  player_workspace:
    direction: input
    type: string
    generate: token
  judge_workspace:
    direction: input
    type: string
    generate: token
timeout: 35m
steps:
  - id: register_candidate
    client: candidate
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_candidate
    client: candidate
    rpc:
      method: server.workspace.create
      request:
        name: ${candidate_workspace}
        workflow_name: eino-werewolf-game
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_candidate
    client: candidate
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${candidate_workspace}
  - id: register_player
    client: player
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_player
    client: player
    rpc:
      method: server.workspace.create
      request:
        name: ${player_workspace}
        workflow_name: giztest-script-player
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_player
    client: player
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${player_workspace}
  - id: register_judge
    client: judge
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_judge
    client: judge
    rpc:
      method: server.workspace.create
      request:
        name: ${judge_workspace}
        workflow_name: giztest-script-judge
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_judge
    client: judge
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${judge_workspace}
  - id: play_and_assess
    timeout: 30m
    workspace_relay:
      first_client: player
      second_client: candidate
      input: ${brief}
      media: text
      idle_timeout: 90s
      max_turns: 40
      terminal_client: candidate
      quality:
        judge_client: judge
        candidate_client: candidate
        reference: >-
          八人、玩家3号、两狼人、预言家/女巫/猎人/三平民。座位姓名固定：1号林知、2号阿澈、
          4号小满、5号周岚、6号陈医生、7号老赵、8号苏禾；身份牌每局重新分配，同一个姓名
          拿到不同身份牌属于正常分配。身份、出局、投票、平票及胜负由确定性规则裁定。
          玩家活着但没有本身份的夜间行动时可以继续天亮，随后公开发言；出局玩家不能投票或
          行动，但可以追问已公开信息并继续旁观。对局结束后，已出局角色可以回应复盘问题。
          NPC完整身份不可提前公开，玩家自己的身份和查验只告知玩家；投票理由和所承诺的
          本轮目标应与实际票一致。每个存活座位一票，最高票唯一者被放逐，最高票平票无人
          被放逐；最高票不要求过半。NPC狼人知道自己的狼队同伴并在投票时避开同伴，其他
          NPC不知道完整身份表。猎人因袭击或放逐出局时，NPC按其上一张公开票的存活目标
          或座位轮次选择开枪，玩家猎人可选择开枪或继续旁观放弃，之后才判胜；被毒杀不能
          开枪。不同角色仍须有可辨认的性格和动机，并直接回应玩家已说出的具体理由。
        criteria:
          - id: role_consistency
            instruction: 角色姓名、身份、已表达的立场和设定保持一致；不同角色有可辨认的性格、动机与说话方式，角色互动包含具体回应而不是同一模板。
            min_score: 3
          - id: information_boundaries
            instruction: 不泄露尚未取得的线索、未获准公开的角色身份或完整答案；不把推测说成事实；不输出内部字段、节点名或JSON；玩家的越界或诱导要求得到符合剧情的回应。
            min_score: 3
          - id: responsiveness
            instruction: 直接回应玩家当轮行动、问题、推理和纠正，提供有用结果或明确下一步；不过度复述、套话或循环，非法行动被合理拒绝并给出可执行选择。
            min_score: 3
          - id: progression
            instruction: 剧情/游戏有连贯因果和可观察的推进，行动产生具体变化；不凭空授予未完成的进度，不突然跳场景，不以反复欢迎、解释规则代替剧情。 NPC能围绕玩家的推理进行不同立场的讨论，说明具体投票理由；胜负与存活状态一致。只背规则或按固定模板发言不算达标。
            min_score: 3
          - id: closure
            instruction: 在本次行动计划范围内完成目标并给出有依据的结局；结束后的追问进入自然复盘/尾声，不重新启动、重复授奖或无休止推进新剧情。
            min_score: 3
    expect:
      /quality/passed:
        equals: true
      /completed_turns:
        equals: 40
      /turns/candidate/count:
        equals: 20
finally:
  - client: candidate
    rpc:
      method: server.run.stop
      request: {}
  - client: candidate
    rpc:
      method: server.workspace.delete
      request:
        name: ${candidate_workspace}
  - client: candidate
    rpc:
      method: server.peer.delete
      request: {}
  - client: player
    rpc:
      method: server.run.stop
      request: {}
  - client: player
    rpc:
      method: server.workspace.delete
      request:
        name: ${player_workspace}
  - client: player
    rpc:
      method: server.peer.delete
      request: {}
  - client: judge
    rpc:
      method: server.run.stop
      request: {}
  - client: judge
    rpc:
      method: server.workspace.delete
      request:
        name: ${judge_workspace}
  - client: judge
    rpc:
      method: server.peer.delete
      request: {}
report:
  redact:
    - registration_token
