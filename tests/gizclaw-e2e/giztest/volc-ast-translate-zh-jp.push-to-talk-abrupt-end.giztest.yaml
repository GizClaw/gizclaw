# User Story:
# As a device translating Chinese into Japanese in one fixed direction,
# I want a push-to-talk turn released right after the last word to be translated in full,
# So that releasing the key promptly never swallows the sentence.
version: gizclaw.test/v1alpha1
name: volc-ast-translate-zh-jp.push-to-talk-abrupt-end
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Hello from an independent Giztest workflow task.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: volc-ast-translate-zh-jp
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 你好，请给我讲一个关于勇气的小故事。
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  # The EOS follows the last spoken frame, the way a device ends the turn
  # when the key is released right after speech. The provider must still
  # translate the final sentence instead of finishing the session empty.
  - id: abrupt_end_turn
    client: peer
    timeout: 90s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      trim_trailing_silence: true
      require_text: true
      require_audio: true
    expect:
      /text:
        pattern: '勇気|物語|話'
      /audio_bytes:
        minimum: 1
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
