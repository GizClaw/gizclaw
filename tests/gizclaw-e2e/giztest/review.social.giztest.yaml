# User Story:
# As a registered device using the chatroom Workflow,
# I want complete the independent review.social scenario,
# So that conversation behavior and cleanup remain reproducible.
version: gizclaw.test/v1alpha1
name: review.social
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Hello from an independent Giztest workflow task.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
review: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: chatroom
        parameters:
          chat_room_workspace_parameters:
            agent_type: CHAT_ROOM_WORKSPACE_PARAMETERS_AGENT_TYPE_CHATROOM
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
            mode: CHAT_ROOM_MODE_DIRECT
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: Giztest audio input
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: exercise_workflow
    client: peer
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      max_events: 1024
    expect:
      /events:
        non_empty: true
  - id: confirm_review
    review_op:
      message: Confirm the ASR-backed evidence and observed behavior
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
