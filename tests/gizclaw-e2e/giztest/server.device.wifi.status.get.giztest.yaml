# User Story:
# As a GizClaw API key holder,
# I want exercise the server.device.wifi.status.get behavior through its real transport,
# So that the Public HTTP device contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.wifi.status.get
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: primary_http
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      body: {id: wifi.main, hwd: wifi}
      status: 200
    expect:
      /value/connected: {equals: true}
      /value/ssid: {equals: home}
      /value/rssi_dbm: {equals: -61}
      /value/ip: {equals: 192.0.2.20}
  - id: provider_wifi
    client: peer
    client_rpc:
      method: client.mhs.v0.read
      response: {payload: CAESBGhvbWUgw///////////ASoKMTkyLjAuMi4yMA==}
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
