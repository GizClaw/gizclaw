# User Story:
# As a device operator,
# I want to verify bounded and isolated device JSON snapshots,
# So that storage quotas and ownership hold on real transports.
version: gizclaw.test/v1alpha1
name: server.device.telemetry.kv.bytes
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: exact_frame
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000000000"
        observations:
          - kv:
              key: kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
              json_value: '""'
          - kv:
              key: frame1
              json_value: '""'
          - kv:
              key: frame2
              json_value: '""'
          - kv:
              key: frame3
              json_value: '""'
  - id: wait_exact
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/frame3/json_value:
        equals: '""'
  - id: key_and_value_boundary
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk/value:
        equals: 
  - id: delete_frame_keys
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000001000"
        observations:
          - kv:
              key: kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
              delete: true
          - kv:
              key: frame1
              delete: true
          - kv:
              key: frame2
              delete: true
          - kv:
              key: frame3
              delete: true
  - id: wait_deleted
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk:
        present: false
      /reported_kv/frame1:
        present: false
      /reported_kv/frame2:
        present: false
      /reported_kv/frame3:
        present: false
  - id: fill_0
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: fill0
              json_value: '""'
          - kv:
              key: fill1
              json_value: '""'
          - kv:
              key: fill2
              json_value: '""'
  - id: fill_1
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: fill3
              json_value: '""'
          - kv:
              key: fill4
              json_value: '""'
          - kv:
              key: fill5
              json_value: '""'
  - id: fill_2
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: fill6
              json_value: '""'
          - kv:
              key: fill7
              json_value: '""'
          - kv:
              key: fill8
              json_value: '""'
  - id: fill_3
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: fill9
              json_value: '""'
          - kv:
              key: fill10
              json_value: '""'
          - kv:
              key: fill11
              json_value: '""'
  - id: fill_last
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000002000"
        observations:
          - kv:
              key: fill12
              json_value: '""'
          - kv:
              key: fill13
              json_value: '""'
  - id: wait_fill
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/fill13/json_value:
        equals: '""'
  - id: over_storage_bytes
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000003000"
        observations:
          - kv:
              key: overflow0
              json_value: '""'
          - kv:
              key: overflow1
              json_value: '""'
          - kv:
              key: overflow2
              json_value: '""'
          - kv:
              key: fill0
              json_value: "false"
  - id: storage_marker
    client: peer
    telemetry:
      frame:
        observed_at_unix_ms: "1600000004000"
        observations:
          - kv:
              key: fill13
              json_value: '""'
  - id: wait_storage_marker
    client: peer
    rpc:
      method: server.status.get
      request: {}
    retry:
      attempts: 10
      on:
        - assertion
      delay: 100ms
    expect:
      /reported_kv/fill13/observed_at:
        equals: 2020-09-13T12:26:44Z
  - id: storage_batch_atomic
    client: peer
    http:
      method: GET
      path: /gizclaw/v1/device/status
      headers:
        Authorization: Bearer ${api_key}
      status: 200
    expect:
      /reported_kv/overflow0:
        present: false
      /reported_kv/overflow1:
        present: false
      /reported_kv/overflow2:
        present: false
      /reported_kv/fill0/value:
        equals: 
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
