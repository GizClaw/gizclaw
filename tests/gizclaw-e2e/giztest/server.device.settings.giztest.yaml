# User Story:
# As a GizClaw API key holder,
# I want to read and patch my bound device's own settings through its real transport,
# So that the settings page reaches MHS reads and writes and shows what the device accepted.
version: gizclaw.test/v1alpha1
name: server.device.settings
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: get_settings
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/mhs/v0/read
      headers:
        Authorization: Bearer ${api_key}
      status: 200
      body:
        states:
          - device_id: device.main
            state: cellular-enabled
          - device_id: device.main
            state: screen-brightness
          - device_id: device.main
            state: locale
    expect:
      /states/0/value:
        equals: true
      /states/1/value:
        equals: 60
      /states/2/value:
        equals: zh-CN
      /states/3:
        present: false
  - id: patch_settings
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: device.main
            state: screen-brightness
            value: 80
          - device_id: device.main
            state: locale
            value: en-US
          - device_id: device.main
            state: alert-mode
            value: vibrate
          - device_id: device.main
            state: key-feedback
            value: sound_and_vibrate
          - device_id: device.main
            state: default-interaction-mode
            value: push-to-talk
          - device_id: device.main
            state: auto-sleep-timeout-ms
            value: 0
          - device_id: device.main
            state: nfc-enabled
            value: false
      status: 200
    expect:
      /states/7:
        present: false
      /states/0/value:
        equals: 80
      /states/1/value:
        equals: en-US
      /states/2/value:
        equals: vibrate
      /states/3/value:
        equals: sound_and_vibrate
      /states/4/value:
        equals: push-to-talk
      /states/5/value:
        equals: 0
      /states/6/value:
        equals: false
  - id: patch_out_of_range
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: device.main
            state: screen-brightness
            value: 101
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: patch_unknown_alert_mode
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: device.main
            state: alert-mode
            value: loud
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: patch_negative_auto_sleep
    client: peer
    http:
      method: PATCH
      path: /gizclaw/v1/device/mhs/v0/states
      headers:
        Authorization: Bearer ${api_key}
      body:
        states:
          - device_id: device.main
            state: auto-sleep-timeout-ms
            value: -1
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: provider_settings_get
    client: peer
    client_rpc:
      method: client.mhs.v0.read
      response:
        states:
          - device_id: device.main
            state: cellular-enabled
            value:
              bool_value: true
          - device_id: device.main
            state: screen-brightness
            value:
              int_value: 60
          - device_id: device.main
            state: locale
            value:
              string_value: zh-CN
      expect_calls: 1
  - id: provider_settings_set
    client: peer
    client_rpc:
      method: client.mhs.v0.write
      response:
        states:
          - device_id: device.main
            state: screen-brightness
            value:
              int_value: 80
          - device_id: device.main
            state: locale
            value:
              string_value: en-US
          - device_id: device.main
            state: alert-mode
            value:
              string_value: vibrate
          - device_id: device.main
            state: key-feedback
            value:
              string_value: sound_and_vibrate
          - device_id: device.main
            state: default-interaction-mode
            value:
              string_value: push-to-talk
          - device_id: device.main
            state: auto-sleep-timeout-ms
            value:
              int_value: 0
          - device_id: device.main
            state: nfc-enabled
            value:
              bool_value: false
      expect_calls: 1
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
