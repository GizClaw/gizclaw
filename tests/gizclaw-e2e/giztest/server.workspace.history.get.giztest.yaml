# User Story:
# As a GizClaw Peer API consumer,
# I want exercise the server.workspace.history.get behavior through its real transport,
# So that the generated RPC contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.workspace.history.get
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${resource_name}"
      collection: assistants
      workflow_name: flowcraft-chat-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: primary_rpc
  client: peer
  rpc:
    method: server.workspace.history.get
    request:
      workspace_name: "${resource_name}"
      history_name: missing-history
  expect_error:
    code: 404
finally:
- id: cleanup_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${resource_name}"
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
