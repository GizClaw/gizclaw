# User Story:
# As a GizClaw API key holder,
# I want to exercise server.device.mhs.volume.clamped through MHS v0,
# So that the HWD contract is verified on real transports.
version: gizclaw.test/v1alpha1
name: server.device.mhs.volume.clamped
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: clamped_volume
  client: peer
  http:
    method: POST
    path: /gizclaw/v1/device/mhs/v0/write
    headers:
      Authorization: "Bearer ${api_key}"
    body: {id: speaker.main, hwd: speaker, value: {volume_percent: 100}}
    status: 200
  expect:
    /value/volume_percent: {equals: 85}
- id: provider_write
  client: peer
  client_rpc:
    method: client.mhs.v0.write
    response: {payload: CgIIVQ==}
    expect_calls: 1
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
