# User Story:
# As a GizClaw API key holder controlling hardware through MHS v0,
# I want a driver safety limit to clamp a requested volume and report the value in effect,
# So that the Public HTTP MHS contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.mhs.volume.clamped
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_api_key
  client: peer
  rpc:
    method: server.api_key.create
    request:
      display_name: "${resource_name}"
  capture:
    api_key: /api_key
- id: set_max_volume
  client: peer
  http:
    method: PATCH
    path: /gizclaw/v1/device/mhs/v0/states
    headers:
      Authorization: "Bearer ${api_key}"
    body: {states: [{device_id: speaker.main, state: volume, value: 100}]}
    status: 200
  expect:
    /states/0/value: {equals: 85}
- id: provider_write
  client: peer
  client_rpc:
    method: client.mhs.v0.write
    response: {states: [{device_id: speaker.main, state: volume, value: {int_value: 85}}]}
    expect_calls: 1
finally:
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
