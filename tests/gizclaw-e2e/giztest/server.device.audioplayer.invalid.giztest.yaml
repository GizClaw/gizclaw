# User Story:
# As a device API caller,
# I want to reject invalid playback requests before dispatching reverse RPC,
# So that the real server and device SDK contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.device.audioplayer.invalid
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  api_key:
    direction: output
    type: string
    secret: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_api_key
    client: peer
    rpc:
      method: server.api_key.create
      request:
        display_name: ${resource_name}
    capture:
      api_key: /api_key
  - id: invalid_index
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/audioplayer/actions/play
      headers:
        Authorization: Bearer ${api_key}
      body:
        index: 32
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: invalid_url
    client: peer
    http:
      method: PUT
      path: /gizclaw/v1/device/audioplayer/playlist
      headers:
        Authorization: Bearer ${api_key}
      body:
        items:
          - url: http://audio.example.test/a.mp3
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: invalid_repeat
    client: peer
    http:
      method: PUT
      path: /gizclaw/v1/device/audioplayer/mode
      headers:
        Authorization: Bearer ${api_key}
      body:
        repeat: shuffle
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
  - id: empty_append
    client: peer
    http:
      method: POST
      path: /gizclaw/v1/device/audioplayer/playlist/append
      headers:
        Authorization: Bearer ${api_key}
      body:
        items: []
      status: 400
    expect:
      /error/code:
        equals: INVALID_REQUEST
finally:
  - id: cleanup_peer
    client: peer
    rpc:
      method: server.peer.delete
      request: {}
