# User Story:
# As a GizClaw Peer API consumer,
# I want persist Profile-defined safety fence identifiers and reject malformed values,
# So that the generated RPC contract is verified end to end.
version: gizclaw.test/v1alpha1
name: server.workspace.safety-fence.roundtrip
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: list_profile_fences
  client: peer
  rpc:
    method: server.workflow.list
    request: {}
  expect:
    /safety_fences: {count: 4}
    /safety_fences/0/name: {equals: alpha}
    /safety_fences/1/name: {equals: bravo}
    /safety_fences/2/name: {equals: charlie}
    /safety_fences/3/name: {equals: delta}
    /safety_fences/0/prompt: {present: false}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${resource_name}"
      workflow_name: flowcraft-chat-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: missing_selection_reload
  client: peer
  rpc:
    method: server.run.workspace.reload-with-options
    request:
      workspace_name: "${resource_name}"
  expect_error:
    code: 3
    message_contains: "no safety_fence_level selection"
- id: set_alpha
  client: peer
  rpc:
    method: server.workspace.parameters.set
    request:
      name: "${resource_name}"
      parameters:
        safety_fence_level: alpha
  expect:
    /parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: alpha
- id: get_alpha
  client: peer
  rpc:
    method: server.workspace.get
    request:
      name: "${resource_name}"
  expect:
    /value/parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: alpha
- id: set_bravo
  client: peer
  rpc:
    method: server.workspace.parameters.set
    request:
      name: "${resource_name}"
      parameters:
        safety_fence_level: bravo
  expect:
    /parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: bravo
- id: get_bravo
  client: peer
  rpc:
    method: server.workspace.get
    request:
      name: "${resource_name}"
  expect:
    /value/parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: bravo
- id: set_delta
  client: peer
  rpc:
    method: server.workspace.parameters.set
    request:
      name: "${resource_name}"
      parameters:
        safety_fence_level: delta
  expect:
    /parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: delta
- id: get_delta
  client: peer
  rpc:
    method: server.workspace.get
    request:
      name: "${resource_name}"
  expect:
    /value/parameters/flowcraft_workspace_parameters/safety_fence_level:
      equals: delta
- id: invalid_patch
  client: peer
  rpc:
    method: server.workspace.parameters.set
    request:
      name: "${resource_name}"
      parameters:
        safety_fence_level: BAD
  expect_error:
    code: 3
- id: invalid_reload
  client: peer
  rpc:
    method: server.run.workspace.reload-with-options
    request:
      workspace_name: "${resource_name}"
      parameters:
        safety_fence_level: BAD
  expect_error:
    code: 3
- id: invalid_create
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: "${resource_name}-invalid"
      workflow_name: flowcraft-chat-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          safety_fence_level: BAD
  expect_error:
    code: 3
- id: reload_delta
  client: peer
  rpc:
    method: server.run.workspace.reload-with-options
    request:
      workspace_name: "${resource_name}"
      parameters:
        input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
        safety_fence_level: delta
finally:
- id: cleanup_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: cleanup_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: "${resource_name}"
- id: cleanup_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
