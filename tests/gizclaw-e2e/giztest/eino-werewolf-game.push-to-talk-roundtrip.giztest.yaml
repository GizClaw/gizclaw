# User Story:
# As a screenplay maintainer,
# I want native Werewolf replies delivered as voice,
# So that referee and character speech can be verified together.
version: gizclaw.test/v1alpha1
name: eino-werewolf-game.push-to-talk-roundtrip
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        workflow_name: eino-werewolf-game
        parameters:
          eino_workspace_parameters:
            agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_1
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: 开始狼人杀
        accepted_content_types:
          - audio/ogg
    save_as: input_audio
  - id: empty_push_to_talk_turn
    client: peer
    peer_stream:
      mode: push-to-talk
      empty_input: true
      completion: input_sent
    expect:
      /input_sent:
        equals: true
      /input_packets:
        equals: 0
  - id: play_1
    client: peer
    timeout: 120s
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
      trim_trailing_silence: true
      wait_for_history: true
    expect:
      /first_text_ms:
        minimum: 1
      /first_audio_ms:
        minimum: 1
      /reply:
        contains: 【法官公示】
      /history_name:
        non_empty: true
  - id: play_2
    client: peer
    timeout: 120s
    peer_stream:
      mode: text
      input: 继续天亮
      require_text: true
      require_audio: true
      wait_for_history: true
    expect:
      /reply:
        contains: 【法官公示】
        not_contains:
          - 【林知】
          - 【阿澈】
          - 【小满】
          - 【周岚】
          - 【陈医生】
          - 【老赵】
          - 【苏禾】
      /first_audio_ms:
        minimum: 1
      /audio_integrity/max_active:
        equals: 1
      /audio_integrity/open:
        equals: 0
      /audio_integrity/violations:
        equals: 0
      /audio_integrity/streams:
        equals: 1
      /text_eos:
        equals: true
      /audio_eos:
        equals: true
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
