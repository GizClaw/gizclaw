# User Story:
# As a member of a deleted cross-server group,
# I want to recreate its local name and invite only selected former members,
# So that the new Workspace restores audio without including uninvited former members.
# Uses a committed two-second Opus tone; media assertions are never retried.
version: gizclaw.test/v1alpha1
name: sfu.friend-group.delete-recreate.audio-bytes
timeout: 5m
clients:
  alice:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_a}
    registration_token: ${token_a}
  bob:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_b}
    registration_token: ${token_b}
  carol:
    identity: ephemeral
    connection: webrtc
    access_point: ${edge_a}
    registration_token: ${token_a}
variables:
  edge_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_A
  edge_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_EDGE_B
  token_a:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_A
    secret: true
  token_b:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN_B
    secret: true
  tone:
    direction: input
    type: audio
    env: GIZCLAW_TEST_SFU_TONE_OGG_BASE64
    media_type: audio/ogg
    codec: opus
    max_bytes: 262144
  group:
    direction: input
    type: string
    generate: token
  group_invite:
    direction: output
    type: string
    secret: true
  group_workspace:
    direction: output
    type: string
  bob_member:
    direction: output
    type: string
  bob_public_key:
    direction: output
    type: string
  carol_member:
    direction: output
    type: string
  carol_public_key:
    direction: output
    type: string
  old_workspace:
    direction: output
    type: string
  new_workspace:
    direction: output
    type: string
  new_invite:
    direction: output
    type: string
    secret: true
steps:
  - id: create_group
    client: alice
    rpc:
      method: server.friend_group.create
      request: {name: '${group}'}
    capture:
      group_workspace: /workspace_name
    expect:
      /workspace_name: {non_empty: true}
  - id: invite_group
    client: alice
    rpc:
      method: server.friend_group.invite_token.create
      request: {friend_group_name: '${group}'}
    capture:
      group_invite: /invite_token
  - id: join_group_bob
    client: bob
    rpc:
      method: server.friend_group.join
      request: {invite_token: '${group_invite}', name: '${group}'}
    capture:
      bob_member: /member/name
      bob_public_key: /member/peer_public_key
    expect:
      /group/workspace_name: {equals: '${group_workspace}'}
  - id: join_group_carol
    client: carol
    rpc:
      method: server.friend_group.join
      request: {invite_token: '${group_invite}', name: '${group}'}
    capture:
      carol_member: /member/name
      carol_public_key: /member/peer_public_key
    expect:
      /group/workspace_name: {equals: '${group_workspace}'}
  - id: alice_initial
    client: alice
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: alice_initial_running
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: bob_initial
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: bob_initial_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: carol_initial
    client: carol
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${group_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${group_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: carol_initial_running
    client: carol
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${group_workspace}'}
  - id: baseline
    timeout: 20s
    parallel:
      - id: baseline_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: baseline_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: baseline_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: baseline_bob_speak
        client: bob
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /baseline_alice_listen/audio_bytes: {minimum: 2000}
      /baseline_alice_listen/packets: {minimum: 50}
      /baseline_carol_listen/audio_bytes: {minimum: 2000}
      /baseline_carol_listen/packets: {minimum: 50}
      /baseline_bob_listen/audio_bytes: {maximum: 0}
      /baseline_bob_speak/input_sent: {equals: true}
  - id: save_old_workspace
    client: alice
    rpc:
      method: server.friend_group.get
      request: {name: '${group}'}
    capture:
      old_workspace: /workspace_name
  - id: delete_group
    client: alice
    rpc:
      method: server.friend_group.delete
      request: {name: '${group}'}
  - id: alice_revoked
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$}
  - id: bob_revoked
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$}
  - id: carol_revoked
    client: carol
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STOPPED|ERROR)$}
  - id: recreate_group
    client: alice
    rpc:
      method: server.friend_group.create
      request: {name: '${group}'}
    capture:
      new_workspace: /workspace_name
    expect:
      /workspace_name: {non_empty: true, not_contains: '${old_workspace}'}
  - id: new_invite
    client: alice
    rpc:
      method: server.friend_group.invite_token.create
      request: {friend_group_name: '${group}'}
    capture:
      new_invite: /invite_token
  - id: bob_joins_new_group
    client: bob
    rpc:
      method: server.friend_group.join
      request: {invite_token: '${new_invite}', name: '${group}'}
    expect:
      /group/workspace_name: {equals: '${new_workspace}'}
  - id: only_two_new_members
    client: alice
    rpc:
      method: server.friend_group.members.list
      request: {friend_group_name: '${group}'}
    expect:
      /items: {count: 2}
  - id: alice_new
    client: alice
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${new_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${new_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: alice_new_running
    client: alice
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${new_workspace}'}
  - id: bob_new
    client: bob
    rpc:
      method: server.run.workspace.set
      request: {workspace_name: '${new_workspace}'}
    expect:
      /selected_workspace_name: {equals: '${new_workspace}'}
      /runtime_state: {pattern: ^PEER_RUN_STATUS_STATE_(STARTING|RUNNING)$}
  - id: bob_new_running
    client: bob
    retry: {attempts: 10, on: [assertion], delay: 1s}
    rpc:
      method: server.run.workspace.get
      request: {}
    expect:
      /runtime_state: {equals: PEER_RUN_STATUS_STATE_RUNNING}
      /selected_workspace_name: {equals: '${new_workspace}'}
  - id: new_forward
    timeout: 20s
    parallel:
      - id: new_forward_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: new_forward_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: new_forward_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: new_forward_alice_speak
        client: alice
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /new_forward_bob_listen/audio_bytes: {minimum: 2000}
      /new_forward_bob_listen/packets: {minimum: 50}
      /new_forward_carol_listen/audio_bytes: {maximum: 0}
      /new_forward_alice_listen/audio_bytes: {maximum: 0}
      /new_forward_alice_speak/input_sent: {equals: true}
  - id: new_reverse
    timeout: 20s
    parallel:
      - id: new_reverse_alice_listen
        client: alice
        peer_stream: {mode: listen, duration: 5s}
      - id: new_reverse_carol_listen
        client: carol
        peer_stream: {mode: listen, duration: 5s}
      - id: new_reverse_bob_listen
        client: bob
        peer_stream: {mode: listen, duration: 5s}
      - id: new_reverse_bob_speak
        client: bob
        delay: 200ms
        peer_stream: {mode: push-to-talk, input: '${tone}', pacing: 20ms, completion: input_sent}
    expect:
      /new_reverse_alice_listen/audio_bytes: {minimum: 2000}
      /new_reverse_alice_listen/packets: {minimum: 50}
      /new_reverse_carol_listen/audio_bytes: {maximum: 0}
      /new_reverse_bob_listen/audio_bytes: {maximum: 0}
      /new_reverse_bob_speak/input_sent: {equals: true}
finally:
  - client: alice
    rpc:
      method: server.run.stop
      request: {}
  - client: bob
    rpc:
      method: server.run.stop
      request: {}
  - client: carol
    rpc:
      method: server.run.stop
      request: {}
  - client: alice
    rpc:
      method: server.friend_group.delete
      request: {name: '${group}'}
  - client: alice
    rpc:
      method: server.peer.delete
      request: {}
  - client: bob
    rpc:
      method: server.peer.delete
      request: {}
  - client: carol
    rpc:
      method: server.peer.delete
      request: {}
report:
  redact:
    - token_a
    - token_b
    - group_invite
    - new_invite
