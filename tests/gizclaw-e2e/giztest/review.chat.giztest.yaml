# User Story:
# As a registered device using the flowcraft-voice-assistant Workflow,
# I want complete the independent review.chat scenario,
# So that conversation behavior and cleanup remain reproducible.
version: gizclaw.test/v1alpha1
name: review.chat
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  resource_name:
    direction: input
    type: string
    generate: token
  workspace_name:
    direction: input
    type: string
    generate: token
  prompt:
    direction: input
    type: string
    value: Hello from an independent Giztest workflow task.
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  review_evidence:
    direction: output
    type: string
  assistant_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
review: true
steps:
  - id: register_peer
    client: peer
    rpc:
      method: server.register
      request:
        token: ${registration_token}
  - id: create_workspace
    client: peer
    rpc:
      method: server.workspace.create
      request:
        name: ${workspace_name}
        collection: assistants
        workflow_name: flowcraft-voice-assistant
        parameters:
          flowcraft_workspace_parameters:
            agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
            input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
  - id: select_workspace
    client: peer
    rpc:
      method: server.run.workspace.set
      request:
        workspace_name: ${workspace_name}
  - id: synthesize_input
    client: peer
    speech:
      method: server.speech.synthesize
      request:
        voice_name: narrator
        text: Giztest audio input
        accepted_content_types: [audio/ogg]
    save_as: input_audio
  - id: exercise_workflow
    client: peer
    peer_stream:
      mode: push-to-talk
      input: ${input_audio}
      pacing: 20ms
    expect:
      /events:
        non_empty: true
    capture:
      assistant_audio: /audio
  - id: transcribe_review_evidence
    client: peer
    speech:
      method: server.speech.transcribe
      request:
        model_name: asr
        language: en
      input: ${assistant_audio}
    capture:
      review_evidence: /transcript
    expect:
      /transcript:
        non_empty: true
  - id: show_review_evidence
    output:
      variable: review_evidence
  - id: confirm_review
    review_op:
      message: Confirm the bounded transcript/assistant text above matches the observed audio behavior
finally:
  - client: peer
    rpc:
      method: server.run.stop
      request: {}
  - client: peer
    rpc:
      method: server.workspace.delete
      request:
        name: ${workspace_name}
  - client: peer
    rpc:
      method: server.peer.delete
      request: {}
