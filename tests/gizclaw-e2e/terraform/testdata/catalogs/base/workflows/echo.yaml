apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata: {id: tf-echo}
spec:
  driver: eino
  eino:
    graph:
      name: tf-echo
      compile: {node_trigger_mode: any_predecessor}
      state:
        fields: [{name: answer, type: string, merge: replace}]
      nodes:
        - id: passthrough
          type: passthrough
          inputs: {value: {from: input.text}}
          outputs: {value: answer}
      edges: [{from: start, to: passthrough}, {from: passthrough, to: end}]
      branches: []
      outputs:
        - {node: passthrough, field: answer, name: assistant, mime_type: text/plain, primary: true}
